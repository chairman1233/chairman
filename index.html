/* ---------- geocoding ----------
   A single free-text query fails whenever the postal city differs from the
   municipality — "18617 Egret Bay Blvd, Houston 77058" is really in Webster,
   so Nominatim returns nothing. Structured search with the city dropped out
   resolves it. We try narrowest-to-widest and stop at the first hit. */
const STATE_WORDS={alabama:"AL",alaska:"AK",arizona:"AZ",arkansas:"AR",california:"CA",
 colorado:"CO",connecticut:"CT",delaware:"DE",florida:"FL",georgia:"GA",hawaii:"HI",idaho:"ID",
 illinois:"IL",indiana:"IN",iowa:"IA",kansas:"KS",kentucky:"KY",louisiana:"LA",maine:"ME",
 maryland:"MD",massachusetts:"MA",michigan:"MI",minnesota:"MN",mississippi:"MS",missouri:"MO",
 montana:"MT",nebraska:"NE",nevada:"NV",ohio:"OH",oklahoma:"OK",oregon:"OR",pennsylvania:"PA",
 tennessee:"TN",texas:"TX",utah:"UT",vermont:"VT",virginia:"VA",washington:"WA",wisconsin:"WI",
 wyoming:"WY"};
function parseUSAddress(raw){
 let s=String(raw||"").replace(/\n/g,", ").replace(/\s+/g," ").trim();
 /* Spelled-out states are common in pasted addresses; normalise first so the
    abbreviation matcher below can see them. */
 Object.keys(STATE_WORDS).forEach(word=>{
  s=s.replace(new RegExp("\\b"+word+"\\b","i"),STATE_WORDS[word]);
 });
 /* Take the LAST five-digit run, never the first — "18617 Egret Bay" starts
    with a five-digit house number that was being read as the postcode. */
 const zips=s.match(/\b\d{5}(?:-\d{4})?\b/g)||[];
 const zip=zips.length?zips[zips.length-1].slice(0,5):"";
 const st=(s.match(/\b(A[LKZR]|C[AOT]|D[EC]|FL|GA|HI|I[ADLN]|K[SY]|LA|M[ADEINOST]|N[CDEHJMVY]|O[HKR]|P[A]|RI|S[CD]|T[NX]|UT|V[AT]|W[AIVY])\b(?=[\s,]*(?:\d{5}|$))/i)||[])[1]||"";
 let rest=zip?s.slice(0,s.lastIndexOf(zips[zips.length-1])):s;
 rest=rest.replace(/[,\s]+$/,"");
 if(st)rest=rest.replace(new RegExp("\\b"+st+"\\b\\s*,?\\s*$","i"),"").replace(/[,\s]+$/,"");
 const parts=rest.split(",").map(x=>x.trim()).filter(Boolean);
 const street=parts[0]||"";
 const city=parts.length>1?parts[parts.length-1]:"";
 return {street,city,state:st.toUpperCase(),postalcode:zip,free:s};
}
let _geoLast=0;
async function nomiFetch(params){
 /* Nominatim asks for no more than one request a second. Honour it. */
 const wait=Math.max(0,1100-(Date.now()-_geoLast));
 if(wait)await new Promise(r=>setTimeout(r,wait));
 _geoLast=Date.now();
 const qs=new URLSearchParams(Object.assign({format:"jsonv2",limit:"1",countrycodes:"us"},params));
 const r=await fetch("https://nominatim.openstreetmap.org/search?"+qs.toString());
 if(!r.ok)return null;
 const j=await r.json();
 return j&&j[0]?{lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name}:null;
}
/* narrowest first, then progressively drop the parts most likely to be wrong */
async function geocodeAddress(raw){
 const a=parseUSAddress(raw);
 const tries=[];
 if(a.street&&(a.postalcode||a.city))
  tries.push(Object.assign({street:a.street},a.city?{city:a.city}:{},a.state?{state:a.state}:{},a.postalcode?{postalcode:a.postalcode}:{}));
 if(a.street&&a.postalcode)                                  /* city is the usual liar */
  tries.push(Object.assign({street:a.street,postalcode:a.postalcode},a.state?{state:a.state}:{}));
 if(a.street&&a.state)tries.push({street:a.street,state:a.state});
 /* No commas means the city is probably stuck on the end of the street —
    "18617 Egret Bay Boulevard Houston". Try again without that last word. */
 const trimmed=a.street.replace(/\s+\S+$/,"");
 if(a.postalcode&&trimmed&&trimmed!==a.street)tries.push({street:trimmed,postalcode:a.postalcode});
 if(a.postalcode&&a.street)tries.push({q:a.street+" "+a.postalcode});
 if(a.postalcode&&trimmed)tries.push({q:trimmed+" "+a.postalcode});
 tries.push({q:a.free});
 for(const t of tries){
  try{const hit=await nomiFetch(t);if(hit)return hit;}catch(e){}
 }
 return null;
}
async function geocodeJob(id){
 const j=job(id);if(!j||!j.address)return;
 toast("Locating…");
 try{
  const hit=await geocodeAddress(j.address);
  if(hit){j.lat=hit.lat;j.lon=hit.lon;j.geoFail=false;save();render();toast("Pinned");}
  else {j.geoFail=true;save();render();
   toast("Couldn't find \""+j.address+"\" — check the street and ZIP");}
 }catch(e){toast("Needs internet");}
}
/* An address the app silently failed to locate is worse than no address —
   it looks fine on the job and then there is no pin and no directions. */
const geoUnresolved=j=>!!(j.address&&!j.lat&&j.status!=="Lost");
/* ---- home base: measure everything from where he starts the day ---- */
function homeBase(){const m=D.me||{};return (m.homeLat&&m.homeLon)?{lat:+m.homeLat,lon:+m.homeLon,addr:m.addr||""}:null;}
/* straight-line miles. Honest name, because Houston roads are not straight. */
function directMiles(aLat,aLon,bLat,bLon){
 const R=3958.8,rad=x=>x*Math.PI/180;
 const dLat=rad(bLat-aLat),dLon=rad(bLon-aLon);
 const s=Math.sin(dLat/2)**2+Math.cos(rad(aLat))*Math.cos(rad(bLat))*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
const milesFromHome=j=>{const h=homeBase();
 return (h&&j.lat&&j.lon)?directMiles(h.lat,h.lon,j.lat,j.lon):null;};
/* Real drive time and mileage without paying anyone: hand it to Google Maps on tap. */
function directionsURL(j){
 const h=homeBase(),to=encodeURIComponent(j.address||(j.lat+","+j.lon));
 const from=h?encodeURIComponent(h.addr||(h.lat+","+h.lon)):"";
 return "https://www.google.com/maps/dir/?api=1"+(from?"&origin="+from:"")+"&destination="+to;
}

async function setHomeBase(){
 const m=D.me||{};
 if(!m.addr){toast("Add your business address first");return;}
 toast("Locating…");
 try{
  const hit=await geocodeAddress(m.addr);
  if(!hit){toast("Couldn't find that address — check the street and ZIP");return;}
  m.homeLat=hit.lat;m.homeLon=hit.lon;m.homeAddrAt=m.addr;save();render();
  toast("Home base set — "+hit.label.split(",").slice(0,3).join(",").trim());
 }catch(e){toast("Needs internet");}
}
/* Coordinates that were never re-derived after the address changed make every
   distance on the Map wrong, quietly. Say so. */
const homeStale=()=>{const m=D.me||{};
 return !!(m.homeLat&&m.addr&&m.homeAddrAt&&m.homeAddrAt.trim()!==m.addr.trim());};
const homeUnverified=()=>{const m=D.me||{};return !!(m.homeLat&&m.addr&&!m.homeAddrAt);};
/* Nominatim asks for max 1 lookup a second. Respect it or get blocked. */
async function pinAll(){
 const todo=D.jobs.filter(j=>j.address&&!j.lat&&j.status!=="Lost");
 if(!todo.length)return;
 toast("Pinning "+todo.length+"…");
 let done=0;
 for(const j of todo){
  try{
   const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=us&q="
    +encodeURIComponent(j.address));
   const h=(await r.json())[0];
   if(h){j.lat=+h.lat;j.lon=+h.lon;done++;}
  }catch(e){}
  await new Promise(r=>setTimeout(r,1100));
 }
 save();render();
 toast(done?"Pinned "+done+" of "+todo.length:"None of those could be found");
}
function mapJobs(){

}

function drawMap(){
 const box=document.getElementById("mapbox");if(!box)return;
 const pins=mapJobs(),h=homeBase();
 if(!pins.length&&!h){box.innerHTML=`<div class="empty" style="padding:60px 20px"><div class="g dim">◎</div>
   <div class="ser" style="font-size:19px">Nothing pinned yet</div>
   <p class="sm dim" style="margin-top:8px">Add an address to a job and pick it from the lookup, or hit "Pin it".</p></div>`;return;}
 const start=()=>{
  try{
   box.innerHTML="";
   const first=pins[0]||h;
   const map=L.map(box).setView([first.lat,first.lon],11);
   /* Coloured pins vanish against a bright street map. Match the theme so
      they read instantly — both basemaps are free. */
   const night=D.theme!=="paper";
   L.tileLayer(night
     ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
     : "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {maxZoom:19,subdomains:"abcd",
     attribution:"© OpenStreetMap © CARTO"}).addTo(map);
   const g=[];
   if(h){
    L.marker([h.lat,h.lon],{zIndexOffset:1000,icon:L.divIcon({className:"jobpin",iconSize:null,iconAnchor:[14,14],
      html:`<div style="display:flex;align-items:center;gap:7px;white-space:nowrap">
        <div style="width:28px;height:28px;border-radius:8px;background:#F2ECDE;color:#000;
         border:3px solid #000;display:grid;place-items:center;flex:none;
         font:bold 14px Georgia,serif;box-shadow:0 2px 8px rgba(0,0,0,.9)">C</div>
        <span style="font:600 12.5px -apple-system,Segoe UI,sans-serif;color:#000;
         background:#F2ECDE;border-radius:6px;padding:3px 8px">HOME BASE</span></div>`})})
     .addTo(map).bindPopup("<b>Home base</b><br>"+esc(h.addr||"").replace(/\n/g,"<br>"));
    g.push([h.lat,h.lon]);
   }

let _pom=null;
const POM=()=>{if(!D.pom)D.pom={work:25,rest:5,done:0,day:today(),jobId:null,on:false};
 if(D.pom.day!==today()){D.pom.day=today();D.pom.done=0;}return D.pom;};
function pomStart(mode){
 const P=POM();const mins2=mode==="rest"?P.rest:P.work;
 _pom={mode,end:Date.now()+mins2*60000,jobId:P.jobId||D.jobs.find(j=>j.timerAt)?.id||D.last||null};
 P.on=true;save();render();toast(mode==="rest"?"Break — "+P.rest+" min":"Focus — "+P.work+" min");
}
function pomStop(){
 const P=POM();P.on=false;
 /* stopping the focus block stops the job clock with it */
 if(_pom&&_pom.mode==="work"&&_pom.jobId){const j=job(_pom.jobId);if(j&&j.timerAt)toggleTimer(j.id);}
 _pom=null;save();render();
}
function pomTick(){
 if(!_pom)return;
 if(Date.now()>=_pom.end){
  const wasWork=_pom.mode==="work";
  if(wasWork){
   const P=POM();P.done++;
   /* credit the session to the job it was worked on */
   const pj=_pom.jobId?job(_pom.jobId):null;
   if(pj)pj.pomDone=(+pj.pomDone||0)+1;
   save();
   /* the break is not billable, so the job clock stops for it */
   D.jobs.forEach(j=>{if(j.timerAt){j.timeMin=(+j.timeMin||0)+Math.max(0,Math.round((Date.now()-new Date(j.timerAt))/60000));j.timerAt=null;}});
   takeBreakQuiet();notify("Pomodoro done","Take "+POM().rest+" minutes.");_pom=null;pomStart("rest");}
  else{
   notify("Break's over","Back at it.");
   const P=POM(),back=P.jobId?job(P.jobId):null;
   _pom=null;
   /* straight back into the next block on the same job */
   if(back){if(!back.timerAt)toggleTimer(back.id);pomStart("work");}
   else{P.on=false;save();render();}
  }
  return;
 }
 const el=document.getElementById("pomClock");
 if(el)el.textContent=pomLeft();
}
function takeBreakQuiet(){const c=CK_(),k=today();const rec=c.days[k]=c.days[k]||{};
 rec.breaks=rec.breaks||[];rec.breaks.push(hm(new Date()));save();}
const pomLeft=()=>{if(!_pom)return"";const ms=Math.max(0,_pom.end-Date.now());
 const m=Math.floor(ms/60000),sec=Math.floor(ms%60000/1000);
 return m+":"+String(sec).padStart(2,"0");};
setInterval(pomTick,1000);

    <div class="ser" id="pomClock" style="font-size:34px;margin-top:4px;font-variant-numeric:tabular-nums">${pomLeft()}</div></div>

/* ================= TIME CLOCK ================= */
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DEFSHIFT={s:"07:00",e:"17:00"};
const CK_=()=>{
 if(!D.clock)D.clock={sched:{},days:{}};
 if(!D.clock.days)D.clock.days={};
 if(!D.clock.sched)D.clock.sched={};
 /* older saves stored a bare start time string — give it an end too */
 let changed=false;
 [0,1,2,3,4,5,6].forEach(i=>{
  const v=D.clock.sched[i];
  if(typeof v==="string"){D.clock.sched[i]=v?{s:v,e:""}:null;changed=true;}
  else if(v===undefined){D.clock.sched[i]=(i>=1&&i<=5)?{s:DEFSHIFT.s,e:DEFSHIFT.e}:null;changed=true;}
 });
 if(changed)try{save()}catch(e){}
 return D.clock;};
const shiftOf=iso=>{const v=CK_().sched[new Date(iso+"T00:00:00").getDay()];return (v&&v.s)?v:null;};
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const mins=t=>{if(!t)return null;const[a,b]=t.split(":").map(Number);return a*60+b;};
const h12=t=>{if(!t)return "—";let[a,b]=t.split(":").map(Number);const ap=a<12?"AM":"PM";
 a=a%12||12;return a+":"+String(b).padStart(2,"0")+" "+ap;};
const h12s=t=>{if(!t)return"";let[a,b]=t.split(":").map(Number);const ap=a<12?"a":"p";
 a=a%12||12;return a+(b?":"+String(b).padStart(2,"0"):"")+ap;};
const START_TIMES=["07:00","08:00","09:00","10:00","11:00","13:00","14:00","15:00"];
const hs=t=>{if(!t)return"";let[a,b]=t.split(":").map(Number);a=a%12||12;return a+(b?":"+String(b).padStart(2,"0"):"");};
/* order a day's work: earliest start first, then priority */
const calSort=a=>[...a].sort((x,y)=>(x.startTime||"99:99").localeCompare(y.startTime||"99:99")
 ||prioRank(x)-prioRank(y)||(x.dueDate||"9999").localeCompare(y.dueDate||"9999"));
const dur=m=>{if(m==null)return "—";const h=Math.floor(m/60),x=m%60;return (h?h+"h ":"")+x+"m";};
const dayKey=d=>isoDay(d);
const schedFor=iso=>{const v=shiftOf(iso);return v?v.s:"";};
/* ---- punch segments -------------------------------------------------------
   A day held ONE in/out pair. Clocking in again on a day that already had an
   out simply overwrote `in`, leaving out < in — which the duration maths read
   as negative, added 1440 to, and reported as "23h 59m", rolling 24.0 into the
   week total. Days now hold an array of segments so a lunch break or a second
   trip out is expressible. `in`/`out` remain as derived first-in / last-out so
   every existing screen keeps working untouched. */
function segsOf(rec){
 if(!rec)return [];
 if(Array.isArray(rec.segs))return rec.segs;
 return rec.in?[{in:rec.in,out:rec.out||null}]:[];   /* lazy migration, non-destructive */
}
function segMins(s,isToday){
 if(!s||!s.in)return 0;
 const a=mins(s.in);
 const b=s.out?mins(s.out):(isToday?mins(hm(new Date())):null);
 if(a==null||b==null)return 0;
 let d=b-a;
 if(d<0)d+=1440;                 /* genuinely crossed midnight */
 if(d>=1439)return 0;            /* 23h59m is the corruption signature — never count it */
 return Math.max(0,d);
}
const dayWorked=(rec,isToday)=>segsOf(rec).reduce((n,s)=>n+segMins(s,isToday),0);
function openSeg(rec){const ss=segsOf(rec),l=ss[ss.length-1];return (l&&!l.out)?l:null;}

function clockState(iso){
 const c=CK_(),k=iso||today(),rec=c.days[k]||{},sh=shiftOf(k),target=sh?sh.s:"";
 const endT=sh&&sh.e?sh.e:"";
 const ss=segsOf(rec),first=ss[0]||null,last=ss[ss.length-1]||null,open=openSeg(rec);
 const inTime=first?first.in:undefined;
 const outTime=(!open&&last)?last.out:undefined;
 const inM=mins(inTime),tM=mins(target);
 const late=(inM!=null&&tM!=null)?Math.max(0,inM-tM):null;
 const outM=mins(outTime);
 const worked=ss.length?dayWorked(rec,k===today()):null;
 const planned=(target&&endT)?Math.max(0,mins(endT)-mins(target)):null;
 const early=(endT&&outM!=null)?Math.max(0,mins(endT)-outM):0;
 const over=(endT&&outM!=null)?Math.max(0,outM-mins(endT)):0;
 return {rec,segs:ss,open:!!open,target,endT,planned,early,over,
  in:inTime,out:outTime,late,worked,off:!target};
}
function clockIn(){
 const c=CK_(),k=today(),rec=c.days[k]||{};
 if(openSeg(rec)){toast("Already on the clock");return;}
 const ss=segsOf(rec).slice();
 ss.push({in:hm(new Date()),out:null});
 const next=Object.assign({},rec,{segs:ss,in:ss[0].in});
 delete next.out;                       /* still running — no last-out yet */
 c.days[k]=next;save();render();
 const s=clockState(),again=ss.length>1;
 toast(again?"Back on the clock — segment "+ss.length
   :(s.late>0?"Clocked in — "+dur(s.late)+" late":"Clocked in — on time"));
 if(!again){
  say(s.late>0?`Clocked in ${dur(s.late)} late. What happened?`:"Clocked in on time. Let's work.");
  if(s.late>0)setTimeout(lateGate,420);   /* the late gate belongs to the FIRST punch only */
 }
}
function clockOut(){
 const c=CK_(),k=today(),rec=c.days[k]||{};
 const open=openSeg(rec);
 if(!open){toast("Not on the clock");return;}
 const now=hm(new Date());
 open.out=now;
 const ss=segsOf(rec);
 c.days[k]=Object.assign({},rec,{segs:ss,in:ss[0].in,out:now});
 let stopped=0;
 D.jobs.forEach(j=>{if(j.timerAt){
  j.timeMin=(+j.timeMin||0)+Math.max(0,Math.round((Date.now()-new Date(j.timerAt))/60000));
  j.timerAt=null;stopped++;}});
 save();render();const s=clockState();
 toast("Clocked out — "+dur(s.worked)+" today"+(ss.length>1?" across "+ss.length+" segments":"")
  +(stopped?" · "+plural(stopped,"timer")+" stopped":""));
}
function editClock(){
 const s=clockState(),ss=s.segs;
 sheet("Fix today's times",`
  <p class="sm dim" style="margin:0 0 18px">Forgot to hit the button? Set the real times. Out must be after in.</p>
  <div id="segrows">${ss.length?ss.map((g,i)=>`
   <div class="row" style="gap:10px;margin-bottom:10px;align-items:center">
    <span class="xs dim" style="width:22px;flex:none">${i+1}</span>
    <input class="in" type="time" value="${g.in||""}" onchange="segEdit(${i},'in',this.value)" style="margin:0">
    <span class="dim">to</span>
    <input class="in" type="time" value="${g.out||""}" onchange="segEdit(${i},'out',this.value)" style="margin:0">
    <button class="ico" style="border:0;color:var(--ink3);flex:none" onclick="segDel(${i})">✕</button>
   </div>`).join("")
  :`<p class="xs dim">No punches today.</p>`}</div>
  <button class="opt2" onclick="segAdd()">+ Add a segment</button>
  <div class="ln2 tot" style="margin-top:18px"><span class="k">Today</span>
   <span class="v">${dur(s.worked)||"0m"}</span></div>
  <button class="btn" onclick="close_();render()">Done</button>
  <button class="btn warn" onclick="clearClock()">Clear today</button>`);}
function segEdit(i,f,v){
 const c=CK_(),k=today(),rec=c.days[k]||{};
 const ss=segsOf(rec).slice();if(!ss[i])return;
 ss[i]=Object.assign({},ss[i],{[f]:v||null});
 const g=ss[i];
 if(g.in&&g.out&&mins(g.out)<=mins(g.in)){
  toast("Out has to be after in");close_();editClock();return;   /* refuse impossible data */
 }
 commitSegs(ss);close_();editClock();
}
function segAdd(){const c=CK_(),k=today();const ss=segsOf(c.days[k]||{}).slice();
 ss.push({in:hm(new Date()),out:null});commitSegs(ss);close_();editClock();}
function segDel(i){const c=CK_(),k=today();const ss=segsOf(c.days[k]||{}).slice();
 ss.splice(i,1);commitSegs(ss);close_();editClock();}
function commitSegs(ss){
 const c=CK_(),k=today(),rec=c.days[k]||{};
 ss=ss.filter(g=>g&&g.in).sort((a,b)=>mins(a.in)-mins(b.in));
 if(!ss.length){delete c.days[k];save();render();return;}
 const last=ss[ss.length-1];
 const next=Object.assign({},rec,{segs:ss,in:ss[0].in});
 if(last.out)next.out=last.out;else delete next.out;
 c.days[k]=next;save();render();
}
function saveClock(){close_();render();}   /* legacy entry point — segments save as they change */
function clearClock(){const c=CK_();delete c.days[today()];save();close_();render();toast("Cleared");}
/* Monday-start week */
function weekDays(){const n=new Date(),d=n.getDay(),back=(d+6)%7,out=[];
 for(let i=0;i<7;i++){const x=new Date(n);x.setDate(n.getDate()-back+i);out.push(dayKey(x));}
 return out;}
function weekStats(){
 const t=today();let onTime=0,lateDays=0,worked=0,scheduled=0,lateTotal=0,plannedMin=0;
 for(const k of weekDays()){
  if(k>t)continue;
  const s=clockState(k);
  if(!s.off){scheduled++;if(s.planned)plannedMin+=s.planned;}
  if(s.in){ if(s.late>0){lateDays++;lateTotal+=s.late;} else if(!s.off)onTime++; }
  /* an open shift used to contribute nothing, so "Total 0.0h" sat next to
     "ACTIVE NOW 3h 14m" — count elapsed time for the shift still running */
  if(s.in)worked+=dayWorked(s.rec,k===t);   /* sums segments; 23h59m corruption refused */
 }
 return {onTime,lateDays,worked,scheduled,lateTotal,plannedMin};
}
function clockHTML(){
 const s=clockState(),w=weekStats(),now=new Date();
 const nowM=mins(hm(now)),tM=mins(s.target);
 const overdue=!s.in&&!s.off&&tM!=null&&nowM>tM?nowM-tM:0;
 const C=s.off?"lost":!s.in?(overdue?"out":"est"):s.late>0?(s.late>=10?"out":"rdy"):"paid";
 let head,sub;
 if(s.off){head="Day off";sub="No start time set for "+DOWFULL[now.getDay()]+".";}
 else if(!s.in){head=overdue?"Not clocked in":"Not started";
  sub=overdue?"It's "+h12(hm(now))+" — "+dur(overdue)+" past your "+h12(s.target)+" start."
   :"You're on at "+h12(s.target)+(s.endT?" until "+h12(s.endT):"")+".";}
 else if(s.out){head=dur(s.worked)+" today";
  sub=h12(s.in)+" – "+h12(s.out)+(s.late>0?" · in "+dur(s.late)+" late":" · on time")
   +(s.over>0?" · "+dur(s.over)+" past "+h12(s.endT):s.early>0?" · out "+dur(s.early)+" early":"");}

 let d=mins(hm(new Date()))-mins(last);
 if(d<0)d+=1440;                       /* worked past midnight */

/* ================= VOICE =================
   The browser's own speech engine: free, private, no key in the page, works
   offline. ElevenLabs stays a later upgrade if the sound ever earns the
   subscription — the plumbing here doesn't change either way. */
const voiceOn=()=>D.voice!==false;
let _voice=null;
function pickVoice(){
 if(_voice)return _voice;
 const vs=(window.speechSynthesis?speechSynthesis.getVoices():[])||[];
 if(!vs.length)return null;
 if(D.voiceName){const m=vs.find(v=>v.name===D.voiceName);if(m)return _voice=m;}
 /* natural/neural voices first, then any US English, then anything */
 return _voice=
  vs.find(v=>/en[-_]US/i.test(v.lang)&&/natural|neural|online/i.test(v.name))||
  vs.find(v=>/en[-_]US/i.test(v.lang)&&/david|mark|guy|andrew|eric/i.test(v.name))||
  vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0];
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{_voice=null;pickVoice();};
/* strip a message down to how a person would say it */
function speakable(t){
 return String(t||"")
  .replace(/```[\s\S]*?```/g," ")            /* code blocks are not speech */
  .replace(/[*_#`>|]/g," ")
  .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1")    /* keep link text, drop URL */
  .replace(/https?:\/\/\S+/g," a link ")
  .replace(/\$(\d[\d,]*)(\.\d\d)?/g,(m,n)=>n.replace(/,/g,"")+" dollars")
  .replace(/\bMIT\b/gi,"mitigation")
  .replace(/·|—|–/g,", ")
  .replace(/\s+/g," ").trim();
}
function say(text,opts){
 if(!voiceOn()||!window.speechSynthesis)return;
 const t=speakable(text);if(!t)return;
 try{
  if(!(opts&&opts.queue))speechSynthesis.cancel();   /* newest message wins */
  const u=new SpeechSynthesisUtterance(t.slice(0,1200));
  const v=pickVoice();if(v)u.voice=v;
  u.rate=+D.voiceRate||1.04;u.pitch=1;
  speechSynthesis.speak(u);
 }catch(e){}
}
function shutUp(){try{speechSynthesis.cancel()}catch(e){}}
/* Esc always silences it — a voice you can't interrupt is a voice you turn off */
window.addEventListener("keydown",e=>{if(e.key==="Escape")shutUp();});
/* A job timer must never outlive the DAY. It used to also be killed the moment
   the shift clock wasn't running, which fought the deliberate choice to let a
   job timer run off the clock — clocking out already stops timers explicitly. */
function timerGuard(){
 let changed=false;
 D.jobs.forEach(j=>{
  if(!j.timerAt)return;
  const started=new Date(j.timerAt);
  if(isoDay(started)===today())return;
  const cap=new Date(isoDay(started)+"T23:59:00").getTime();
  j.timeMin=(+j.timeMin||0)+Math.max(0,Math.round((cap-started)/60000));
  j.timerAt=null;changed=true;
 });
 if(changed){save();if(V==="today"||V==="job"||V==="clock")render();
  toast("Timer stopped — it was left running overnight");}
}

 foremanItems().filter(i=>["late","break","endshift","behind","over"].includes(i.k)).forEach(i=>{

function gamePlan(){
 const p=dayPlan();
 const lines=[`Time now: ${h12(hm(new Date()))}`,
  p.s.target?`Shift: ${h12(p.s.target)}${p.s.endT?" to "+h12(p.s.endT):""}`:"No shift set today",
  p.s.in?`Clocked in ${h12(p.s.in)}${p.s.late>0?" ("+dur(p.s.late)+" late)":""}`:"Not clocked in",
  p.left!=null?`Time left in shift: ${dur(p.left)}`:"",
  `Work still needed today: ${dur(p.needed)}`,
  p.gap!=null?(p.gap>0?`SHORT by ${dur(p.gap)}`:`Slack of ${dur(-p.gap)}`):"",
  `Minutes since last break: ${sinceBreak()}`,
  "",
  "TODAY'S JOBS:",
  ...p.jobs.map(j=>`- ${jobName(j)} | ${j.startTime?h12(j.startTime):"no start time"} | ${phaseOf(j)} | planned ${(j.estHours||EST_DEFAULT)}h | logged ${dur(jobMin(j))} | ${jobNeed(j)?dur(jobNeed(j))+" to go":"time's up"} | ${j.priority||"Moderate"} priority${j.dueDate?" | due "+j.dueDate:""}${j.timerAt?" | TIMER RUNNING":""}`)
 ].filter(Boolean);
 _aiJob=null;
 sheet("Game plan",`<div class="pan"><div class="lab">◷ Working it out…</div></div><div id="aiout"></div>`);
 runAIRaw(`Here's where my day stands:\n\n${lines.join("\n")}\n\n`

/* ================= AI BRIEF ================= */
function brief(){
 const h=new Date().getHours();
 const hello=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+", "+(D.me.name||"Benny")+".";
 const est=byStage("Estimating"),ready=billable(),out=byStage("Invoiced").filter(j=>!inDispute(j));
 const owed=sum(out,j=>fee(j).due), tobill=sum(ready,j=>fee(j).due);
 const plans=D.plans.filter(p=>p.date===today()), left=plans.filter(p=>!p.done);
 const L=[],A=[];
 /* the boss reads the clock first */
 const cs=clockState(),ws=weekStats(),nowM=mins(hm(new Date())),tM=mins(cs.target);
 if(!cs.off){
  if(!cs.in&&tM!=null&&nowM>tM){
   L.push(`You're <b>not clocked in</b>. It's ${h12(hm(new Date()))} — <b>${dur(nowM-tM)}</b> past your ${h12(cs.target)} start.`);
   A.push(["◷ Clock in now","clockIn()"]);
  } else if(!cs.in&&tM!=null){
   L.push(`Not clocked in yet — you're on at <b>${h12(cs.target)}</b>.`);
   A.push(["◷ Clock in","clockIn()"]);
  } else if(cs.late>=10){
   L.push(`You started <b>${dur(cs.late)} late</b> today.${ws.lateDays>1?` That's <b>${ws.lateDays} late starts</b> this week — worth tightening up.`:""}`);
  } else if(cs.late>0){
   L.push(`Clocked in <b>${dur(cs.late)}</b> behind your ${h12(cs.target)} start. Close, but late is late.`);
  } else if(cs.in&&!cs.out){
   L.push(`Clocked in ${h12(cs.in)} — on time. <b>${dur(cs.worked)}</b> in so far.`);
  } else if(cs.in&&cs.out){
   L.push(`Done for the day — <b>${dur(cs.worked)}</b> worked.`);
  }
 }
 if(!D.jobs.length){
  L.push("Board's empty — nothing on the wall yet.");
  L.push("Add your first job and I'll track the fee, the invoice, and who still owes you.");
  A.push(["+ Add first job","newJob()"]);
  return {hello,lines:L,acts:A};
 }
 const bits=[];
 if(est.length)bits.push(`<b>${plural(est.length,"estimate")}</b> in progress`);
 const wtg=byStage("Waiting");
 if(wtg.length)bits.push(`<b>${wtg.length}</b> waiting to start`);
 if(ready.length)bits.push(`<b>${ready.length}</b> ready to bill`);
 if(out.length)bits.push(`<b>${money0(owed)}</b> out for collection`);
 if(openDisputes().length)bits.push(`<b>${money0(sum(openDisputes(),j=>fee(j).due))}</b> in dispute — handled on its own screen`);
 L.push(bits.length?bits.join(" &nbsp;·&nbsp; ")+".":"Nothing active on the board right now.");
 const stale=[...out].filter(j=>ago(j.invDate)>=14).sort((a,b)=>ago(b.invDate)-ago(a.invDate))[0];
 const sitting=[...ready].sort((a,b)=>ago(b.readyDate)-ago(a.readyDate))[0];
 if(stale){
  L.push(`${esc(jobName(stale))}'s invoice has been out <b>${plural(ago(stale.invDate),"day")}</b> — <b>${money(fee(stale).due)}</b> still unpaid. Worth a follow-up.`);
  A.push(["Open "+jobName(stale).split(" ")[0],`go('job',{id:'${stale.id}'})`]);
 } else if(sitting){
  const d=ago(sitting.readyDate);
  L.push(`${esc(jobName(sitting))} is finished and ready to invoice${d>1?` — sitting <b>${plural(d,"day")}</b>`:""}. That's <b>${money(fee(sitting).due)}</b> you haven't billed.`);
  A.push(["Invoice "+jobName(sitting).split(" ")[0],`go('invoice',{id:'${sitting.id}'})`]);
 } else if(tobill){
  L.push(`You've got <b>${money(tobill)}</b> finished but unbilled.`);
  A.push(["Go bill it","go('money')"]);
 } else if(est.length){
  /* nothing is sitting ready to bill — but these estimates aren't finished, so don't claim they're "billed" */
  const due=est.filter(x=>x.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
  const old=due||[...est].sort((a,b)=>ago(b.created2)-ago(a.created2))[0];
  const noTotal=!(+old.total);
  const overdue=old.dueDate&&old.dueDate<today();
  L.push(`Nothing's ready to bill yet — <b>${plural(est.length,"estimate")}</b> still open. `+
   (overdue?`${esc(jobName(old))} was due <b>${fmt(old.dueDate)}</b> and is running behind.`
    :old.dueDate?`${esc(jobName(old))} is due <b>${fmt(old.dueDate)}</b>.`
    :`${esc(jobName(old))} is the oldest.`)+
   (noTotal?` It still has <b>no estimate total</b> — you can't bill it until that's in.`
    :` Finish it and it's <b>${money(fee(old).due)}</b>.`));
  A.push(["Open "+jobName(old).split(" ")[0],`go('job',{id:'${old.id}'})`]);
 } else L.push("Everything's billed and collected. Clean board.");
 if(left.length)L.push(`<b>${plural(left.length,"item")}</b> still on today's schedule.`);
 else if(plans.length)L.push("Today's schedule is all checked off.");
 else A.push(["+ Add to today","addPlan()"]);
 return {hello,lines:L,acts:A};
}

 const far=D.jobs.filter(j=>j.lat&&!["Paid","Lost"].includes(j.status))

 if(far)items.push(["lost",far.mi.toFixed(0)+" mi",jobName(far.j)+" — furthest out"]);
 if((D.subs||[]).length)items.push(["lost",D.subs.length+"",countWord(D.subs.length,"sub")+" on file"]);

 /* the notes themselves, not just a count — newest first, trimmed to fit the bar */
 const recentNotes=[...(D.notes||[])]
  .sort((a,b)=>String(b.created||"").localeCompare(String(a.created||"")))
  .slice(0,4);
 recentNotes.forEach(n=>{
  const txt=(n.text||"").replace(/\s+/g," ").trim();
  if(!txt)return;
  const j=n.jobId?job(n.jobId):null;
  const head=j?jobName(j):(n.who||"Note");
  const safe=maskDigits(txt);
  items.push(["lost",head,safe.length>78?safe.slice(0,78)+"…":safe]);
 });
 const more=(D.notes||[]).length-recentNotes.length;
 if(more>0)items.push(["lost",more+"",countWord(more,"more note")+" in the daybook"]);

 if(items.length<3)items.push(["lost","Chairman","command center"]);
 const half=items.map(([c,b,l])=>`<span class="it"><span class="dot2 v-${c}">●</span><b class="v-${c}">${esc(b)}</b>${esc(l)}</span>`).join("");
 /* Always lay down two copies; wireTape decides whether it needs to move.
    The old rule (only scroll past 7 items) left the bar dead on a light day. */
 return `<div class="tape"><div class="in2" id="tapeIn">${half}${half}</div></div>`;

/* Measure instead of guess: scroll only when the strip is wider than the bar,
   and pace it by width so a long day is not a blur and a short one is not a crawl. */
/* The old version measured immediately — but applyZoom rescales the document
   inside a requestAnimationFrame, so this ran at zoom 1 and then everything
   shrank underneath it. It also deleted the duplicate half when the strip was
   short, which left the banner permanently frozen on a light day. Now it pads
   the track instead of deleting, and measures once layout has settled. */
let _tapeRO=null;
function wireTape(){
 const el=document.getElementById("tapeIn");if(!el)return;
 const bar=el.parentElement;
 const measure=()=>{
  const live=document.getElementById("tapeIn");
  if(!live||!live.isConnected)return;
  const track=live.parentElement;
  const items=[...live.children];
  if(!items.length)return;
  /* rebuild to exactly two copies before measuring */
  const half=Math.ceil(items.length/2);
  const barW=track.clientWidth||0;
  let oneLoop=live.scrollWidth/2;
  if(!barW)return;
  /* repeat the content until one loop comfortably exceeds the bar, so there is
     always something entering as something leaves */
  let guard=0;
  while(oneLoop&&oneLoop<barW*1.15&&guard<6){
   const src=items.slice(0,half).map(n=>n.cloneNode(true));
   src.forEach(n=>live.appendChild(n));
   const src2=items.slice(0,half).map(n=>n.cloneNode(true));
   src2.forEach(n=>live.appendChild(n));
   oneLoop=live.scrollWidth/2;guard++;
  }
  live.style.animation="tape "+Math.max(16,Math.round(oneLoop/38))+"s linear infinite";
 };
 /* two frames: one for applyZoom's rAF, one for the resulting reflow */
 requestAnimationFrame(()=>requestAnimationFrame(measure));
 if(window.ResizeObserver){
  try{
   if(_tapeRO)_tapeRO.disconnect();
   _tapeRO=new ResizeObserver(()=>measure());
   _tapeRO.observe(bar);
  }catch(e){}
 }
}

/* ================= THE MONTHLY NUT =================
   What has to be covered before anything counts as profit, and what is still
   missing after the retainer lands.

   The one number worth getting right: $1,600 every two weeks is NOT $3,200 a
   month. Fortnightly pay is 26 cheques a year, so two months in every twelve
   carry a third payday. Budgeting on a flat x2 understates the year by $3,200
   and makes those two months look like a windfall when they are just arithmetic.
   So paydays are counted for real off an anchor date, month by month. */
const NUT_DEFAULT=()=>({on:true,buffer:0,cash:0,cashAt:"",
 pay:{amount:1600,every:"2weeks",anchor:"2026-07-31"},
 items:[["Rent",1500],["Child support",1200],["Electricity",250],["Groceries",600],
  ["Mobile",100],["Internet",100],["Peptides",300],["Gas",100],["Car insurance",200]]
  .map(([label,amount])=>({id:uid(),label,amount}))});
const NUT=()=>{
 if(!D.nut)D.nut=NUT_DEFAULT();
 if(!D.nut.pay)D.nut.pay={amount:0,every:"2weeks",anchor:"2026-07-31"};
 if(!Array.isArray(D.nut.items))D.nut.items=[];
 if(!Array.isArray(D.nut.goals))D.nut.goals=[];
 if(D.nut.cash===undefined)D.nut.cash=0;
 if(D.nut.cashAt===undefined)D.nut.cashAt="";
 /* the first version anchored the pay schedule to whatever day it was created.
    Correct it once to the real last payday, without clobbering a later edit. */
 if(!D.nut.anchorSet){D.nut.pay.anchor="2026-07-31";D.nut.anchorSet=true;}
 return D.nut;
};
const billsTotal=()=>NUT().items.reduce((n,i)=>n+(+i.amount||0),0);
const goalsTotal=()=>NUT().goals.reduce((n,i)=>n+(+i.amount||0),0);
const nutTotal=()=>billsTotal()+goalsTotal()+(+NUT().buffer||0);
const ymNow=()=>today().slice(0,7);
/* "2026-07-31" through new Date() parses as UTC midnight and can land on the
   wrong local day. Build it at local noon instead. */
const dayFromISO=s=>{const p=String(s||today()).split("-").map(Number);
 return new Date(p[0],(p[1]||1)-1,p[2]||1,12,0,0,0);};
function nutPaydays(ym){
 const p=NUT().pay,out=[];
 const Y=+ym.slice(0,4),M=+ym.slice(5,7);
 const first=new Date(Y,M-1,1,0,0,0,0),last=new Date(Y,M,0,23,59,59,0);
 if(p.every==="month")return [isoDay(new Date(Y,M-1,Math.min(+p.day||1,new Date(Y,M,0).getDate())))];
 if(p.every==="2x")return [isoDay(new Date(Y,M-1,1)),isoDay(new Date(Y,M-1,15))];
 const step=p.every==="week"?7:14;
 const d=dayFromISO(p.anchor);
 let guard=0;
 while(d>first&&guard++<3000)d.setDate(d.getDate()-step);
 guard=0;
 while(d<=last&&guard++<3000){if(d>=first)out.push(isoDay(d));d.setDate(d.getDate()+step);}
 return out;
}
function nextPayday(){
 const p=NUT().pay,t=today();
 if(p.every==="month"||p.every==="2x"){
  const here=nutPaydays(ymNow()).filter(d=>d>=t);
  if(here.length)return here[0];
  const n=new Date();n.setMonth(n.getMonth()+1);
  return nutPaydays(isoDay(n).slice(0,7))[0]||"";
 }
 const step=p.every==="week"?7:14;
 const d=dayFromISO(p.anchor);
 let g=0;while(isoDay(d)<t&&g++<3000)d.setDate(d.getDate()+step);
 return isoDay(d);
}
/* The target is met by WORK — cash already banked plus fees actually collected.
   The retainer sits outside it deliberately: it's the floor he'd rather not
   touch, so counting it as income would hide the month going wrong. */
function nutStats(ym){
 ym=ym||ymNow();
 const target=nutTotal(),amt=+NUT().pay.amount||0;
 const cash=+NUT().cash||0;
 const fees=D.jobs.filter(j=>j.paidDate&&String(j.paidDate).slice(0,7)===ym)
  .reduce((n,j)=>n+fee(j).gross,0);
 const covered=cash+fees;
 const gap=Math.max(0,target-covered);
 const days=nutPaydays(ym);
 const retainerMonth=days.length*amt;
 const next=nextPayday();
 const daysToPay=Math.max(0,Math.round((dayFromISO(next)-dayFromISO(today()))/86400000));
 const lastDay=new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
 const daysLeft=ym===ymNow()?Math.max(1,lastDay-new Date().getDate()+1):lastDay;
 return {target,amt,cash,fees,covered,gap,
  surplus:Math.max(0,covered-target),
  paydays:days,retainerMonth,next,daysToPay,
  retainerNeeded:Math.min(gap,retainerMonth),      /* how deep he'd have to dip */
  shortEvenWithRetainer:Math.max(0,gap-retainerMonth),
  daysLeft,perDay:Math.ceil(gap/daysLeft)};
}

function moveJob(id,to){
 const j=job(id);if(!j||j.status===to)return render();
 if((to==="Complete"||to==="Invoiced")&&!j.total&&!onRetainer(j)){toast("Add the estimate total");return newJob(id);}
 const from=j.status;
 j.status=to;
 if(to==="Complete"&&!j.readyDate)j.readyDate=today();
 if(to==="Invoiced"){if(!j.invNo){j.invNo="INV-"+D.invNo;D.invNo++;}if(!j.invDate)j.invDate=today();}
 if(to==="Paid"){
  j.paidDate=today();
  /* the amount was never written on the way to Paid, so collected history read
     $0.00 for every closed job */
  if(!j.paidAmount)j.paidAmount=Math.round(fee(j).gross*100)/100;
  j.next=null;                       /* a paid job stops asking for attention */
 }
 if(to==="Lost")j.next=null;
 save();
 /* Advancing a stage IS completing the move — don't make him tick it twice. */
 if(nextOf(j)&&["Complete","Invoiced","Paid"].includes(to)){
  D.notes.unshift({id:uid(),jobId:id,kind:"Note",pin:false,created:new Date().toISOString(),
   text:"[Done] "+j.next.text});

 }
 const done=["Paid","Lost"].includes(to);
 if(done&&V==="job"){go("today");toast(to==="Paid"?"Paid — off the queue":"Moved to lost");return;}
 render();
 toast(to==="Paid"?"Paid — "+money(fee(j).gross)+" recorded"
  :to==="Lost"?"Moved to lost"

/* --------- drag & drop --------- */
let dg=null;
function wireDrag(){document.querySelectorAll(".jc").forEach(c=>c.addEventListener("pointerdown",down));}
function down(e){
 if(e.target.closest("button"))return;
 const card=e.currentTarget,id=card.dataset.id;
 const sx=e.clientX,sy=e.clientY,r=card.getBoundingClientRect();
 const ox=sx-r.left,oy=sy-r.top;let on=false;
 const move=ev=>{
  const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!on){
   if(Math.abs(dx)<9||Math.abs(dx)<Math.abs(dy))return;
   on=true;card.setPointerCapture(ev.pointerId);
   const g=card.cloneNode(true);g.className="jc ghost";g.style.width=r.width+"px";
   document.body.appendChild(g);dg={g};card.style.opacity=".25";
  }
  dg.g.style.left=(ev.clientX-ox)+"px";dg.g.style.top=(ev.clientY-oy)+"px";
  hi(ev.clientX,ev.clientY);
 };
 const up=ev=>{
  card.removeEventListener("pointermove",move);card.removeEventListener("pointerup",up);
  card.removeEventListener("pointercancel",up);
  if(!on){go("job",{id});return;}
  const z=zoneAt(ev.clientX,ev.clientY);
  dg.g.remove();dg=null;card.style.opacity="";clear();
  z?moveJob(id,z):render();
 };
 card.addEventListener("pointermove",move);card.addEventListener("pointerup",up);
 card.addEventListener("pointercancel",up);
}
const zoneAt=(x,y)=>document.elementFromPoint(x,y)?.closest("[data-zone]")?.dataset.zone||null;
function hi(x,y){clear();const el=document.elementFromPoint(x,y)?.closest("[data-zone]");if(el)el.classList.add("hi");}
function clear(){document.querySelectorAll("[data-zone]").forEach(e=>e.classList.remove("hi"));}

function fRow(k,label,body){

   <span class="frw-k">${label}</span>
   <span class="frw-v" id="fv_${k}">${FROWV[k]?FROWV[k]():_dash}</span>

function fEdit(k){
 const me=document.getElementById("fe_"+k);
 if(!me)return;
 const opening=me.style.display==="none";
 /* one open at a time — the point of the row list is that it stays short */
 document.querySelectorAll(".frw-e").forEach(e=>{
  e.style.display="none";
  const c=document.getElementById("fc_"+e.id.slice(3));if(c)c.textContent="›";
  const h=document.getElementById("fh_"+e.id.slice(3));if(h)h.classList.remove("open");
 });
 if(opening){
  me.style.display="block";
  const c=document.getElementById("fc_"+k);if(c)c.textContent="⌄";
  const h=document.getElementById("fh_"+k);if(h)h.classList.add("open");
  const f=me.querySelector("input:not([type=hidden]),select");
  if(f&&/text|number|tel|email|date|time/.test(f.type||"text"))setTimeout(()=>f.focus(),60);
 }

 const a=ACCOUNTS().find(x=>x.id===id);
 if(!a)return;

 set("#jcn",a.name);set("#jcp",a.contact);set("#jce",a.email);set("#jcph",a.phone);

   [...box.children].forEach(b=>{

    b.classList.toggle("on",on);
    if(on)_fmode=a.feeMode;
   });

function contractorName(id){

 if(picked&&picked!=="__new"){
  const a=ACCOUNTS().find(x=>x.id===picked);
  if(a)return a.name;

/* Which company a job belongs to: whatever is picked, or a new record from a
   typed name that doesn't match anything yet. */
function accountIdForJob(id){

 if(picked&&picked!=="__new")return picked;
 const typed=($("#jcn")&&$("#jcn").value.trim())||"";
 if(!typed)return id?(job(id).accountId||null):null;
 const key=normAcct(typed);

/* ---------- the flow: what's the ONE next move on this job ---------- */
function flowOf(j){
 const f=fee(j);
 if(j.status==="Lost")return null;
 if(j.status==="Paid")return null;
 /* THE FOURTH EXCLUSION. C-98 stopped the AI nags, the next-move engine and the
    Money totals from treating disputed jobs as collectable — but flowOf was
    never told, so the board's own buttons still read "Chase it — 105 days out"
    on a job sitting at Pre-suit. Never offer a collection action on a job in
    litigation; the only honest move is to open the case. */
 if(inDispute(j))return {l:"Open the case — "+esc(j.disputeStage||"in dispute"),c:"late",
   fn:"go('disputes')"};
 if(j.status==="Waiting")return {l:"Ready to estimate",c:"est",fn:"moveJob('"+j.id+"','Estimating')"};
 if(j.status==="Invoiced"){
  const d=ago(j.invDate);
  /* same rule the colour uses — the queue and the panel must not disagree */
  return isLate(j)?{l:"Chase it — "+plural(d||0,"day")+" out",c:"late",fn:"chaseInv('"+j.id+"')"}
                 :{l:"Mark paid",c:"rdy",fn:"moveJob('"+j.id+"','Paid')"};
 }
 if(j.status==="Complete"){
  return (onRetainer(j)&&f.due===0)
   ?{l:"Close it out — retainer",c:"rdy",fn:"moveJob('"+j.id+"','Paid')"}
   :{l:"Send the invoice — "+money0(f.due),c:"rdy",fn:"go('invoice',{id:'"+j.id+"'})"};
 }
 /* Estimating */
 if(!j.total&&!onRetainer(j))return {l:"Enter the total",c:"out",fn:"newJob('"+j.id+"')"};
 if(!j.startDate)return {l:"Schedule it",c:"est",fn:"quickSchedule('"+j.id+"')"};
 if(phaseOf(j)==="Done")return {l:"Mark complete",c:"paid",fn:"moveJob('"+j.id+"','Complete')"};
 if(j.timerAt)return {l:"Check in — "+phaseOf(j).toLowerCase(),c:"rdy",fn:"checkIn('"+j.id+"')"};
 return {l:phaseOf(j)==="Not started"?"Start — sketch":"Resume — "+phaseOf(j).toLowerCase(),
  c:"est",fn:"startWork('"+j.id+"')"};
}
/* starting work is one tap: timer on, phase moves, you land on the job */
function startWork(id){
 const j=job(id);if(!j)return;
 if(phaseOf(j)==="Not started")j.phase="Sketch";
 if(!j.timerAt)j.timerAt=new Date().toISOString();
 D.last=id;save();go("job",{id});toast("On it — timer running");
}
function chaseInv(id){_aiJob=id;

function flowBtn(j,big){

 return `<button class="btn ${big?"":"s"}" style="margin:0;background:var(--c-${fl.c});color:var(--paper)${big?"":";padding:8px 14px;font-size:11.5px"}"
  onclick="event.stopPropagation();${fl.fn}">${esc(fl.l)} →</button>`;
}
/* the single most important next move across the whole board */
function flowNext(){
 const order=["Invoiced","Complete","Estimating"];   /* Waiting never nags — it's not his move */
 for(const st of order){
  for(const j of byStage(st)){if(inDispute(j))continue;const fl=flowOf(j);if(fl)return {j,fl};}
 }
 return null;
}

/* everything dated on the job, oldest first — the shape a mediator wants */
function disputeChron(j){

 if(j.created2)out.push({date:j.created2,kind:"Job",text:"Job opened / estimate work began"});
 if(j.invDate)out.push({date:j.invDate,kind:"Invoice",text:"Invoice "+(j.invNo||"")+" issued"+(j.total?" — "+money(j.total)+" contract":"")});
 coll("notes",j.id).forEach(n=>out.push({date:isoDay(new Date(n.created)),kind:n.kind||"Note",text:n.text}));
 (D.log||[]).filter(x=>x.jobId===j.id).forEach(x=>out.push({date:isoDay(new Date(x.created)),kind:"Call/Log",text:(x.who?x.who+": ":"")+(x.text||"")}));
 payList(j).forEach(p=>out.push({date:p.date||"(date unknown)",kind:"Payment to me",text:money(p.amount)+(p.note?" — "+p.note:"")}));
 return out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));

/* ---------- time spent per estimate ---------- */
function jobMin(j){let m=+j.timeMin||0;
 if(j.timerAt)m+=Math.max(0,Math.round((Date.now()-new Date(j.timerAt))/60000));
 return m;}
function toggleTimer(id){const j=job(id);if(!j)return;
 if(j.timerAt){
  j.timeMin=(+j.timeMin||0)+Math.max(0,Math.round((Date.now()-new Date(j.timerAt))/60000));
  j.timerAt=null;save();render();toast("Timer stopped — "+dur(jobMin(j)));return;
 }
 /* Only ever ONE job timer. Two running at once double-counted the same hour
    onto two jobs, and Focus Mode could stack a second on top of the first. */
 let bumped="";
 D.jobs.forEach(x=>{if(x.id!==id&&x.timerAt){
  x.timeMin=(+x.timeMin||0)+Math.max(0,Math.round((Date.now()-new Date(x.timerAt))/60000));
  x.timerAt=null;bumped=jobName(x);}});
 j.timerAt=new Date().toISOString();save();render();
 /* The shift clock used to get punched silently here — which then reported a
    late start he never made. Job time is tracked either way; the shift clock
    is his to punch. */
 const cs=clockState();
 toast(bumped?"Timer running — stopped "+bumped
  :!cs.open?"Timer running — you're not on the shift clock":"Timer running");
}
function addTime(id){const j=job(id);

  <label><span class="t">Set total time <em>hours and minutes</em></span>
   <div class="row" style="gap:10px">
    <input class="in" id="th" type="number" min="0" placeholder="hrs" value="${Math.floor(jobMin(j)/60)||""}">
    <input class="in" id="tm" type="number" min="0" max="59" placeholder="min" value="${jobMin(j)%60||""}"></div></label>
  <button class="btn" onclick="saveTime('${id}')">Save</button>
  <button class="btn warn" onclick="resetTime('${id}')">Reset to zero</button>`);}
function saveTime(id){const j=job(id);
 j.timeMin=(+$("#th").value||0)*60+(+$("#tm").value||0);j.timerAt=null;
 save();close_();render();toast("Time saved");}
function resetTime(id){const j=job(id);j.timeMin=0;j.timerAt=null;save();close_();render();toast("Reset");}
function jobTimeHTML(j){
 const m=jobMin(j),f=fee(j),run=!!j.timerAt;
 const hourly=(j.feeMode==="hourly");
 /* Percentage work asks "what did I actually earn per hour". Hourly runs the
    other way — hours times rate is the number he's charging. */
 const rate=(!hourly&&m>0)?f.gross/(m/60):null;
 const P=POM(),pomOn=!!(P.on&&P.jobId===j.id);
 return `<div class="pan" style="border-color:var(--c-${run?"rdy":"lost"});border-left-width:2px">

    <div class="ser ${run?"v-rdy":""}" style="font-size:26px;margin-top:7px">${dur(m)}${
      hourly?` <span class="money" style="font-size:20px;opacity:.85">· ${money(hourlyAmount(j))}</span>`:""}</div>
    ${hourly
     ? `<div class="xs dim" style="margin-top:5px">At <b>${money0(jobRate(j))}/hr</b> — this is what you're charging${jobRate(j)?"":". Set a rate in Edit details or Settings."}</div>`
     : rate?`<div class="xs dim" style="margin-top:5px">Works out to <b class="v-${rate>=75?"paid":rate>=40?"rdy":"out"}">${money0(rate)}/hr</b> at your ${money(f.gross)} fee</div>`
     :`<div class="xs dim" style="margin-top:5px">Start the timer to see your effective hourly rate</div>`}</div>
   <button class="ico" onclick="addTime('${j.id}')" title="Edit time">✎</button></div>
  <button class="btn ${run?"sec":""}" onclick="toggleTimer('${j.id}')">${run?"◼ Stop timer":"▶ Start timer"}</button>
  <div class="row between" style="align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)">
   <div class="grow"><div class="lab" style="margin-bottom:2px">${pomOn?`<span class="live amber"></span> Focus running`:"◔ Focus block"}</div>
    <div class="sm dim">${P.work} min on · ${P.rest} off · ${plural(+j.pomDone||0,"session")} here</div></div>
   <div class="upbar" style="margin:0">
    <button class="opt2" onclick="${pomOn?"pomStop()":`pomForJob('${j.id}')`}">${pomOn?"◼ Stop":"▶ Focus"}</button>
    <button class="opt2" onclick="pomSetup()">✎</button></div></div></div>`;

/* Starting a focus block starts the job's timer too — one button, one meaning.
   Focus time counts toward the job; the break does not. */
function pomForJob(id){
 const j=job(id);if(!j)return;
 POM().jobId=id;save();
 if(!j.timerAt)toggleTimer(id);
 pomStart("work");
}

function dupJobTo(id,acctId){

 if(aid){const a=ACCOUNTS().find(x=>x.id===aid);name=a?a.name:"";}
 else{
  name=($("#dupnew")&&$("#dupnew").value.trim())||"";
  if(!name){toast("Pick a company or type one in");return;}
  const ex=ACCOUNTS().find(x=>normAcct(x.name)===normAcct(name));
  if(ex){aid=ex.id;name=ex.name;}
  else{const a={id:uid(),name,created:new Date().toISOString()};
   D.accounts=ACCOUNTS().concat([a]);aid=a.id;}
 }
 const pid=propId(src);
 const copy={id:uid(),status:"Estimating",created2:today(),propId:pid,
  accountId:aid,contractor:name,jobFor:"Contractor",billTo:"Contractor",
  feeMode:"pct",flat:0,total:0,advance:0};
 PROP_FIELDS.forEach(f=>{const v=src[f];if(v!==undefined&&v!=="")copy[f]=v;});
 copy.jobFor="Contractor";copy.billTo="Contractor";
 copy.mport=src.mportLink?"Done":"Not needed";
 const a=ACCOUNTS().find(x=>x.id===aid);
 if(a&&a.feeMode){copy.feeMode=a.feeMode;if(a.feePct!=null)copy.feePct=a.feePct;}
 D.jobs.unshift(copy);save();close_();go("job",{id:copy.id});
 toast("Copied to "+name+" — now add the scope");
}

/* ---------- what to charge to hit the month ------------------------------ */
function chargeHintHTML(j){
 if(NUT().on===false||!nutTotal())return "";
 const s=nutStats();if(!s.gap)return "";
 const f=fee(j),p=jobPct(j);
 const openCount=byStage("Estimating").length||1;
 const perJob=Math.ceil(s.gap/openCount);
 /* The month is closed by FEES, so talk in fees. A "what total would carry the
    whole month alone at 2%" number comes out near a quarter million — true and
    useless. Totals are only shown against the deals he actually has. */
 const r=ruleFor(j);
 const dealLines=[];
 if(r&&p>0){
  const t=Math.round((s.gap/(p/100))+(j.feeMode==="aftersubs"?subTotal(j):0));
  dealLines.push(`On this job's deal — ${p}% ${basisWord(j.feeMode)} — the whole gap is a
   <b class="money v-est">${money0(t)}</b> ${(j.loss||"job").toLowerCase()}.`);
 }
 (acctRules(j)||[]).forEach(rule=>{
  if(r&&rule.id===r.id)return;
  const t=Math.round(s.gap/(+rule.pct/100));
  dealLines.push(`${esc(rule.loss||"Any")} at ${rule.pct}%: about <b class="money">${money0(t)}</b>${rule.minTotal?` <span class="dim">(deal starts at ${money0(rule.minTotal)})</span>`:""}.`);
 });
 return `<div class="pan" style="margin-top:14px;border-color:var(--c-est)">
  <div class="lab v-est">◈ To hit this month</div>
  <div class="ln2" style="margin-top:10px"><span class="k">Fees still needed</span>
   <b class="money v-rdy">${money0(s.gap)}</b></div>
  <div class="ln2"><span class="k">This job earns</span>
   <b class="money ${f.gross?"":"dim"}">${money(f.gross)}</b></div>
  ${openCount>1?`<div class="ln2"><span class="k">Across ${openCount} open estimates</span>
   <b class="money v-est">${money0(perJob)} each</b></div>`:""}
  ${dealLines.length?`<p class="xs dim" style="margin:12px 0 0;line-height:1.7">${dealLines.join("<br>")}</p>`:""}
  <p class="xs dim" style="margin:10px 0 0;opacity:.8">A target, not a price — the scope decides what the estimate says.</p>
 </div>`;
}

   An uploaded logo in Settings still wins; this is the default under it. */
const LOGO_PRINT="logo-print.jpg";
/* The JPG carries a frame, a shadow and an off-white tile baked into its
   pixels. CSS tricks (blend modes) die in the print engine, so the file is
   processed for real: crop to the mark, erase everything near-white, hand the
   layout a clean transparent PNG. Runs once, cached in memory. */
let _logoClean=null;
async function cleanPrintLogo(){
 if(_logoClean)return _logoClean;
 try{
  const img=await loadImg(printLogo());
  const s=Math.min(img.naturalWidth,img.naturalHeight);
  /* crop inside the square frame so only the hexagon survives */
  const cs=s*0.56, sx=(img.naturalWidth-cs)/2, sy=(img.naturalHeight-cs)/2;
  const c=document.createElement("canvas");c.width=c.height=640;
  const x=c.getContext("2d");
  x.drawImage(img,sx,sy,cs,cs,0,0,640,640);
  const d=x.getImageData(0,0,640,640);
  for(let i=0;i<d.data.length;i+=4){
   const lum=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
   if(lum>200)d.data[i+3]=0;                                  /* tile → gone */
   else if(lum>120)d.data[i+3]=Math.round(255*(200-lum)/80);  /* shadow → fades */
  }
  x.putImageData(d,0,0);
  _logoClean=c.toDataURL("image/png");
 }catch(e){_logoClean=printLogo();}   /* worst case: the raw file, not nothing */
 return _logoClean;
}

const runsOn=(j,k)=>{const s=j.startDate,e=j.dueDate||j.startDate;

/* ---------- month view: drag a job from one day to another ---------- */
let calYM=null;
function monthShift(n){const [y,m]=calYM.split("-").map(Number);
 const d=new Date(y,m-1+n,1);calYM=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render();}
function monthHTML(){
 const t=today();
 if(!calYM)calYM=t.slice(0,7);
 const [y,m]=calYM.split("-").map(Number);
 const first=new Date(y,m-1,1), start=new Date(first);
 start.setDate(1-first.getDay());
 const live=D.jobs.filter(j=>!["Paid","Lost"].includes(j.status)&&j.startDate);
 const cells=[];
 for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(isoDay(d));}
 const weeks=[];for(let i=0;i<42;i+=7)weeks.push(cells.slice(i,i+7));
 const title=first.toLocaleDateString("en-US",{month:"long",year:"numeric"});
 const LANES=window.matchMedia&&matchMedia("(max-width:760px)").matches?3:4;

 const weekHTML=days=>{
  const w0=days[0], w6=days[6];
  /* one segment per job per week, so a name never repeats across days */
  const segs=calSort(live.filter(j=>{
   const s=j.startDate, e=j.dueDate||j.startDate;
   return s<=w6&&e>=w0;
  })).map(j=>{
   const s=j.startDate, e=j.dueDate||j.startDate;
   const from=s<w0?w0:s, to=e>w6?w6:e;
   const col=days.indexOf(from);
   const span=Math.max(1,Math.round((new Date(to)-new Date(from))/864e5)+1);
   const total=Math.round((new Date(e)-new Date(s))/864e5)+1;
   return {j,col,span,cont:s<w0,goes:e>w6,total,late:e<t};
  });
  /* greedy lane packing so bars never overlap */
  const lanes=[];
  segs.forEach(sg=>{
   let L=0;
   while(lanes[L]&&lanes[L].some(o=>!(sg.col+sg.span<=o.col||o.col+o.span<=sg.col)))L++;
   (lanes[L]=lanes[L]||[]).push(sg);sg.lane=L;
  });
  const shown=segs.filter(sg=>sg.lane<LANES);
  const hidden={};
  segs.filter(sg=>sg.lane>=LANES).forEach(sg=>{
   for(let c=sg.col;c<sg.col+sg.span;c++)hidden[c]=(hidden[c]||0)+1;});
  const laneN=Math.min(lanes.length,LANES)+(Object.keys(hidden).length?1:0);
  const cellH=Math.max(52,26+laneN*23);
  return `<div class="wk">
   ${days.map((k,i)=>`<div class="mcell ${k.slice(0,7)!==calYM?"out":""} ${k===t?"today":""}" data-day="${k}" style="min-height:${cellH}px">
     <span class="mnum">${+k.slice(8)}</span></div>`).join("")}
   <div class="bars">
    ${shown.map(sg=>{
      const c=sg.late?"out":PCOL2[sg.j.priority||"Moderate"];
      return `<div class="bar2 ${sg.cont?"cont":""} ${sg.goes?"goes":""}" data-id="${sg.j.id}"
        style="grid-column:${sg.col+1}/span ${sg.span};grid-row:${sg.lane+1};background:var(--c-${c})"
        title="${esc(jobName(sg.j))} — ${sg.j.startTime?h12(sg.j.startTime)+", ":""}${plural(sg.total,"day")}${sg.late?" · overdue":""}">
        <span style="overflow:hidden;text-overflow:ellipsis">${sg.cont?"‹ ":""}${sg.j.startTime&&!sg.cont?`<b style="opacity:.8">${h12s(sg.j.startTime)}</b> `:""}${esc(jobName(sg.j))}</span>
        ${sg.span>1?`<span class="len">${sg.total}d</span>`:""}</div>`;}).join("")}
    ${Object.entries(hidden).map(([c,n])=>`<div class="mmore" style="grid-column:${+c+1};grid-row:${LANES+1}">+${n}</div>`).join("")}
   </div></div>`;
 };

 return `<div class="calwrap"><div class="row between" style="margin-top:16px">
   <button class="ico" onclick="monthShift(-1)">‹</button>
   <div class="ser" style="font-size:20px">${esc(title)}</div>
   <button class="ico" onclick="monthShift(1)">›</button></div></div>
  <div class="mgrid">
   <div class="mhrow">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="mhead">${d}</div>`).join("")}</div>
   ${weeks.map(weekHTML).join("")}
  </div>
  <div class="calwrap"><div class="upbar" style="margin-top:12px;justify-content:center">
   ${PRIO.map(p=>`<button style="border-color:var(--c-${PCOL2[p]});color:var(--c-${PCOL2[p]});padding:5px 10px">${p}</button>`).join("")}
   <button style="border-color:var(--c-out);color:var(--c-out);padding:5px 10px">Overdue</button></div>
  <p class="xs dim center" style="margin-top:10px">Bar length = how many days the job runs · drag it to another day · tap to edit</p></div>`;
}
/* pointer drag: works with a mouse and with a finger */
let mdg=null;
function wireMonth(){
 document.querySelectorAll(".bar2").forEach(el=>el.addEventListener("pointerdown",mdown));
}
function mdown(e){
 if(e.button===2)return;
 const card=e.currentTarget,id=card.dataset.id;
 const sx=e.clientX,sy=e.clientY;let on=false,g=null;
 card.setPointerCapture(e.pointerId);
 const move=ev=>{
  if(!on){
   if(Math.abs(ev.clientX-sx)<7&&Math.abs(ev.clientY-sy)<7)return;
   on=true;
   g=card.cloneNode(true);g.className="bar2 ghostdrag";document.body.appendChild(g);
   card.style.opacity=".3";
  }
  g.style.left=(ev.clientX-70)+"px";g.style.top=(ev.clientY-14)+"px";
  document.querySelectorAll(".mcell").forEach(c=>c.classList.remove("hi"));
  const cell=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".mcell");
  if(cell)cell.classList.add("hi");
 };
 const up=ev=>{
  card.removeEventListener("pointermove",move);
  card.removeEventListener("pointerup",up);
  card.removeEventListener("pointercancel",up);
  if(!on){quickSchedule(id);return;}
  const cell=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".mcell");
  g&&g.remove();card.style.opacity="";
  document.querySelectorAll(".mcell").forEach(c=>c.classList.remove("hi"));
  mdg=null;
  if(cell&&cell.dataset.day)moveJobToDay(id,cell.dataset.day);
  else render();
 };
 card.addEventListener("pointermove",move);
 card.addEventListener("pointerup",up);
 card.addEventListener("pointercancel",up);
}
/* dropping on a day moves the whole job there, keeping its length */
function moveJobToDay(id,day){
 const j=job(id);if(!j)return render();
 const sd=j.startDate||day, dd=j.dueDate||sd;
 const span=Math.max(0,Math.round((new Date(dd)-new Date(sd))/864e5));
 j.startDate=day;j.dueDate=addDays(day,span);
 save();render();toast(jobName(j)+" → "+fmt(day));
}

R.cal=()=>{

 dated.forEach(j=>{if(j.startDate<first)first=j.startDate;
  const e=j.dueDate||j.startDate;if(e>last)last=e;});
 const days=[];for(let k=first;k<=last;k=addDays(k,1)){days.push(k);if(days.length>90)break;}

 ${days.map(k=>{
   const on=calSort(dated.filter(j=>runsOn(j,k)));

function mergeAccts(ids){
 const list=ids.map(i=>ACCOUNTS().find(a=>a.id===i)).filter(Boolean);
 if(list.length<2)return;
 snapshot("before merging companies");
 const keep=list[0],rest=list.slice(1);
 rest.forEach(a=>{
  D.jobs.forEach(j=>{if(j.accountId===a.id)j.accountId=keep.id;});
  keep.contacts=[...(keep.contacts||[]),...(a.contacts||[])];
  if(a.notes)keep.notes=[keep.notes,a.notes].filter(Boolean).join("\n");
  ["contact","phone","email","addr","terms"].forEach(k=>{if(!keep[k]&&a[k])keep[k]=a[k];});
 });
 keep.updatedAt=new Date().toISOString();
 D.accounts=ACCOUNTS().filter(a=>!rest.some(r=>r.id===a.id));
 save();close_();render();toast("Merged into "+keep.name);
}

/* Keys are per provider. One shared slot meant switching provider silently
   pointed the old key at the new endpoint — a Claude key sent to Google, which
   answers "API key not valid" and gives you no clue why. */
const keyOwner=k=>!k?"":/^sk-ant-/.test(k)?"claude":/^AIza/.test(k)?"gemini":/^gsk_/.test(k)?"groq":"";
const AICFG=()=>{
 if(!D.ai)D.ai={provider:"gemini",key:"",keys:{},ollamaUrl:"http://localhost:11434",ollamaModel:"llama3.1"};
 const a=D.ai;
 if(!a.keys){
  a.keys={};
  /* one-time migration: file the existing key under whoever actually issued it,
     and follow it, so a working key never ends up pointed at the wrong API */
  if(a.key){const own=keyOwner(a.key)||a.provider;a.keys[own]=a.key;if(own!==a.provider)a.provider=own;}
 }
 a.key=a.keys[a.provider]||"";
 return a;
};
/* which providers he has a usable key for — drives the mismatch warning */
const aiKeyed=()=>{const a=AICFG();return Object.keys(a.keys||{}).filter(p=>a.keys[p]);};
const AIPROV={
 claude:{label:"Claude",note:"Sonnet day to day · Opus for the weekly read. Pay as you go.",
  model:"claude-sonnet-5",deep:"claude-opus-5",
  keyUrl:"https://console.anthropic.com/settings/keys"},
 gemini:{label:"Google Gemini",note:"Free tier · no card needed",model:"gemini-3.6-flash",
  keyUrl:"https://aistudio.google.com/apikey"},
 groq:{label:"Groq",note:"Free tier · very fast",model:"llama-3.3-70b-versatile",
  keyUrl:"https://console.groq.com/keys"},
 ollama:{label:"Ollama (on your PC)",note:"Free forever · fully private · no key",model:"local"}
};
/* Sonnet carries the daily load; Opus only where deep analysis earns its cost. */
const claudeModel=deep=>deep?(AICFG().deepModel||AIPROV.claude.deep):(AICFG().model||AIPROV.claude.model);
/* Google retires model names periodically — ask the API what's actually live
   instead of hard-coding one that goes stale. */
const geminiModel=()=>AICFG().model||AIPROV.gemini.model;
async function detectGeminiModel(){
 const c=AICFG();
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(c.key)}`);
 const d=await r.json();
 if(d.error)throw new Error(d.error.message||"Couldn't list models");
 const usable=(d.models||[])
  .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
  .map(m=>m.name.replace(/^models\//,""))
  .filter(n=>!/embed|aqa|vision|image|tts|audio|live|native/i.test(n));
 if(!usable.length)throw new Error("No usable models on this key");
 /* prefer a flash model (fast + generous free tier), newest version first */
 const score=n=>{
  const v=parseFloat((n.match(/gemini-([\d.]+)/)||[])[1]||"0");
  return (/flash/.test(n)?1000:0)+(/lite/.test(n)?-5:0)+v*10-(/preview|exp/.test(n)?50:0);
 };
 usable.sort((a,b)=>score(b)-score(a));
 c.model=usable[0];save();
 return usable[0];
}
const aiReady=()=>{const c=AICFG();return c.provider==="ollama"?!!c.ollamaUrl:!!c.key;};

/* deep=true routes to the heavier model — used only by the weekly read */
async function callAI(system,user,deep){
 const c=AICFG();
 if(c.provider==="gemini"){
  const ask=async model=>{
   const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(c.key)}`,
    {method:"POST",headers:{"content-type":"application/json"},
     body:JSON.stringify({systemInstruction:{parts:[{text:system}]},
      contents:[{role:"user",parts:[{text:user}]}],
      generationConfig:{temperature:.4,maxOutputTokens:1200}})});
   return r.json();
  };
  let d=await ask(geminiModel());
  /* model retired or renamed? find a live one and try again, once */
  if(d.error&&/not found|no longer|not available|unsupported|deprecat|does not exist|invalid model|update your code/i.test(d.error.message||"")){
   const m=await detectGeminiModel();
   d=await ask(m);
  }
  if(d.error)throw new Error(d.error.message||"Gemini error");
  const t=d?.candidates?.[0]?.content?.parts?.map(p=>p.text).join("")||"";
  if(!t)throw new Error("Empty reply from Gemini");
  return t;
 }
 if(c.provider==="claude"){
  /* Anthropic blocks browser calls unless this header is set. It is set
     deliberately: the key lives on this device and is called from it, which
     is fine while he is the only one who signs in. The day a client can open
     this app, the key has to move behind Supabase instead. */
  const r=await fetch("https://api.anthropic.com/v1/messages",
   {method:"POST",headers:{"content-type":"application/json",
     "x-api-key":c.key,"anthropic-version":"2023-06-01",
     "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:claudeModel(deep),max_tokens:1600,system,
     messages:[{role:"user",content:user}]})});
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||"Claude error");
  return (d.content||[]).map(p=>p.text||"").join("")||"";
 }
 if(c.provider==="groq"){
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",
   {method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+c.key},
    body:JSON.stringify({model:AIPROV.groq.model,temperature:.4,max_tokens:1200,
     messages:[{role:"system",content:system},{role:"user",content:user}]})});
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||"Groq error");
  return d?.choices?.[0]?.message?.content||"";
 }
 const r=await fetch(c.ollamaUrl.replace(/\/$/,"")+"/api/chat",
  {method:"POST",headers:{"content-type":"application/json"},
   body:JSON.stringify({model:c.ollamaModel||"llama3.1",stream:false,
    messages:[{role:"system",content:system},{role:"user",content:user}]})});
 const d=await r.json();
 if(d.error)throw new Error(d.error);
 return d?.message?.content||"";
}
/* ---- send a document (PDF / photo) to the model ---- */
/* Claude reads PDFs and images natively — this used to be wired to Gemini only,
   which is why "Read the estimate" refused to run on a Claude key. */
const canReadDocs=()=>["gemini","claude"].includes(AICFG().provider);
async function callAIFile(system,user,file){
 const c=AICFG();
 if(!canReadDocs())throw new Error("Reading documents needs Claude or Gemini — Groq and Ollama are text-only. Switch provider in Settings.");
 const raw=await readAsDataURL(file);
 const b64=raw.split(",")[1];
 const mime=file.type||"application/pdf";
 if(b64.length>26e6)throw new Error("That file's too big to send. Try a photo of the summary page instead.");

 if(c.provider==="claude"){
  const isPdf=mime==="application/pdf";
  /* Anthropic wants a document block for PDFs and an image block for photos.
     Sending a PDF as an image block is rejected, so the two are kept apart. */
  const blk=isPdf
   ?{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}
   :{type:"image",source:{type:"base64",media_type:mime,data:b64}};
  const send=async beta=>{
   const h={"content-type":"application/json","x-api-key":c.key,
    "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
   if(beta)h["anthropic-beta"]=beta;
   const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,
    body:JSON.stringify({model:claudeModel(false),max_tokens:1400,system,
     messages:[{role:"user",content:[blk,{type:"text",text:user}]}]})});
   return r.json();
  };
  let d=await send(null);
  /* older accounts still need the PDF beta flag; only retry when that's the complaint */
  if(d.error&&isPdf&&/beta|pdf|document/i.test(d.error.message||""))d=await send("pdfs-2024-09-25");
  if(d.error)throw new Error(d.error.message||"Claude error");
  const t=(d.content||[]).map(p=>p.text||"").join("");
  if(!t)throw new Error("Nothing came back — the file may be scanned too faintly to read.");
  return t;
 }

 const ask=async model=>{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(c.key)}`,
   {method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({systemInstruction:{parts:[{text:system}]},
     contents:[{role:"user",parts:[{inline_data:{mime_type:mime,data:b64}},{text:user}]}],
     generationConfig:{temperature:.1,maxOutputTokens:1400}})});
  return r.json();
 };
 let d=await ask(geminiModel());
 if(d.error&&/not found|no longer|not available|unsupported|deprecat|does not exist|invalid model|update your code/i.test(d.error.message||"")){
  d=await ask(await detectGeminiModel());
 }
 if(d.error)throw new Error(d.error.message||"Gemini error");
 const t=d?.candidates?.[0]?.content?.parts?.map(p=>p.text).join("")||"";
 if(!t)throw new Error("Nothing came back — the file may be scanned too faintly to read.");
 return t;
}

/* ---------- policy breakdown ----------------------------------------------
   A policy is not an estimate and must not share its prompt. What matters here
   is what the carrier owes and where the traps are: sublimits, the wind/hail
   deductible that is usually a percentage of Coverage A rather than a flat sum,
   and whether Ordinance & Law exists at all — that one decides whether code
   upgrades are billable or eaten. */
const POLICY_SYS=()=>`You read US property insurance policies and declaration pages for ${D.me.name||"Benny"}, `
 +`a Houston general contractor and insurance estimator preparing a repair scope.\n`
 +`Report ONLY what is printed. Never infer, never fill a typical value. If a figure is not on the page, write "not shown".\n`
 +`Cover, in this order:\n`
 +`1. Named insured, carrier, policy number, and the policy period.\n`
 +`2. Coverage limits line by line: A dwelling, B other structures, C contents, D loss of use / ALE.\n`
 +`3. Deductibles. State the all-other-perils deductible AND the wind/hail or named-storm deductible separately. `
 +`If wind/hail is a percentage, give the percentage AND the dollar amount it works out to against Coverage A, and show the arithmetic.\n`
 +`4. Whether the dwelling is replacement cost or actual cash value, and whether contents are RCV or ACV. Say if roof surfaces carry a separate ACV or payment schedule endorsement — flag that loudly, it changes the whole claim.\n`
 +`5. Ordinance or Law coverage: present or absent, and the limit or percentage. If absent, say so plainly — code upgrades will not be paid.\n`
 +`6. Endorsements and sublimits that affect a repair scope: mold/fungi, water damage, service line, matching, cosmetic damage exclusions.\n`
 +`7. Anything that will cost him money if he misses it, and anything you could not read.\n`
 +`Plain sentences and short labelled lines. No preamble. Write it so it can be pasted into an email to an adjuster.`;

 if(cs.in)L.push(`Clocked in ${h12(cs.in)}${cs.late>0?" ("+dur(cs.late)+" late)":" (on time)"}`);
 const act=D.jobs.filter(j=>!["Paid","Lost"].includes(j.status));
 L.push(`\nJOBS (${act.length} active):`);
 act.forEach(j=>{const f=fee(j);
  L.push(`- ${jobName(j)} | ${j.status}${j.status==="Waiting"&&j.waitingOn?" ("+j.waitingOn+")":""} | ${j.loss||"type n/a"} | est ${money0(j.total)} | your fee ${money(f.gross)}`
   +`${j.status==="Estimating"?" | phase "+phaseOf(j):""}`
   +`${j.priority?" | "+j.priority+" priority":""}${j.dueDate?" | due "+j.dueDate:""}`
   +`${forContractor(j)?" | for contractor "+j.contractor:""}`
   +`${j.insurer?" | "+j.insurer:""}${j.claim?" claim "+j.claim:""}`
   +` | fee ${fee(j).kind==="retainer"?"RETAINER (do not bill)":fee(j).kind==="flat"?"flat":fee(j).rate+"%"+(fee(j).kind==="aftersubs"?" after subs":"")}`);});
 const owed=sum(byStage("Invoiced").filter(j=>!inDispute(j)),j=>fee(j).due), tobill=sum(byStage("Complete").filter(j=>!inDispute(j)),j=>fee(j).due);
 L.push(`\nMONEY: ${money(owed)} invoiced and unpaid, ${money(tobill)} finished but not yet billed.`);
 if(openDisputes().length)L.push(`\nIN DISPUTE / LEGAL — these are legal matters, NOT collections. Never suggest nudging, chasing or invoicing these; suggest only documentation, chronology-keeping, or talking to the attorney:\n`
  +openDisputes().map(j=>`- ${jobName(j)}: stage ${j.disputeStage}, contested ${money(j.disputeAmt||0)}, his cut outstanding ${money(fee(j).due)}`).join("\n"));
 const recent=(D.log||[]).slice(0,8);
 if(recent.length)L.push(`\nDAYBOOK (recent conversations):\n`+recent.map(x=>`- ${isoDay(new Date(x.created))} ${x.who||"?"}: ${(x.text||"").slice(0,140)}${x.amount?" ($"+x.amount+")":""}`).join("\n"));
 const pl=D.plans.filter(p=>p.date===today());
 if(pl.length)L.push(`\nTODAY'S LIST:\n`+pl.map(p=>`- ${p.done?"[done] ":""}${p.text}${p.type?" ("+p.type+")":""}`).join("\n"));
 return L.join("\n");
}

/* ---- AI actions: the model proposes, you tap to apply ---- */
const findJob=n=>{if(!n)return null;const q=String(n).toLowerCase().trim();
 return D.jobs.find(j=>jobName(j).toLowerCase()===q)
  ||D.jobs.find(j=>jobName(j).toLowerCase().includes(q)||q.includes(jobName(j).toLowerCase()))
  ||D.jobs.find(j=>(j.address||"").toLowerCase().includes(q)||(j.contractor||"").toLowerCase().includes(q));};
function parseActions(txt){
 const m=txt.match(/```json\s*([\s\S]*?)```/);
 if(!m)return {clean:txt,actions:[]};
 let acts=[];
 try{const o=JSON.parse(m[1]);acts=Array.isArray(o)?o:(o.actions||[]);}catch(e){}
 return {clean:txt.replace(m[0],"").trim(),actions:acts.filter(a=>a&&a.do)};
}
function describeAction(a){
 const j=a.job?findJob(a.job):null;
 const who=j?jobName(j):(a.job||"");
 switch(a.do){
  case"set_total":return `Set ${who}'s estimate total to ${money0(a.amount)}`;
  case"set_stage":return `Move ${who} to ${LBL[a.stage]||a.stage}`;
  case"set_priority":return `Mark ${who} ${a.priority} priority`;
  case"set_phase":return `${who}: ${a.phase}`;
  case"set_dates":return `Schedule ${who} ${fmt(a.start)}${a.due?" → "+fmt(a.due):""}${a.time?" at "+h12(a.time):""}`;
  case"add_extra":return `Add "${a.label}" ${money0(a.amount)} to ${who}`;
  case"add_note":return `Log a ${a.kind||"note"} on ${who}`;
  case"add_today":return `Add to today: ${a.text}`;
  case"add_log":return `Log: ${a.who||"conversation"}${a.amount?" — "+money0(a.amount):""}`;
  case"remember":return `Remember: ${(a.text||"").slice(0,70)}`;
  case"start_timer":return `Start the timer on ${who}`;
  case"stop_timer":return `Stop the running timer`;
  case"complete_today":return `Check off: ${a.text}`;
  case"set_fee":return `${who}: ${a.mode==="retainer"?"on retainer":a.mode==="flat"||a.flat?"flat "+money0(a.flat||0):(a.pct||"")+"%"+(a.mode==="aftersubs"?" after subs":"")}`;
  case"set_hours":return `${who}: plan ${a.hours}h`;
  case"add_sub":return `Add ${a.name} (${a.trade||"sub"}) to the crew`;
  case"log_break":return `Log a break now`;
  case"new_job":return `Create job for ${a.owner||"new client"}`;
  case"set_details":{
   const bits=[];
   if(a.total!=null)bits.push("total "+money0(a.total));
   if(a.claim)bits.push("claim "+a.claim);
   if(a.insurer)bits.push(a.insurer);
   if(a.address)bits.push(a.address);
   if(a.owner)bits.push(a.owner);
   if(a.loss)bits.push(a.loss);
   if(a.mportLink)bits.push("Matterport link");
   return `Fill in ${who}: ${bits.join(" · ")||"details"}`;}
  case"set_matterport":return `Matterport on ${who}: ${a.status||"link"}`;
  case"assign_sub":return `Put ${a.sub} on ${who}${a.amount?" at "+money0(a.amount):""}`;
  case"draft_email":return `Open an email to ${a.to||"them"}`;
  default:return a.do;
 }
}
function actionOK(a){
 if(["add_today","new_job","add_log","remember","stop_timer","complete_today","add_sub","log_break"].includes(a.do))return true;
 if(a.do==="draft_email")return true;
 if(a.do==="assign_sub")return !!findJob(a.job)&&!!findSub(a.sub);
 return !!findJob(a.job);
}
const findSub=n=>{if(!n)return null;const q=String(n).toLowerCase().trim();
 return D.subs.find(s=>(s.name||"").toLowerCase()===q)
  ||D.subs.find(s=>(s.name||"").toLowerCase().includes(q)||q.includes((s.name||"").toLowerCase()));};
function applyAction(i){
 const a=_aiActions[i];if(!a)return;
 const j=a.job?findJob(a.job):null;
 try{
  if(a.do==="set_total"&&j){j.total=+a.amount||0;}
  else if(a.do==="set_stage"&&j){moveJob(j.id,a.stage);toast("Moved");renderActions();return;}
  else if(a.do==="set_priority"&&j){j.priority=a.priority;}
  else if(a.do==="set_phase"&&j&&phaseSet(j).includes(a.phase)){j.phase=a.phase;}
  else if(a.do==="set_dates"&&j){j.startDate=a.start||j.startDate;j.dueDate=a.due||addDays(a.start||today(),LEADDAYS);
   if(a.time)j.startTime=a.time;}
  else if(a.do==="add_extra"&&j){j.extras=j.extras||[];j.extras.push({id:uid(),label:a.label||"Extra",amount:+a.amount||0});}
  else if(a.do==="add_note"&&j){D.notes.unshift({id:uid(),jobId:j.id,text:a.text||"",kind:a.kind||"Note",pin:false,created:new Date().toISOString()});}
  else if(a.do==="remember"){if(a.text)MEM().unshift({text:String(a.text),src:"ai",created:new Date().toISOString()});}
  else if(a.do==="start_timer"&&j){if(!j.timerAt)toggleTimer(j.id);renderActions();return;}
  else if(a.do==="stop_timer"){const r=D.jobs.find(x=>x.timerAt);if(r){toggleTimer(r.id);renderActions();return;}}
  else if(a.do==="complete_today"){
   const q=String(a.text||"").toLowerCase();
   const pl=D.plans.find(x=>x.date===today()&&!x.done&&(x.text.toLowerCase().includes(q)||q.includes(x.text.toLowerCase())));
   if(pl)pl.done=true;else{toast("Couldn't find that item");return;}}
  else if(a.do==="set_fee"&&j){
   if(["pct","aftersubs","flat","retainer"].includes(a.mode))j.feeMode=a.mode;
   if(a.pct!=null&&+a.pct)j.feePct=+a.pct;
   if(a.flat!=null&&+a.flat){j.flat=+a.flat;if(!a.mode)j.feeMode="flat";}}
  else if(a.do==="set_hours"&&j){if(+a.hours)j.estHours=+a.hours;}
  else if(a.do==="add_sub"){if(a.name)D.subs.unshift({id:uid(),name:String(a.name),trade:a.trade||"Other",
   phone:a.phone||"",email:"",rate:a.rate||"",insExp:"",notes:"",created:new Date().toISOString()});}
  else if(a.do==="log_break"){takeBreak();renderActions();return;}
  else if(a.do==="add_log"){LOGS().unshift({id:uid(),who:a.who||"",text:a.text||"",amount:+a.amount||0,jobId:"",files:[],created:new Date().toISOString()});}
  else if(a.do==="add_today"){D.plans.unshift({id:uid(),text:a.text||"",type:a.type||"Other",pri:!!a.priority,who:"",time:a.time||"",date:today(),done:false});}
  else if(a.do==="set_details"&&j){
   if(a.total!=null&&+a.total)j.total=+a.total;
   if(a.claim)j.claim=String(a.claim);
   if(a.insurer)j.insurer=String(a.insurer);
   if(a.address)j.address=String(a.address);
   if(a.owner){j.owner=String(a.owner);j.client=j.owner;}
   if(a.loss&&LOSS.includes(a.loss))j.loss=a.loss;
   if(a.mportLink){j.mportLink=String(a.mportLink);if(!j.mport||j.mport==="Not needed")j.mport="Done";}
  }
  else if(a.do==="set_matterport"&&j){
   if(a.link){j.mportLink=String(a.link);}
   if(a.status&&MPORT.includes(a.status))j.mport=a.status;
   else if(a.link&&(!j.mport||j.mport==="Not needed"))j.mport="Done";
  }
  else if(a.do==="assign_sub"&&j){
   const s=findSub(a.sub);
   if(s){j.subs=j.subs||[];if(!j.subs.includes(s.id))j.subs.push(s.id);
    if(a.amount!=null){j.subCosts=j.subCosts||{};j.subCosts[s.id]=+a.amount||0;}}
  }
  else if(a.do==="draft_email"){
   const to=a.to||(j?billParty(j).email:"")||"";
   location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(a.subject||"")}&body=${encodeURIComponent(a.body||"")}`;
   if(j&&a.body)D.notes.unshift({id:uid(),jobId:j.id,text:"[Emailed] "+a.body.slice(0,400),kind:"Email",pin:false,created:new Date().toISOString()});
  }
  else if(a.do==="new_job"){D.jobs.unshift({id:uid(),status:"Estimating",owner:a.owner||"New client",client:a.owner||"",
    address:a.address||"",insurer:a.insurer||"",claim:a.claim||"",total:+a.total||0,
    feeMode:"pct",flat:0,advance:0,jobFor:"Homeowner",billTo:"Owner",priority:"Moderate",created2:today(),extras:[],subs:[],subCosts:{}});}
  else {toast("Couldn't apply that");return;}
  save();_aiDone[i]=true;renderActions();render();toast("Done");
 }catch(e){toast("Couldn't apply that");}
}
let _aiActions=[],_aiDone={};
