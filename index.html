<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chairman">
<title>Chairman</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230D0D0C'/%3E%3Ctext x='50' y='70' font-size='62' font-family='Times New Roman,serif' text-anchor='middle' fill='%23F4F3EF'%3EC%3C/text%3E%3C/svg%3E">
<style>
/* ============ BORING-STYLE EDITORIAL SYSTEM ============ */
:root{
 /* true black night mode — panels lift off the black instead of floating in grey */
 /* Material dark-theme surfaces. Pure #000 was the mistake: white text on it
    hits 21:1, which halates — the letters bloom and the eye keeps refocusing.
    Elevation reads as a LIGHTER surface here, not a shadow. */
 --paper:#121212; --panel:#1C1C1E; --panel2:#26262A; --rule:#33333A; --rule2:#45454D;
 /* neutral white — the cream is gone */
 --ink:#F0F0F1; --ink2:#C2C4C7; --ink3:#9A9CA0;
 --inv:#000000; --sig:#F2ECDE;
 /* on black the stage colours can carry more light without shouting */
 /* One warm colour: Claude orange. The old gold went brown in light mode and
    read as rust, so ready-to-bill and overdue now share the same orange —
    they stay apart by their symbol and label instead of by hue. */
 /* High luminance, LOW chroma. Bright without vibrating: saturated hues on a
    dark surface shimmer at the edges, which is the strain. Light tones read
    brighter than saturated ones anyway. */
 /* One colour, one meaning. Coral is gone, and ready-to-bill no longer wears
    the same colour as overdue — money you can collect and money that's late
    are different problems and now look it. */
 --c-est:#7FB8F0;    /* steel — being estimated, work in progress   */
 --c-rdy:#6FD79B;    /* signal — finished, go collect it            */
 --c-out:#F0B44F;    /* amber — invoice out, waiting on them        */
 --c-paid:#B6B6B9;   /* graphite — settled, needs nothing from you  */
 --c-lost:#93939A;   /* graphite — Waiting and Lost both land here, and it
                        paints card HEADLINES, so it has to stay readable */
 --c-late:#E5544B;   /* crimson — overdue or in dispute. Alarm only */
 --serif:'Playfair Display','Bodoni MT',Didot,'Didot LT STD','Times New Roman',Times,serif;
 /* display face for the big wordmark — sturdy strokes, no hairlines to bloom */
 --display:Georgia,Cambria,Constantia,'Book Antiqua',Palatino,'Times New Roman',serif;
 --sans:'Helvetica Neue',Helvetica,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
/* daytime: sky blue. no red, no clay, nothing that can read pink. */
body.paper{
 --paper:#EDF4FA; --panel:#FFFFFF; --panel2:#DEEAF4; --rule:#CBDCE9; --rule2:#A6C1D6;
 --ink:#141416; --ink2:#3A3C40; --ink3:#5A5C60; --inv:#FFFFFF; --sig:#1B1B1E;
 /* #A9741B was the brown one. Gone — same Claude orange as night mode. */
 /* darkened past 4.5:1 against BOTH the tinted ground and white panels —
    amber is the most common state and was also a button fill at 3.4:1 */
 --c-est:#155FAB; --c-rdy:#0E6B49; --c-out:#8A5A00; --c-paid:#5A5A5E; --c-lost:#6E6E73;
 --c-late:#A82A22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* anything scrolled to must clear the sticky header AND the job action bar,
   or it lands underneath them and cannot be tapped */
html{scroll-padding-top:calc(var(--hdr,68px) + 104px)}
/* native date/time pickers must follow the theme, or they render
   dark-on-transparent over a dark panel and look empty */
:root{color-scheme:dark}
body.paper{color-scheme:light}
input[type=time],input[type=date]{min-height:44px}
input[type=time]::-webkit-calendar-picker-indicator,
input[type=date]::-webkit-calendar-picker-indicator{filter:none;opacity:.85;cursor:pointer}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);
 padding-bottom:112px;min-height:100vh;-webkit-font-smoothing:antialiased;
 transition:background .25s,color .25s}
body.paper{
 background-image:
  radial-gradient(1100px 620px at 14% -12%, rgba(53,145,205,.20), transparent 66%),
  radial-gradient(900px 520px at 90% 0%, rgba(108,180,222,.16), transparent 64%);
 background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px}
.wrap{max-width:680px;margin:0 auto;padding:26px 20px}

/* ---- type ---- */
.disp{font:400 clamp(34px,10vw,52px)/1.02 var(--serif);text-transform:uppercase;
 letter-spacing:-.012em;margin:0}
.disp.sm{font-size:clamp(26px,7vw,34px)}
h2{font:400 21px/1.15 var(--serif);margin:0;letter-spacing:.005em}
.lab{font:700 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.lab.on{color:var(--ink)}
.ser{font-family:var(--serif);font-weight:400}
.mut{color:var(--ink2)} .dim{color:var(--ink3)}
.sm{font-size:13px} .xs{font-size:11.5px}
.num{font:400 40px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num.s{font-size:26px}
.money{font-variant-numeric:tabular-nums}
.center{text-align:center}

/* ---- rules ---- */
.rule{height:1px;background:var(--rule);border:0;margin:0}
.rule.hair{background:repeating-linear-gradient(90deg,var(--rule) 0 3px,transparent 3px 6px)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
 padding-bottom:11px;border-bottom:1px solid var(--ink);margin:38px 0 0}
.sechead .em{font:700 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase}

/* ---- panels ---- */
.pan{border:1px solid var(--rule);background:var(--panel);padding:18px;margin-top:14px}
.pan.flat{background:transparent}
.pan.key{border-color:var(--ink)}
.row{display:flex;align-items:center;gap:14px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- AI brief ---- */
.brief{border:1px solid var(--ink);padding:22px 20px 20px;margin-bottom:6px;background:var(--panel)}
.brief .top{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.brief .top .g{font-size:12px;line-height:1}
.brief .hi{margin-bottom:17px}
.brief .ln{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink2)}
.brief .ln .s{flex:none;font-size:10px;line-height:1.7;color:var(--ink)}
.brief .ln b{color:var(--ink);font-weight:600}
.brief .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---- buttons ---- */
.btn{display:block;width:100%;margin-top:10px;padding:15px 20px;border:1px solid var(--sig);
 background:var(--sig);color:var(--inv);border-radius:999px;text-align:center;
 font:700 13px var(--sans);letter-spacing:.09em;text-transform:uppercase}
.btn:active{opacity:.75}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--rule2)}
.btn.s{display:inline-block;width:auto;margin:0;padding:9px 16px;font-size:10.5px;letter-spacing:.16em}
.btn.warn{background:transparent;color:var(--ink3);border-color:var(--rule2)}
.ico{width:36px;height:36px;border:1px solid var(--rule2);background:transparent;
 display:grid;place-items:center;font-size:14px;flex:none;border-radius:999px}
.lnk{background:none;border:0;padding:0;font:700 11.5px var(--sans);letter-spacing:.08em;
 text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px}

/* ---- status ---- */
.st{display:inline-flex;align-items:center;gap:7px;font:700 10.5px var(--sans);
 letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--rule2);
 border-radius:999px;white-space:nowrap;color:var(--ink2)}
.st .m{font-size:9px;line-height:1}
.st.s-est{color:var(--c-est);border-color:currentColor}
.st.s-out{color:var(--c-out);border-color:currentColor}
.st.s-paid{color:var(--c-paid);border-color:currentColor}
.st.s-lost{color:var(--c-lost);border-color:currentColor}
.st.s-rdy{background:var(--c-rdy);color:var(--paper);border-color:var(--c-rdy)}
.st.s-wait{color:var(--ink3);border-style:dashed;border-color:var(--ink3)}

/* ---- rows ---- */
.li{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--rule)}
.li:last-child{border-bottom:none}
.ck{width:19px;height:19px;border:1px solid var(--rule2);flex:none;display:grid;place-items:center;
 font-size:11px;background:transparent;border-radius:0}
.ck.on{background:var(--sig);color:var(--inv);border-color:var(--sig)}
.ln2{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 18px;align-items:baseline;
 padding:11px 10px;margin:0 -10px;border-bottom:1px solid var(--rule);border-radius:7px}
.ln2>*{min-width:0}
.ln2>:nth-child(n+3){grid-column:2}
.ln2:hover{background:var(--panel2)}
.ln2:last-child{border-bottom:none}
.ln2 .k{color:var(--ink3);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1.35}
@media(max-width:520px){.ln2{grid-template-columns:118px minmax(0,1fr);gap:3px 12px;padding:10px 8px;margin:0 -8px}}
.ln2.tot{border-top:1px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:16px;align-items:baseline}
.ln2.tot .k{font-size:11px;color:var(--ink)}
.ln2.tot .v{font:400 30px var(--serif)}

/* ---- nav ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--paper);
 border-top:1px solid var(--rule);padding:0 0 env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;border-right:1px solid var(--rule);padding:16px 4px 15px;
 font:700 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);position:relative}
nav button:last-child{border-right:0}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--ink)}
nav button .g{display:block;font-size:11px;margin-bottom:5px}

/* ---- header ---- */
header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule)}
header .h{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;
 padding:calc(env(safe-area-inset-top) + 15px) 20px 14px}
.wm{font:700 12px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.wm i{font-style:normal;color:var(--ink3)}
/* The name lives up here beside the three round buttons now, not down the page.
   Solid Georgia, no gradient mask and no filter — both force a rasterised layer
   and that is what made the old wordmark look soft. */
.hdmark{display:flex;align-items:baseline;gap:9px;min-width:0;
 font-family:var(--display);text-transform:uppercase;line-height:1;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.hdmark b{font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--ink)}
.hdmark span{font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--ink3);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.hdmark b,.hdmark span{font-size:15px}.hdmark{gap:6px}}
@media(max-width:380px){.hdmark span{display:none}}
/* the date rides next to the name — quiet, but always current */
.hddate{font:600 12.5px var(--sans);color:var(--ink3);letter-spacing:.05em;
 white-space:nowrap;margin-left:14px;padding-left:14px;border-left:1px solid var(--rule2)}
.hddate b{color:var(--ink2);font-weight:700}
@media(max-width:640px){.hddate{display:none}}
/* on wide screens this is exactly the empty run of header he wanted it in */
@media(min-width:1000px){.hdmark b,.hdmark span{font-size:23px}}

/* ---- forms ---- */
label{display:block;margin-bottom:20px}
label .t{font:700 10.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
 display:block;margin-bottom:8px}
label .t em{font-style:normal;text-transform:none;letter-spacing:.02em;font-size:11.5px;opacity:.92}
.in{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--rule2);background:transparent;
 color:var(--ink);outline:none;font-size:16px;border-radius:0}
.in:focus{border-color:var(--ink)}
select.in{padding:12px 0}

/* ---- board ---- */
.bwrap{margin:14px -20px 0;padding:0 20px;overflow-x:auto;display:flex;gap:1px;
 background:var(--rule);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.bwrap::-webkit-scrollbar{height:3px}
.bwrap::-webkit-scrollbar-thumb{background:var(--rule2)}
.col{flex:none;width:232px;background:var(--paper);padding:14px 13px 16px;min-height:200px;transition:background .12s}
.col.hi{background:var(--panel2)}
.col .ch{padding-bottom:11px;border-bottom:1px solid var(--ink);margin-bottom:13px}
.col .ch .n{font:700 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;display:block}
.col .ch .c{font:600 11.5px var(--sans);color:var(--ink3);margin-top:5px;display:block;letter-spacing:.02em}
.jc{border:1px solid var(--rule);background:var(--panel);padding:12px;margin-bottom:9px;
 touch-action:pan-y;cursor:grab}
.jc:active{cursor:grabbing}
.jc .t{font:400 15px/1.25 var(--serif);margin-bottom:3px}
/* one anatomy: name → who → next move → money + badges → button */
.jctx{font:600 11.5px var(--sans);color:var(--ink2);letter-spacing:.01em;margin-bottom:7px}
.jnext{font:600 12.5px var(--sans);line-height:1.35;margin-bottom:9px;cursor:pointer}
.jfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
 border-top:1px solid var(--rule);padding-top:8px}
.jfoot b{font:400 17px var(--serif);font-variant-numeric:tabular-nums}
.jbadges{display:flex;gap:5px;flex-wrap:wrap}
/* Paid is archive — same anatomy, lower weight */
.col.quiet{opacity:.62}
.col.quiet:hover{opacity:1}
.jc.arch .t{color:var(--ink3)}
/* an empty stage keeps its drop target but gives the width back */
.col.empty{width:52px;padding:14px 6px;min-height:120px;opacity:.5}
.col.empty .emptylab{display:flex;flex-direction:column;align-items:center;gap:9px;
 font:700 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.col.empty .emptylab b{writing-mode:vertical-rl;font-weight:700;white-space:nowrap}
.col.empty.hi{opacity:1;background:var(--panel2)}
.jc .s{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.02em;margin-bottom:11px;
 text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc .f{display:flex;justify-content:space-between;align-items:baseline;
 border-top:1px solid var(--rule);padding-top:9px;font-size:12px}
.ghost{position:fixed;z-index:200;width:206px;pointer-events:none;
 box-shadow:0 18px 40px rgba(0,0,0,.45);border-color:var(--ink)!important}
.dz{display:flex;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.dz > div{flex:1;background:var(--paper);padding:20px 10px;text-align:center;
 font:700 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);transition:.12s}
.dz > div.hi{background:var(--sig);color:var(--inv)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:9px 17px;font:700 10.5px var(--sans);
 letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.seg button.on{background:var(--sig);color:var(--inv)}

/* ---- fee options ---- */
.opt{border:1px solid var(--rule2);padding:18px;margin-top:12px;background:transparent;transition:.14s}
.opt.on{border-color:var(--c-rdy);background:var(--panel)}
.opt.on .v{color:var(--c-rdy)}
.opt .t{font:700 10.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
.opt.on .t,.opt.on .mk{color:var(--c-rdy)}
.opt .v{font:400 34px/1 var(--serif);margin-top:9px;font-variant-numeric:tabular-nums}
.opt .mk{font-size:13px;flex:none}

/* ---- sheet ---- */
/* Leaflet numbers its own panes 400 and its zoom controls 1000, so on the Map
   screen the map drew straight over the settings sheet and he couldn't type
   his address. #mapbox gets its own stacking context, which traps every
   Leaflet z-index inside a z-index:0 box — no third-party layer can climb out
   of it again. The overlay stack is lifted clear as well, keeping its existing
   internal order: sheet < focus < toast. */
#mapbox{position:relative;z-index:0;isolation:isolate}
.ov{position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.62);display:flex;
 align-items:flex-end;justify-content:center;animation:fi .15s}
body.paper .ov{background:rgba(17,17,16,.4)}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--paper);
 border-top:1px solid var(--ink);padding:24px 20px calc(env(safe-area-inset-bottom) + 26px);
 animation:up .22s cubic-bezier(.2,.85,.25,1)}
@keyframes up{from{transform:translateY(22px)}to{transform:none}}
@media(min-width:681px){.ov{align-items:center}.sheet{border:1px solid var(--ink);max-height:88vh}}
.sheethd{display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:22px}

/* ---- misc ---- */
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:900;
 background:var(--sig);color:var(--inv);padding:13px 22px;border-radius:999px;
 font:700 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;animation:fi .16s}
.empty{text-align:center;padding:60px 20px}
.empty .g{font-size:20px;margin-bottom:18px;letter-spacing:.4em}
pre.inv{white-space:pre-wrap;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;
 background:var(--panel);border:1px solid var(--rule);padding:18px;overflow:auto;color:var(--ink2)}
.quote{border:1px solid var(--rule);padding:16px 18px;margin-top:34px;background:var(--panel);
 font:400 13.5px/1.5 var(--serif);font-style:italic;color:var(--ink2)}
.strip{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:14px}
.strip > div{flex:1;background:var(--paper);padding:15px 12px;text-align:center}
.strip .k{font:700 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
 display:block;margin-bottom:7px}
.strip .v{font:400 20px var(--serif);font-variant-numeric:tabular-nums}

/* ---- tags / chips ---- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid currentColor;
 border-radius:999px;font:700 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;
 white-space:nowrap;color:var(--ink3)}
.chip.fill{background:currentColor}
.chip.fill span{color:var(--paper)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.pri{color:var(--c-rdy);font-weight:700;letter-spacing:0}
.who{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.01em}
.segwrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.opt2{padding:9px 13px;border:1px solid var(--rule2);border-radius:999px;background:transparent;
 font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.opt2:hover{color:var(--ink);border-color:var(--ink3)}
.opt2.on{background:var(--sig);color:var(--inv);border-color:var(--sig)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
 border-bottom:1px solid var(--rule)}
.sw{width:44px;height:25px;border-radius:999px;border:1px solid var(--rule2);background:transparent;
 position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
 background:var(--ink3);transition:.15s}
.sw.on{background:var(--c-rdy);border-color:var(--c-rdy)}
.sw.on::after{left:21px;background:var(--paper)}

/* ---- printable invoice (black on white, whatever theme is on screen) ---- */
#printarea{display:none}
@media print{
 @page{size:letter;margin:0.45in 0.5in}
 html,body{background:#fff!important;color:#000!important;zoom:1!important}
 body>header,body>nav,body>.wrap,body>.ov,body>.toast{display:none!important}
 #printarea{display:block!important;font:12pt/1.45 Georgia,'Times New Roman',serif;color:#000}
 #printarea *{color:#000!important}
 /* ---- Layout H: centered mark, client-first ---- */
 .inv-h{max-width:7.2in;margin:0 auto}
 .hd{text-align:center;padding-bottom:12pt;border-bottom:.75pt solid #d5d5d5}
 /* the logo arrives pre-cleaned as a transparent PNG — nothing clever here */
 .hlogo{width:68pt;height:auto}
 .hname{font:bold 15pt Georgia,serif;letter-spacing:.26em;margin-top:7pt}
 .htag{font:8.5pt Inter,Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;
  color:#888!important;margin-top:4pt}
 .hfor{text-align:center;padding:13pt 0 10pt}
 .hkick{font:9pt Inter,Helvetica,Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#888!important}
 /* the client's name sits in warm grey — present, but not shouting like the mark */

/* ---- month calendar: one continuous bar per job, spanning its days ---- */
.mgrid{border:1px solid var(--rule);margin:12px auto 0;background:var(--rule);max-width:1050px}
.calwrap{max-width:1050px;margin:0 auto}
.mhrow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mhead{background:var(--paper);padding:9px 4px;text-align:center;
 font:700 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:1px}
.mcell{background:var(--paper);min-height:64px;padding:5px 5px 4px;transition:background .12s}
.mcell.out{opacity:.62}
.mcell.today{background:var(--panel2)}
.mcell.today .mnum{color:var(--c-rdy);font-weight:700}
.mcell.hi{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--c-rdy)}
.mnum{font:700 12.5px var(--sans);color:var(--ink2);display:block}
.bars{position:absolute;left:0;right:0;top:24px;display:grid;grid-template-columns:repeat(7,1fr);
 gap:1px;grid-auto-rows:21px;row-gap:3px;pointer-events:none}
.bar2{pointer-events:auto;margin:0 3px;border-radius:4px;padding:3px 7px;cursor:grab;touch-action:none;
 font:700 12px/17px var(--sans);color:var(--paper);overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;display:flex;align-items:center;gap:5px}
.bar2:active{cursor:grabbing}
.bar2 .len{opacity:.72;font-size:9px;letter-spacing:.06em;flex:none}
.bar2.cont{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar2.goes{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar2.ghostdrag{position:fixed;z-index:300;pointer-events:none;width:150px;opacity:.95;
 box-shadow:0 14px 30px rgba(0,0,0,.5);margin:0}
.mmore{position:absolute;font:700 10px var(--sans);color:var(--ink3);pointer-events:none}
@media(max-width:760px){
 .mcell{padding:4px 3px}
 .bar2{font-size:9px;padding:2px 5px;line-height:13px}
 .bars{grid-auto-rows:17px;top:20px}
 .mnum{font-size:10px}
 .bar2 .len{display:none}
}

/* ---- dashboard shell (Mycogen-style) ---- */
#side{display:none}
@media(min-width:1000px){
 #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:225px;z-index:50;
  background:var(--panel);border-right:1px solid var(--rule);padding:20px 14px calc(env(safe-area-inset-bottom) + 16px)}
 header{margin-left:225px}
 .wrap{margin-left:225px;max-width:none;padding:20px 26px}
 nav{display:none}
 header .wm{display:none}   /* .hdmark stays — it is the name now */
}
#side .slogo{padding:4px 12px 20px}
#side .smark{width:74px;height:74px;border-radius:0;background:none;display:block;object-fit:contain}
#side .sname{font:600 17px var(--sans);letter-spacing:.22em}
#side .sitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
 padding:8px 13px;border-radius:11px;color:var(--ink2);font:600 13.5px var(--sans);margin-bottom:3px;cursor:pointer}
#side .sitem .ic3{width:19px;text-align:center;font-size:15px;opacity:.8}
#side .sitem:hover{background:var(--panel2)}
#side .sitem.on{background:var(--sig);color:var(--inv)}
#side .sitem.on .ic3{opacity:1}
#side .sitem.sub{padding-left:13px;font-size:12.5px;color:var(--ink3);margin-bottom:1px}
#side .sitem.sub .ic3{width:19px}
#side .sitem.sub.cur{color:var(--ink);background:var(--panel2)}
nav button .nb{position:absolute;top:7px;right:calc(50% - 26px);min-width:16px;height:16px;
 border-radius:999px;background:var(--c-rdy);color:#151212;font:700 9.5px/16px var(--sans);
 font-style:normal;text-align:center;padding:0 4px}
#side .sbadge{margin-left:auto;font:600 10.5px var(--sans);color:var(--ink3);background:var(--panel2);
 padding:2px 8px;border-radius:10px}
#side .sitem.on .sbadge{background:rgba(255,255,255,.18);color:var(--inv)}
#side .sfoot{margin-top:auto;padding-top:14px}
.topbar{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.topbar h1{font:600 24px var(--sans);letter-spacing:-.01em;margin:0}
.topbar .sub2{font:600 13.5px var(--sans);color:var(--ink3);margin-top:3px}
.dashgrid{display:grid;gap:16px}
@media(min-width:1200px){.dashgrid{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin-bottom:16px}
.strip2{border:0;border-radius:12px;padding:13px 15px;text-align:left;cursor:pointer;position:relative}
.strip2 b{display:block;font:600 13px var(--sans);margin-bottom:3px}
.strip2 span{font:600 12px var(--sans);opacity:.92}
.strip2 .go2{position:absolute;top:10px;right:12px;font-size:11px;opacity:.6}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:16px}
.stat2{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:16px 17px}
.stat2 .k2{font:700 12px var(--sans);color:var(--ink2);margin-bottom:9px}
.stat2 .v2{font:600 26px var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat2 .d2{font:700 11.5px var(--sans);margin-top:7px}
.chartcard{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px;margin-bottom:16px}
.chart{display:flex;align-items:flex-end;gap:4%;height:170px;margin-top:16px}
.chart .cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.chart .cbar{width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--c-rdy);
 min-height:3px;transition:height .4s ease}
.chart .cl{font:700 11px var(--sans);color:var(--ink3)}
.rail>.pan{border-radius:14px}
.pan,.brief,.tape,.opt,.jc{border-radius:14px}
.li .ck{border-radius:6px}
.ins{display:flex;align-items:center;gap:11px;padding:9px 0}
.ins .ii{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:none}
.ins b{font:600 14px var(--sans)}
.ins .in3{font:600 12px var(--sans);color:var(--ink3)}
.ins .iv{margin-left:auto;font:600 15px var(--sans);font-variant-numeric:tabular-nums}

/* ---- the name, said properly ---- */
/* .topbar h1 is declared later at 24px sans — beat it on specificity, not order.
   Both lines are the same size; width is driven off the longer one so
   COMMAND CENTER never wraps or spills.

   Rendered SOLID on purpose. The gradient text-clip and the glow filter both
   forced this into a rasterised layer, which is what made it look soft — and
   Playfair's hairline strokes bloomed on black on top of that. Georgia is
   sturdy, evenly weighted and hinted, so it stays sharp at any size. */
.topbar h1.cmdname,h1.cmdname{margin:0;line-height:.96;letter-spacing:.005em;
 font:700 clamp(26px,5.2vw,56px)/0.96 var(--display);text-transform:uppercase;
 color:var(--ink);-webkit-text-fill-color:var(--ink);
 background:none;white-space:nowrap;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.topbar h1.cmdname span,h1.cmdname span{display:block;margin-top:1px;
 font-size:1em;font-weight:inherit;font-family:inherit;letter-spacing:.005em;
 color:var(--ink);-webkit-text-fill-color:var(--ink)}

/* example rows must be unmistakable at a glance */
.exbadge{display:inline-block;font:700 9px var(--sans);letter-spacing:.18em;
 padding:2px 6px;border-radius:4px;background:var(--c-lost);color:#000;
 vertical-align:middle;margin-left:7px}

/* address suggestions float instead of pushing the form around */
.addrpop:not(:empty){position:absolute;left:0;right:0;top:0;z-index:40;
 background:var(--panel2);border:1px solid var(--rule2);border-radius:11px;
 padding:4px 10px;box-shadow:0 14px 34px rgba(0,0,0,.6);max-height:250px;overflow:auto}
/* a required field he left blank */
.in.bad{border-color:var(--c-out)!important;box-shadow:0 0 0 2px rgba(207,128,67,.18)}
.fielderr{color:var(--c-out);font:700 12.5px var(--sans);margin:-12px 0 14px}

/* ---- AI conversation ---- */
.chatwrap{max-height:58vh;overflow-y:auto;padding:4px 2px 8px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.55}
.bub.me{align-self:flex-end;background:var(--panel2);border:1px solid var(--rule2);
 border-bottom-right-radius:5px;white-space:pre-wrap}
.bub.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--rule);
 border-left:2px solid var(--c-rdy);border-bottom-left-radius:5px}
.bub.ai .note{margin:0;white-space:pre-wrap}
.composer{display:flex;gap:9px;align-items:flex-end;
 border-top:1px solid var(--rule);padding-top:12px}
.composer .in{margin:0;flex:1;resize:none;overflow-y:auto;max-height:160px;padding:10px 0}
@media(max-width:640px){.bub{max-width:92%}.chatwrap{max-height:52vh}}

/* map pins carry a name chip, so they must not be clipped to a square icon box */
.jobpin{background:none;border:0;width:auto!important;height:auto!important}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);
 border:1px solid var(--rule2);border-radius:12px}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--rule2)}
.leaflet-popup-content{margin:13px 15px}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink3)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--rule)}
.leaflet-bar a:hover{background:var(--panel2);color:var(--ink)}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:var(--ink3)!important}
.leaflet-control-attribution a{color:var(--ink2)!important}

/* ---- alive: a faint pulse wherever live numbers land ---- */
@keyframes bump{0%{transform:translateY(3px);opacity:.35}100%{transform:none;opacity:1}}
@keyframes sheen{0%{background-position:-180% 0}100%{background-position:280% 0}}
.daysum>div{animation:bump .5s cubic-bezier(.2,.8,.3,1) both}
.daysum>div:nth-child(2){animation-delay:.05s}
.daysum>div:nth-child(3){animation-delay:.1s}
.daysum>div:nth-child(4){animation-delay:.15s}
.daysum>div:nth-child(5){animation-delay:.2s}
.daysum>div:nth-child(6){animation-delay:.25s}
/* a slow band of light crossing the live panels, only on black */
body:not(.paper) .tape::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(100deg,transparent 38%,rgba(242,236,222,.06) 50%,transparent 62%);
 background-size:220% 100%;animation:sheen 9s linear infinite}
body:not(.paper) .pan{box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
@media (prefers-reduced-motion:reduce){
 .daysum>div{animation:none}
 body:not(.paper) .tape::after{animation:none}
 .tape .in2{animation:none!important}
}

/* ---- live board ---- */
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape{overflow:hidden;border:1px solid var(--rule);border-left:2px solid var(--c-rdy);
 background:var(--panel);margin-bottom:16px;position:relative}
.tape .in2{display:inline-flex;white-space:nowrap;animation:tape 40s linear infinite;padding:10px 0;will-change:transform}
/* pausing on plain hover made a resting cursor look like a frozen app;
   only pause while he is actually holding on it */
.tape:active .in2{animation-play-state:paused}
.tape .it{display:inline-flex;align-items:baseline;gap:7px;padding:0 26px;
 font:600 14px var(--sans);letter-spacing:.02em;color:var(--ink2)}
.tape .it b{font:600 17px var(--serif);letter-spacing:0;color:var(--ink)}
.tape .it .dot2{font-size:8px;transform:translateY(-2px)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-paid);
 animation:pulse 2s ease-in-out infinite;margin-right:7px;vertical-align:1px}
.live.amber{background:var(--c-rdy)}
.live.red{background:var(--c-out)}
@keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.brief .ln{animation:slidein .3s ease both}
.reltime{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.02em;flex:none}

/* ---- notes, files, subs ---- */
.note{padding:14px 0;border-bottom:1px solid var(--rule)}
.note:last-child{border-bottom:none}
.note .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.note .bd{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.note .tm{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;margin-top:12px}
.th{position:relative;aspect-ratio:1;border:1px solid var(--rule);overflow:hidden;background:var(--panel2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .del{position:absolute;top:3px;right:3px;width:21px;height:21px;border:0;border-radius:50%;
 background:rgba(0,0,0,.72);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center}
.frow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--rule)}
.frow:last-child{border-bottom:none}
.frow .ic2{width:34px;height:34px;border:1px solid var(--rule2);display:grid;place-items:center;
 font-size:13px;flex:none}
/* ---- document type tiles: type = filled square, stage = pill. Two channels. ---- */
.ftile{position:relative;width:36px;height:36px;flex:none;display:grid;place-items:center;
 border-radius:9px;font-size:15px;line-height:1;
 background:color-mix(in srgb,var(--tint) 20%,transparent);
 color:var(--tint);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 45%,transparent)}
.ftile .sgn{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;
 background:var(--c-paid);color:#12140F;font:700 10px/16px var(--sans);text-align:center;
 font-style:normal;box-shadow:0 0 0 2px var(--panel)}
.ftype{font:700 10px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--tint)}

/* ---- monthly nut meter ---- */
.nutbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--panel2);
 margin-top:16px;box-shadow:inset 0 0 0 1px var(--rule)}
.nutbar i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.85,.25,1)}
.nutkey{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:11px}
.nutkey span{display:inline-flex;align-items:center;gap:6px;
 font:700 10.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3)}
.nutkey b{width:9px;height:9px;border-radius:3px;flex:none}

/* ---- band one: the money ladder ---------------------------------------- */
.mband{border:1px solid var(--rule);border-radius:14px;background:var(--panel);
 padding:16px 18px;margin:0 0 16px}
.mband-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;cursor:pointer}
.mband-k{font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.mband-n{font:400 clamp(21px,3.1vw,29px)/1.1 var(--serif);margin:6px 0 3px}
.mband-s{font:400 12px var(--sans);color:var(--ink3)}
.mband-r{text-align:right;flex:none}
.mband-c{font:400 clamp(21px,3.1vw,29px)/1.1 var(--serif);color:var(--ink);margin:6px 0 3px}
.mlad{margin-top:16px;border-top:1px solid var(--rule)}
.mlad-r{display:grid;grid-template-columns:8px minmax(120px,1.1fr) 74px 108px minmax(0,1fr);
 gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule)}
.mlad-r:last-child{border-bottom:0}
.mlad-b{width:8px;height:8px;border-radius:2px;background:var(--mt)}
.mlad-l{font:600 13px var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlad-n{font:400 11.5px var(--sans);color:var(--ink3);white-space:nowrap}
.mlad-a{font:400 16px var(--serif);text-align:right;white-space:nowrap}
.mlad-w{font:400 11.5px var(--sans);color:var(--ink3);overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
@media(max-width:700px){
 .mband-hd{flex-direction:column;gap:10px}.mband-r{text-align:left}
 .mlad-r{grid-template-columns:8px 1fr auto;gap:9px}
 .mlad-n,.mlad-w{display:none}
}

/* ---- the queue as a table, not a stack of cards -------------------------
   One row per job, every control on the row. Dense enough that a full day is
   visible without scrolling, which is the whole point of a queue. */

"use strict";
const BUILD="C-139 · a background tab can't overwrite you";

const money=n=>"$"+(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

   which shifted the whole app onto tomorrow's schedule after ~6pm. */
const isoDay=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const PLURALS={entry:"entries",company:"companies",property:"properties",
 policy:"policies",person:"people",inch:"inches",box:"boxes",class:"classes",
 "more note":"more notes"};
function pluralise(w){
 if(PLURALS[w])return PLURALS[w];
 if(/(s|x|z|ch|sh)$/i.test(w))return w+"es";
 if(/[^aeiou]y$/i.test(w))return w.slice(0,-1)+"ies";

function load(){
 let cur=null;
 try{cur=JSON.parse(localStorage.getItem(K)||"null")}catch(e){}
 if(boardIsEmpty(cur)){
  for(const ok of oldKeys()){
   let old=null;try{old=JSON.parse(localStorage.getItem(ok)||"null")}catch(e){}
   if(old&&!boardIsEmpty(old)&&!old.seeded){cur=old;break;}
  }
 }
 /* last-known-good snapshot beats an empty board every time */
 if(boardIsEmpty(cur)){
  let bak=null;try{bak=JSON.parse(localStorage.getItem(K+"_bak")||"null")}catch(e){}
  if(bak&&!boardIsEmpty(bak))cur=bak;
 }
 try{return Object.assign({},JSON.parse(JSON.stringify(BLANK)),cur||{})}
 catch(e){return JSON.parse(JSON.stringify(BLANK))}
}
/* ---------- versioned local history ----------
   A wipe must be visible and reversible. We keep up to 20 dated snapshots and
   always force one when the board shrinks, because that is the moment work
   disappears. Real records only — example data never enters history. */
const HKEY=K+"_hist", HMAX=20;
const realJobs=d=>((d&&d.jobs)||[]).filter(j=>!j._demo);
function readHist(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){return[]}}
function snapshot(reason){
 try{
  const hist=readHist();
  const last=hist[0];
  const now=Date.now();
  const shrank=last&&realJobs(D).length<(last.jobs||0);
  /* one every 2 minutes is plenty, unless something just got smaller */
  if(last&&!shrank&&now-last.at<120000)return;
  hist.unshift({at:now,reason:reason||(shrank?"board shrank":"autosave"),
   jobs:realJobs(D).length,notes:(D.notes||[]).length,
   data:JSON.stringify(D)});
  localStorage.setItem(HKEY,JSON.stringify(hist.slice(0,HMAX)));
 }catch(e){}
}
function restoreVersion(at){
 const v=readHist().find(x=>x.at===+at);if(!v)return;
 ask("Roll back to this version",
     new Date(v.at).toLocaleString()+" — "+plural(v.jobs,"job")+
     ". Your current board is snapshotted first, so this is reversible too.",
     "Roll back",()=>{
  snapshot("before rollback");
  try{D=Object.assign({},JSON.parse(JSON.stringify(BLANK)),JSON.parse(v.data));}catch(e){return;}
  save();applyTheme();close_();go("today");toast("Rolled back");
 });
}
function historySheet(){
 const h=readHist();
 sheet("Version history",
  h.length?`<p class="sm dim" style="margin:0 0 16px">Every version kept on this device. Rolling back snapshots what you have now first, so nothing is one-way.</p>`
   +h.map(v=>`<div class="ins">
     <div class="grow"><b>${esc(new Date(v.at).toLocaleString())}</b>
      <div class="in3">${plural(v.jobs,"job")} · ${plural(v.notes,"note")} · ${esc(v.reason)}</div></div>
     <button class="opt2" style="padding:6px 10px" onclick="restoreVersion(${v.at})">Roll back</button>
    </div>`).join("")
   :`<p class="sm dim">No versions saved yet. They start building as you work.</p>`);
}

const isQuota=e=>!!e&&(e.name==="QuotaExceededError"||e.name==="NS_ERROR_DOM_QUOTA_REACHED"||e.code===22||e.code===1014);
let _quotaWarned=false;
/* Storage full used to be swallowed silently — saving stopped and nothing said
   so. Shed history first, then the spare copy, and only then admit defeat. */
function save(){
 /* He keeps several Chairman tabs open. A BACKGROUND tab has no user input to
    protect — its only writes come from timers and ticks — but it still holds a
    whole copy of D from whenever it last synced. When it wrote, it stamped a
    fresh _ts over the foreground tab's newer data, and the settings he had
    just typed vanished a few seconds later. C-96 stopped a tab adopting OLDER
    data; it never stopped a stale tab PUBLISHING as if it were current.

    So: if this tab is hidden and storage has moved on without us, take the
    newer copy instead of overwriting it. A hidden tab is never the source of
    truth. The foreground tab always wins, which is the one he's typing in. */
 try{
  if(typeof document!=="undefined"&&document.hidden){
   const raw=localStorage.getItem(K);
   if(raw){
    const inc=JSON.parse(raw);
    if((inc._ts||0)>(D._ts||0)){
     D=Object.assign({},JSON.parse(JSON.stringify(BLANK)),inc);
     return;                                   /* adopted, wrote nothing */
    }
   }
  }
 }catch(e){}
 D._ts=Date.now();
 const body=JSON.stringify(D);
 let wrote=false;
 for(let attempt=0;attempt<3&&!wrote;attempt++){
  try{localStorage.setItem(K,body);wrote=true;}
  catch(e){
   if(!isQuota(e))break;
   if(attempt===0){                       /* drop the oldest half of history */
    try{const h=readHist();localStorage.setItem(HKEY,JSON.stringify(h.slice(0,Math.max(2,Math.floor(h.length/2)))));}catch(x){}
   }else if(attempt===1){                 /* then history and the spare entirely */
    try{localStorage.removeItem(HKEY);localStorage.removeItem(K+"_bak");}catch(x){}
   }
  }
 }
 if(!wrote){
  if(!_quotaWarned){
   _quotaWarned=true;
   try{toast("This device is out of storage — changes are NOT being saved");}catch(e){}
   try{ask("Out of storage on this device",
     "Your last change could not be written. Anything you type now may be lost when you close the app. Your cloud copy is unaffected — signing in on another device is safe. Clearing uploaded photos usually frees the most space.",
     "I understand",()=>{});}catch(e){}
  }
 }else{
  _quotaWarned=false;
  try{
   if(realJobs(D).length||(D.notes||[]).length)localStorage.setItem(K+"_bak",body);
   snapshot();
  }catch(e){ if(isQuota(e)){try{localStorage.removeItem(HKEY)}catch(x){}} }
 }
 /* tell the cloud something changed — without this nothing ever syncs */
 if(typeof cloudDirty==="function"){try{cloudDirty()}catch(e){}}
}
const job=id=>D.jobs.find(j=>j.id===id);

const STAGES=["Waiting","Estimating","Complete","Invoiced","Paid"];
const LBL={Waiting:"Waiting",Estimating:"Estimating",Complete:"Ready to Bill",Invoiced:"Invoice Out",Paid:"Paid",Lost:"Lost"};
const MK={Waiting:"◌",Estimating:"◍",Complete:"✦",Invoiced:"◉",Paid:"●",Lost:"○"};
const CKEY={Waiting:"lost",Estimating:"est",Complete:"rdy",Invoiced:"out",Paid:"paid",Lost:"lost"};
const ck=s=>CKEY[s]||"lost";
function pill(s,j){const lab=(j&&isProject(j)&&s==="Estimating")?"In the works":(LBL[s]||s);
 return `<span class="st ${s==="Waiting"?"s-wait":"s-"+ck(s)}"><span class="m">${MK[s]}</span>${lab}</span>`;}

/* ---- partner deal (Bobby) ----
   Mitigation : 10% of the WHOLE total, but only once the total clears $30,000.
   Rebuild    : 40% of what's left after the subs are paid. */
const subCost=(j,sid)=>+((j.subCosts||{})[sid]||0);
const subTotal=j=>(j.subs||[]).reduce((s,id)=>s+subCost(j,id),0);
/* extra charges — adjuster negotiation, site visits, rush work, etc. */
const extraList=j=>(j.extras||[]);
const extrasTotal=j=>extraList(j).reduce((s,x)=>s+(+x.amount||0),0);
/* ---- per-company fee rules ------------------------------------------------
   Some companies pay by an agreed schedule rather than his standard rate, and
   the schedule depends on the kind of work and sometimes on the size of it.
   A rule matches on job type and a minimum total; the most specific match wins,
   and an explicit fee typed on the job always beats a rule. */
function acctRules(j){
 const a=typeof acctOf==="function"?acctOf(j):null;
 return (a&&Array.isArray(a.rules))?a.rules:[];
}
function ruleFor(j){
 if(!j||j.feeLocked)return null;
 const total=+j.total||0,loss=(j.loss||"").toLowerCase();
 /* a rule's loss can be one type or a list — his mitigation is logged as
    "Water", so the mit deal has to answer to both names */
 const lossHit=r=>{
  if(!r.loss)return true;
  const set=Array.isArray(r.loss)?r.loss:[r.loss];
  return set.some(x=>String(x).toLowerCase()===loss);
 };
 const hits=acctRules(j).filter(r=>{
  if(!lossHit(r))return false;
  if(r.minTotal&&total<+r.minTotal)return false;
  return true;
 });
 if(!hits.length)return null;
 /* most specific first: a type+threshold rule beats a bare type rule */
 hits.sort((a,b)=>((+b.minTotal||0)-(+a.minTotal||0))||((b.loss?1:0)-(a.loss?1:0)));
 return hits[0];
}
/* the percentage this job pays — defaults to your standard rate */
const jobPct=j=>(j.feePct===0||j.feePct)?+j.feePct:(+D.me.rate||2);
/* A rule is WRITTEN ONTO the job rather than silently overriding fee() at
   render time. He can see what it did, and override it — which locks it. */
function applyAcctRule(j){
 if(!j||j.feeLocked)return false;
 const r=ruleFor(j);
 /* A total edited back under the threshold must give the rate back, or the job
    keeps charging 10% on a $20k mitigation that never qualified. */
 if(!r){
  if(j.feeRule){
   /* fall back to the COMPANY's arrangement, not the global 2% — Green
      Dynasty's under-threshold work is covered by the retainer */
   const a=typeof acctOf==="function"?acctOf(j):null;
   delete j.feeRule;
   j.feeMode=(a&&a.feeMode)||"pct";
   j.feePct=(a&&a.feePct!=null&&a.feePct!=="")?+a.feePct:undefined;
   return true;
  }
  return false;
 }
 const mode=r.mode||"aftersubs";
 if(j.feeMode===mode&&+j.feePct===+r.pct){j.feeRule=r.id;return false;}
 j.feeMode=mode;j.feePct=+r.pct;j.feeRule=r.id;
 return true;
}
/* FEELABEL strings start with "%", so strip it when the number already has one */
const basisWord=m=>(FEELABEL[m]||"").replace(/^%\s*/,"");
const ruleLabel=r=>!r?"":`${r.pct}% ${basisWord(r.mode||"aftersubs")}`
 +(r.loss?` on ${Array.isArray(r.loss)?r.loss.join(" / "):r.loss}`:"")
 +(r.minTotal?` over ${money0(r.minTotal)}`:"");
const FEEMODES=[["pct","% of estimate"],["aftersubs","% after subs"],["flat","Flat fee"],["hourly","Hourly"],["retainer","Retainer"]];
const FEELABEL={pct:"% of estimate",aftersubs:"% after subs are paid",flat:"Flat fee",hourly:"Hourly"};
/* Hourly: the rate this job pays, falling back to the standard rate in Settings.
   Exact minutes, no rounding up — the real number is already known. */
const jobRate=j=>(j&&(j.hourRate===0||j.hourRate))?+j.hourRate:(+((D.me||{}).hourRate)||0);
const hourlyAmount=j=>Math.round(((jobMin(j)||0)/60)*jobRate(j)*100)/100;
/* Part-payments against a job. Older jobs only had a single "paid in advance"
   figure, which can't express "they've paid me twice and still owe some". */
const payList=j=>(j&&Array.isArray(j.payments))?j.payments:[];
const paidTotal=j=>payList(j).reduce((s,p)=>s+(+p.amount||0),0);
function fee(j){
 const total=+j.total||0, adv=(+j.advance||0)+paidTotal(j), p=jobPct(j);
 const pct=total*(p/100);
 let feeOnly=0, kind=j.feeMode||"pct", base=total;
 if(kind==="flat"){ feeOnly=+j.flat||0; }
 else if(kind==="aftersubs"){ base=Math.max(0,total-subTotal(j)); feeOnly=base*(p/100); }
 else if(kind==="hourly"){ base=jobMin(j)||0; feeOnly=hourlyAmount(j); }
 else if(kind==="retainer"){ feeOnly=0; }          /* covered — nothing to invoice */
 else { kind="pct"; feeOnly=pct; }
 const extras=extrasTotal(j);
 const gross=feeOnly+extras;              /* everything they owe before any advance */
 return {pct,rate:p,feeOnly,extras,gross,adv,kind,base,subs:subTotal(j),
  hourRate:jobRate(j),mins:jobMin(j)||0,
  wouldBe:kind==="retainer"?pct:0,
  due:Math.max(0,gross-adv), over:adv>gross?adv-gross:0};
}

const sum=(a,f)=>a.reduce((s,j)=>s+f(j),0);

/* ================= ONE MONEY ENGINE ====================================
   fee(j) was never the problem — it's correct and it's the only thing that
   computes a number. The problem was that six different screens each decided
   for themselves WHICH jobs count as "out for collection", and three of them
   forgot to exclude disputes. The Today strip read "$74,085 out for
   collection" when every dollar of it was in litigation and none of it was
   chaseable. That is the same class of defect as ckLive and flowOf: a
   question every screen asks and each one answers on its own.

   So there is now exactly one answer. moneyState(j) puts each job in exactly
   one bucket; MONEY() adds them up. No screen may filter jobs and sum fees
   by hand — if a screen wants a number it takes it from here.

   The buckets are ordered by how real the money is:
     banked     it's in the account
     late       invoiced, past terms, chase it
     sent       invoiced, still inside terms
     unbilled   work is DONE and no invoice exists — the fastest cash there is
     working    being estimated, not yet earned
     contested  in dispute; a case, not a receivable
     covered    retainer work; tracked, never invoiced                        */
function moneyState(j){
 if(!j||j.status==="Lost")return "lost";
 const f=fee(j);
 /* Retainer work is never invoiced at ANY stage. Reading this only at
    Complete meant that the moment he marked one Paid it fell through to
    banked and reported $0 — three of his closed jobs showed
    "Collected · $0" when they were retainer work worth tracking. */
 if(onRetainer(j)&&f.gross===0&&["Complete","Paid"].includes(j.status))return "covered";
 /* Money that ARRIVED is not money at risk. "Dispute beats everything" was
    too broad: Benny & Donna Rains is Paid $8,930.51 and still carries the
    Rains disputeStage, so collected cash was being counted as contested.
    A continuing claim lives on the job that's still owed — this one is done. */
 if(j.status==="Paid")return "banked";
 if(inDispute(j))return "contested";
 if(j.status==="Invoiced")return isLate(j)?"late":"sent";
 if(j.status==="Complete")return "unbilled";
 return "working";                          /* Waiting + Estimating */
}
const MONEY_STATES=["banked","late","sent","unbilled","working","contested","covered"];
function MONEY(){
 const b={};
 MONEY_STATES.forEach(k=>b[k]={jobs:[],n:0,amt:0});
 b.lost={jobs:[],n:0,amt:0};
 (D.jobs||[]).forEach(j=>{
  const s=moneyState(j),f=fee(j);
  /* banked is what he actually received; everything else is what's still owed */
  const amt=s==="banked"?f.gross:s==="covered"?f.wouldBe:f.due;
  b[s].jobs.push(j);b[s].n++;b[s].amt+=amt;
 });
 /* Money he can actually go and get. Disputes are deliberately absent — that
    is the whole point of this function existing. */
 b.collectable={n:b.late.n+b.sent.n+b.unbilled.n,
   amt:b.late.amt+b.sent.amt+b.unbilled.amt};
 b.invoicedOut={n:b.late.n+b.sent.n,amt:b.late.amt+b.sent.amt};
 return b;
}
/* the single sentence about where he stands, used everywhere it's needed */
function moneyHeadline(){
 const m=MONEY();
 if(m.unbilled.amt>0)return {k:"unbilled",amt:m.unbilled.amt,
   line:money0(m.unbilled.amt)+" earned and never invoiced",
   sub:"Work is finished. This is the fastest money in the business."};
 if(m.late.amt>0)return {k:"late",amt:m.late.amt,
   line:money0(m.late.amt)+" past due",sub:plural(m.late.n,"invoice")+" over terms."};
 if(m.sent.amt>0)return {k:"sent",amt:m.sent.amt,
   line:money0(m.sent.amt)+" out, inside terms",sub:"Nothing to chase yet."};
 if(m.contested.amt>0)return {k:"contested",amt:m.contested.amt,
   line:money0(m.contested.amt)+" contested",sub:"All of it is a case, none of it is a receivable."};
 return {k:"clear",amt:0,line:"Nothing owed to you",sub:"Everything billed is collected."};
}

/* ---- disputes ------------------------------------------------------------
   Money that's gone legal is not a receivable, it's a case. It leaves every
   collection nag — no "chase this invoice" advice on something in mediation —
   and lives on its own screen with a stage, the contested amount, and a
   dated chronology that can be handed to an attorney as-is. */
/* Late is relative to the terms, not a flat window. A 30-day invoice on day 20
   is fine; due-on-receipt on day 5 is not. Falls back to 14 when no terms are
   set. A missing or unparseable invoice date counts as late rather than fresh —
   silence is the failure mode that costs money. */
const netDays=j=>{
 const t=String((j&&j.terms)||(D.me&&D.me.terms)||"").toLowerCase();
 if(/receipt|due on completion|on completion/.test(t))return 0;
 const m=t.match(/(\d{1,3})/);
 return m?+m[1]:14;
};
function isLate(j){
 if(!j||j.status!=="Invoiced")return false;
 if(!j.invDate)return true;
 const d=ago(j.invDate);
 if(d==null||isNaN(d))return true;
 return d>netDays(j);
}
/* THE colour resolver. ck() returns the stage key; this is the only thing that
   knows a stage can be overridden by a condition. Crimson used to live inside
   one template on the job page, so it never fired anywhere else on the board,
   the invoice list or Money. Every renderer calls this now. */
function ckLive(j){
 if(!j)return "lost";
 if(inDispute(j))return "late";                       /* a fight is an alarm */
 if(j.status==="Invoiced"&&isLate(j))return "late";
 if(!DONE_ST.includes(j.status)&&j.dueDate&&j.dueDate<today())return "late";
 return ck(j.status);
}
const DSTAGES=["Negotiation","Demand sent","Demand expired","Pre-suit","Mediation","Filed","Trial","Settled"];
const inDispute=j=>!!(j&&j.disputeStage&&j.disputeStage!=="Settled");
const disputes=()=>D.jobs.filter(j=>j.disputeStage);
const openDisputes=()=>D.jobs.filter(inDispute);

/* ---- the next move --------------------------------------------------------
   Every active job carries exactly one dated next action. Not a task list —
   ONE move, so the board can manage him instead of the other way round.
   A job without one is itself a queue item: "set the next move". */
const NEXT_PRESETS=["Call to schedule the visit","Site visit","Start the estimate",
 "Send the estimate","Follow up — no answer","Chase the invoice","Write the supplement"];
const ACTIVE_ST=["Waiting","Estimating","Complete","Invoiced"];
const nextOf=j=>(j&&j.next&&j.next.text)?j.next:null;
const needsNext=j=>ACTIVE_ST.includes(j.status)&&!inDispute(j)&&!j._demo;
function nextState(j){const n=nextOf(j);if(!n)return "none";
 return n.date<today()?"over":n.date===today()?"today":"later";}
function setNextSheet(id){
 const j=job(id);if(!j)return;
 const n=nextOf(j);
 sheet("Next move — "+jobName(j),`
  <label><span class="t">One action</span>
   <input class="in" id="nxt" value="${esc(n?n.text:"")}" placeholder="Call to schedule the site visit" autocomplete="off"></label>
  <div class="upbar" style="margin:-10px 0 16px">
   ${NEXT_PRESETS.map(x=>`<button type="button" onclick="document.getElementById('nxt').value=${JSON.stringify(x).replace(/"/g,"&quot;")}">${x}</button>`).join("")}</div>
  <label><span class="t">When</span><input class="in" id="nxd" type="date" value="${esc(n?n.date:today())}"></label>
  <div class="upbar" style="margin:-10px 0 16px">
   <button type="button" onclick="nxdSet(0)">today</button><button type="button" onclick="nxdSet(1)">tomorrow</button>
   <button type="button" onclick="nxdSet(2)">in 2 days</button><button type="button" onclick="nxdSet(7)">next week</button></div>
  <button class="btn" onclick="saveNextQuick('${id}')">Lock it in</button>`);
 setTimeout(()=>$("#nxt")&&$("#nxt").focus(),90);
}
function nxdSet(d){const t=new Date();t.setDate(t.getDate()+d);const el=$("#nxd");if(el)el.value=isoDay(t);}
function saveNextQuick(id){const j=job(id);if(!j)return;
 const t=$("#nxt").value.trim();
 if(!t){toast("One action — even 'call them' counts");return;}
 j.next={text:t,date:$("#nxd").value||today()};save();close_();render();toast("Locked in");}
function doneNext(id){const j=job(id);if(!j||!nextOf(j))return;
 D.notes.unshift({id:uid(),jobId:id,kind:"Note",pin:false,created:new Date().toISOString(),
  text:"[Done] "+j.next.text});
 j.next=null;save();
 /* A job that's left the active stages is finished with you — don't demand a
    next move for it, just return to the queue. Otherwise ask for the next one. */
 if(!needsNext(j)){render();toast("Done — back to the queue");go("today");return;}
 setNextSheet(id);
}

/* ---- the queue and the co-pilot ------------------------------------------
   Overdue moves first, then today's, then jobs missing a move entirely.
   The user should never have to hold the day in working memory. */
let _skips=[];
function skipNext(id){_skips.push(id);render();}

/* ---- act on a job without opening it -------------------------------------
   A client calls to push a visit, rush a job, or cancel. Each of those was a
   navigation plus a form. From the queue row they are one tap. */
function qSched(id){
 const j=job(id);if(!j)return;
 const n=nextOf(j);
 sheet("When — "+jobName(j),`
  <div class="upbar" style="margin:0 0 16px">
   <button type="button" onclick="qSetDate('${id}',0)">Today</button>
   <button type="button" onclick="qSetDate('${id}',1)">Tomorrow</button>
   <button type="button" onclick="qPush('${id}',1)">Push 1 day</button>
   <button type="button" onclick="qSetDate('${id}',7)">Next week</button></div>
  <label><span class="t">Or pick the day</span>
   <input class="in" id="qsdate" type="date" value="${esc(n?n.date:today())}"></label>
  <label><span class="t">Time <em>optional — shows on the calendar</em></span>
   <input class="in" id="qstime" type="time" value="${esc(j.startTime||"")}"></label>
  ${n?`<p class="xs dim" style="margin:-6px 0 16px">Moving: <b>${esc(n.text)}</b></p>`
     :`<label><span class="t">What's the move?</span>
   <input class="in" id="qstext" value="" placeholder="Call to schedule the site visit" autocomplete="off"></label>
  <div class="upbar" style="margin:-10px 0 16px">
   ${NEXT_PRESETS.slice(0,5).map(x=>`<button type="button" onclick="document.getElementById('qstext').value=${JSON.stringify(x).replace(/"/g,"&quot;")}">${x}</button>`).join("")}</div>`}
  <button class="btn" onclick="qSaveDate('${id}')">Set it</button>`);
}
function qSetDate(id,plus){const t=new Date();t.setDate(t.getDate()+plus);qWrite(id,isoDay(t));}
function qPush(id,plus){
 const j=job(id);const n=nextOf(j);
 const base=n&&n.date>=today()?n.date:today();
 const t=new Date(base+"T12:00:00");t.setDate(t.getDate()+plus);
 qWrite(id,isoDay(t));
}
function qSaveDate(id){
 const d=$("#qsdate")?$("#qsdate").value:"";
 const tm=$("#qstime")?$("#qstime").value:"";
 const tx=$("#qstext")?$("#qstext").value.trim():"";
 if(!d){toast("Pick a day");return;}
 qWrite(id,d,tm,tx);
}
function qWrite(id,date,time,text){
 const j=job(id);if(!j)return;
 const n=nextOf(j);
 const t=(text||"")||(n?n.text:"")||"Call to schedule the visit";
 j.next={text:t,date:date};
 if(time)j.startTime=time;
 /* Scheduling the job and dating the next move were two separate facts, so
    quickSchedule could move a job to Monday while the queue still called it
    overdue from last Thursday. One date now drives both. */
 if(j.startDate&&j.startDate<date&&!DONE_ST.includes(j.status))j.startDate=date;
 if(!j.startDate)j.startDate=date;
 if(j.dueDate&&j.dueDate<date)j.dueDate=addDays(date,LEADDAYS);
 save();close_();render();
 toast(date===today()?"Set for today":"Set for "+fmt(date));
}
function toggleRush(id){
 const j=job(id);if(!j)return;
 j.rush=!j.rush;
 if(j.rush){j._prePrio=j.priority||"Moderate";j.priority="Urgent";}
 else if(j._prePrio){j.priority=j._prePrio;delete j._prePrio;}
 save();render();

/* ---- lead intake: paste, parse, one tap -----------------------------------
   Leads arrive as forwarded texts and emails; retyping them is where errors
   get in. Deterministic client-side parse — instant, offline, no key needed.
   Low confidence is fine: everything lands in editable fields before saving. */
function parseLeadText(t){
 const out={};
 const ph=t.match(/(\+?1[\s.\-]?)?\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/);
 if(ph)out.phone=ph[0].trim();
 const em=t.match(/[\w.+-]+@[\w-]+\.[\w.]+/);
 if(em)out.email=em[0];
 const ad=t.match(/\d{1,6}\s+[A-Za-z0-9'.\s]{2,40}\b(?:St|Street|Dr|Drive|Ln|Lane|Rd|Road|Ct|Court|Blvd|Boulevard|Ave|Avenue|Way|Cir|Circle|Trl|Trail|Pkwy|Pl|Place|Hwy|Loop)\b\.?(?:[,\s]+[A-Za-z\s]{2,20})?(?:[,\s]+(?:TX|Texas))?(?:[,\s]+\d{5})?/i);
 if(ad)out.address=ad[0].replace(/\s+/g," ").replace(/[,\s]+$/,"").trim();
 const cl=t.match(/claim\s*(?:no\.?|number|#)?\s*[:#]?\s*([A-Z0-9][A-Z0-9\-]{5,})/i);
 if(cl)out.claim=cl[1];
 const CARR=["State Farm","Allstate","USAA","Farmers","Liberty Mutual","Travelers","Nationwide",
  "Progressive","TWIA","Chubb","SageSure","SafePoint","American Family","Homeowners of America","Lemonade"];
 const ca=CARR.find(c=>new RegExp(c.replace(/ /g,"\\s+"),"i").test(t));
 if(ca)out.insurer=ca;
 let nm=(t.match(/(?:name|from|client|insured|homeowner|customer)\s*[:\-]\s*([A-Z][a-zA-Z'’.\-]+(?:\s+[A-Z][a-zA-Z'’.\-]+){0,2})/i)||[])[1];
 if(!nm){const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  nm=lines.find(l=>/^[A-Z][a-z'’.\-]+(\s+[A-Z][a-z'’.\-]+){1,2}$/.test(l))||"";}
 if(nm)out.owner=nm.trim();
 const LK=[["water","Water"],["leak","Water"],["flood","Water"],["fire","Fire"],["mold","Mold"],
  ["roof","Roof"],["hail","Wind / Hail"],["wind","Wind / Hail"],["storm","Wind / Hail"],
  ["remodel","Remodel"],["rebuild","Rebuild"],["mitigation","Mitigation"]];
 const hit=LK.find(([k])=>new RegExp("\\b"+k,"i").test(t));
 if(hit)out.loss=hit[1];
 return out;
}

/* A job you cannot act on cannot be late. "Waiting" means the site isn't ready
   — mitigation still running, no Matterport, no adjuster scope. Calling that
   "2 days overdue — start the estimate" is the queue lying to you about work
   that is not yours to do yet. It still belongs on the list, just never in red. */
const qActionable=j=>!!j&&j.status!=="Waiting";
const daysLate=d=>Math.max(1,Math.round((dayFromISO(today())-dayFromISO(d))/86400000));
const isRush=j=>!!(j&&(j.rush||j.priority==="Urgent"));

/* rush first, then genuinely late, then today's, then jobs with no move at all,
   then blocked ones, then work already booked for a later day */
const QORDER={rush:0,over:1,today:2,none:3,wait:4,later:5};

function queueItems(){
 const items=[];
 D.jobs.filter(needsNext).forEach(j=>{
  const n=nextOf(j);
  let kind,why,label;
  if(!n){
   kind="none"; why="no next move set"; label="Set the next move";
  }else{
   label=n.text;
   if(!qActionable(j)){
    kind="wait"; why=j.waitingOn?("waiting — "+j.waitingOn):"waiting — not ready yet";
   }else if(n.date<today()){
    kind="over"; why=plural(daysLate(n.date),"day")+" overdue";
   }else if(n.date===today()){
    kind="today"; why="due today";
   }else{
    kind="later"; why="booked "+fmt(n.date);
   }
  }
  /* rush overrides the bucket for sorting but keeps its own reason visible */
  const sortKind=(isRush(j)&&kind!=="later")?"rush":kind;
  items.push({j,kind,sortKind,why,label,date:n?n.date:null,rush:isRush(j)});
 });
 items.sort((a,b)=>{
  const d=QORDER[a.sortKind]-QORDER[b.sortKind];
  if(d)return d;
  if(a.date&&b.date&&a.date!==b.date)return a.date.localeCompare(b.date);
  return jobName(a.j).localeCompare(jobName(b.j));
 });
 return items.filter(x=>!_skips.includes(x.j.id));
}

 ||(x.dueDate||"9999-99-99").localeCompare(y.dueDate||"9999-99-99")

function openIDB(){return new Promise(res=>{try{const r=indexedDB.open("chairman_files",1);

function idbPut(rec){return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction("f","readwrite");
 t.objectStore("f").put(rec);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res()}});}
function idbGet(id){return new Promise(res=>{if(!idb)return res(null);try{const t=idb.transaction("f","readonly");
 const q=t.objectStore("f").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null)}});}
function idbDel(id){return new Promise(res=>{if(!idb)return res();try{const t=idb.transaction("f","readwrite");
 t.objectStore("f").delete(id);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res()}});}
const readAsDataURL=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});

/* photos are resized to ~1600px so a phone can hold far more of them */
async function prepFile(f){
 const raw=await readAsDataURL(f);
 if(!f.type.startsWith("image/")||f.type==="image/gif")return {data:raw,w:0,h:0};
 try{
  const img=await loadImg(raw);let w=img.naturalWidth,h=img.naturalHeight;
  const MAX=1600,m=Math.max(w,h);
  if(m>MAX){const s=MAX/m;w=Math.round(w*s);h=Math.round(h*s);}
  const c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return {data:c.toDataURL("image/jpeg",.82),w,h};
 }catch(e){return {data:raw,w:0,h:0};}
}
const FCAT=["Photo","Contract","Estimate","Policy","Email","Other"];
/* Document type is a SEPARATE visual channel from pipeline stage. Stage owns the
   pill; type owns a filled square tile. Different shape, different position, so
   the eye never has to decode one against the other. Five types is under the
   limit where colour stops helping (~7 alone, ~4 when read alongside anything
   else) — and every tile carries its glyph too, so colour is never the only cue. */
const FICON={Photo:"◙",Contract:"✍",Estimate:"$",Policy:"⚖",Email:"✉",Other:"▤"};
const FTINT={Photo:"#7FD4C1",Contract:"#C9AEF5",Estimate:"#FFC98F",Policy:"#F5C8A0",Email:"#9FC4F5",Other:"#A9AFB5"};
const fTint=c=>FTINT[c]||FTINT.Other;
/* "Is this signed?" is unsolved across every CRM in this market — it lives as one
   word in a text column. Here it is a badge on the tile itself. */
/* filename match must be a whole word — "design.pdf" is not a signed contract */
const isSigned=f=>!!(f&&(f.signed||/(^|[-_ .(])signed([-_ .)]|$)/i.test(f.name||"")));
function fileTile(f){
 const t=fTint(f.cat),sg=f.cat==="Contract"&&isSigned(f);
 return `<span class="ftile" style="--tint:${t}">${FICON[f.cat]||"▤"}${
  sg?`<i class="sgn" title="Signed">✓</i>`:""}</span>`;
}
/* ================= THE ESTIMATES FOLDER =================================
   He finishes in Xactimate and exports to one folder on the desktop. Chairman
   points at that folder, notices what's new, and works out which job each PDF
   belongs to.

   A browser cannot watch a folder in the background — there is no daemon and
   no permission for one. What it CAN do is hold a directory handle across
   sessions and read it whenever the app is open. So this catches up on open
   rather than firing the instant a file lands. Stated plainly because
   pretending otherwise would just look broken later.

   Matching is ADDRESS-first. His exports are named for the property
   (10935_PECAN_DR_FINAL_DRAFT_CON.pdf, 521_WINBURN_..., "1209 Wisdom Drive,
   Deer Park, TX - Final Estimate.pdf"), only sometimes for the client
   (GARY_BYRD, GIBSON). Nothing attaches itself: matches wait in a queue. */
const ESTDIR_KEY="_estimates_dir";
let _estHandle=null, _estScanning=false;

const estSeen=()=>{if(!D.estSeen)D.estSeen={};return D.estSeen;};
const estQ=()=>{if(!D.estQ)D.estQ=[];return D.estQ;};

/* Xactimate's export suffixes carry the document TYPE, not the property. Strip
   them before matching or every file looks like every other file. */
const EST_NOISE=/(_?CON$)|(_?FINAL[_ ]?DRAFT)|(_?CUSTOMER[_ ]?TOTAL[_ ]?AMOUNT)|(_?COMPONENTS)|(-?\s*FINAL ESTIMATE)|(#\d+)|(\(GUEST\))|(\(RECON\))|(\(UPDATE[D]?\))|(^RECON-)|(^NEW_)|(_?UPDATED?)|(_?SUPPLEMENT)/gi;
function estDocKind(n){
 if(/CUSTOMER[_ ]?TOTAL[_ ]?AMOUNT/i.test(n))return "Totals";
 if(/COMPONENTS/i.test(n))return "Components";
 if(/SUPPLEMENT/i.test(n))return "Supplement";
 if(/CONTENTS/i.test(n))return "Contents";
 return "Estimate";
}
function estNorm(name){
 let s=String(name||"").replace(/\.[a-z0-9]+$/i,"");
 s=s.replace(EST_NOISE," ");
 s=s.replace(/[_,]+/g," ").replace(/\s+/g," ").trim().toUpperCase();
 return s;
}
/* "DR", "STREET", "LANE" etc. are in every address and identify nothing */
const EST_STOP=new Set(["DR","DRIVE","ST","STREET","LN","LANE","RD","ROAD","AVE","AVENUE",
 "CT","COURT","BLVD","WAY","CIR","CIRCLE","PL","PLACE","TRL","TRAIL","N","S","E","W",
 "TX","TEXAS","HOUSTON","LA","PORTE","DEER","PARK","PASADENA","THE","AND"]);
const estWords=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9 ]+/g," ")
 .split(/\s+/).filter(w=>w&&w.length>1&&!EST_STOP.has(w)&&!/^\d+$/.test(w));
const estNum=s=>{const m=String(s||"").match(/\b(\d{3,6})\b/);return m?m[1]:"";};

function estScore(fileName,j){
 const f=estNorm(fileName);
 const addr=String(j.address||""), who=[j.owner,j.contractor].filter(Boolean).join(" ");
 let score=0; const why=[];
 /* a street number is the single most reliable token he produces */
 const fn=estNum(f), an=estNum(addr);
 if(fn&&an&&fn===an){score+=60;why.push("street no. "+fn);}
 const fw=estWords(f), aw=estWords(addr), ww=estWords(who);
 const hitA=fw.filter(w=>aw.some(x=>estFuzzy(w,x)));
 const hitW=fw.filter(w=>ww.some(x=>estFuzzy(w,x)));
 if(hitA.length){score+=28*Math.min(2,hitA.length);why.push("address: "+hitA.slice(0,2).join(" "));}
 if(hitW.length){score+=30*Math.min(2,hitW.length);why.push("name: "+hitW.slice(0,2).join(" "));}
 /* a number that matches nothing is a signal AGAINST, not just absence */
 if(fn&&an&&fn!==an&&!hitW.length)score-=25;
 return {score,why:why.join(" · ")};
}
/* Two words differing by one letter, for the spelling drift between what he
   typed into a job and what Xactimate exported. His board says "Tomkawa" and
   the file says "TONKAWA". Length 5+ only — on short words a single letter is
   the difference between two real streets. */
function estFuzzy(a,b){
 if(a===b)return true;
 if(Math.abs(a.length-b.length)>1||a.length<5||b.length<5)return false;
 let i=0,k=0,edits=0;
 while(i<a.length&&k<b.length){
  if(a[i]===b[k]){i++;k++;continue;}
  if(++edits>1)return false;
  if(a.length===b.length){i++;k++;}
  else if(a.length>b.length)i++;
  else k++;
 }
 return edits+(a.length-i)+(b.length-k)<=1;
}
function estMatch(fileName){
 const live=D.jobs.filter(j=>!["Lost"].includes(j.status));
 const scored=live.map(j=>{const s=estScore(fileName,j);return {j,score:s.score,why:s.why};})
  .sort((a,b)=>b.score-a.score);
 const best=scored[0];
 if(!best||best.score<=0)return null;
 if(best.score>=40)return best;
 /* A single distinctive street name — BONNER, WINBURN, OAKWILD — scores 28,
    under the confident threshold. But if it lands on exactly ONE job and
    nothing else scores at all, ambiguity isn't the problem; a weak absolute
    number is. Offer it as a low-confidence suggestion. Nothing auto-files, so
    the worst case is he taps ✕ once. */
 const second=scored.find(x=>x.j.id!==best.j.id&&x.score>0);
 if(best.score>=26&&!second)return Object.assign({},best,{why:best.why+" · only job it fits"});
 return null;
}

async function estPermit(h,ask){

 if(!ask)return false;
 return (await h.requestPermission(opt))==="granted";

async function estWalk(dir,out,depth,path){

 for await(const [name,h] of dir.entries()){
  if(name.startsWith(".")||name.startsWith("_"))continue;
  if(h.kind==="directory"){await estWalk(h,out,depth+1,path+name+"/");}
  else if(/\.pdf$/i.test(name)){out.push({h,name,path:path+name});}
 }
}

/* Manual size control — everything scales together */
const ZOOMS=[["Small",.9],["Normal",1],["Large",1.15],["Huge",1.3]];
const FIT_MIN=0.80;              /* never shrink below this — smaller strains the eyes */
/* Zoom is scoped to the content, never the whole document and never #view
   itself. Zooming the document moved the sidebar between screens, so clicks
   landed on the wrong nav row. Zooming #view was worse: it carries
   margin-left:225px to clear the fixed sidebar, and zoom scales that margin
   too, sliding the page left underneath the sidebar. So we scale an inner
   wrapper, leaving both the chrome and the pane's offset alone. */
function zoomTarget(){
 const pane=document.getElementById("view");
 if(!pane)return null;
 let inner=document.getElementById("vz");
 if(!inner||inner.parentElement!==pane){
  inner=document.createElement("div");
  inner.id="vz";
  while(pane.firstChild)inner.appendChild(pane.firstChild);
  pane.appendChild(inner);
 }
 return inner;
}
function applyZoom(){
 const base=D.zoom||1;
 document.documentElement.style.zoom="";          /* undo any earlier global zoom */
 const pane=document.getElementById("view");
 if(pane)pane.style.zoom="";                      /* and any earlier pane zoom */
 const inner=zoomTarget();
 if(!inner)return;
 inner.style.zoom=base===1?"":String(base);
 if(D.fitAll===false){syncHdrH();return;}
 requestAnimationFrame(()=>{
  const cur=parseFloat(inner.style.zoom)||base;
  const need=inner.scrollHeight||0;
  const have=(window.innerHeight||0)-(inner.getBoundingClientRect().top||0)-8;
  if(need&&have>0&&need*cur>have+2){
   const z=Math.max(FIT_MIN*base,Math.min(base,have/need));
   inner.style.zoom=String(z);
  }
  /* the sticky offsets are expressed in this element's scaled space, so they
     are only correct once the final zoom is settled — which is right here */
  syncHdrH();
 });
}

async function flushCloud(){

  const r=await cloudFetch("/rest/v1/boards?on_conflict=user_id",{method:"POST",
   headers:{"content-type":"application/json",Prefer:"resolution=merge-duplicates"},

async function cloudPull(){
 if(!cloudCfg()||!signedIn())return;
 /* Never swap the whole board out from under an open form. The job being
    edited would be replaced mid-edit and the save would write onto a stale
    record. Whatever is on the server will still be there in 25 seconds. */
 if(document.getElementById("ov"))return;
 try{
  const r=await cloudFetch("/rest/v1/boards?select=data,updated_at&user_id=eq."+SESS.user.id);
  if(!r.ok)return;
  const rows=await r.json();
  if(!rows.length){flushCloud();return;}          /* first device seeds the cloud */
  const remote=rows[0],rts=new Date(remote.updated_at).getTime();
  if(!remote.data)return;
  /* An empty cloud copy must never wipe a board that has real work on it —
     that is how a whole day of entries disappears. But if the empty copy is
     NEWER, it was a deliberate delete, and a stale tab must not resurrect
     what was cleared somewhere else. */
  if(boardIsEmpty(remote.data)&&!boardIsEmpty(D)&&(D._ts||0)>rts){flushCloud();return;}
  /* Small clock differences between devices should not cause a fight. */
  if(rts<=(D._ts||0)+1500)return;

  /* The cloud is newer — but if this device holds work the cloud has never
     seen, a straight overwrite destroys it silently. That is the failure that
     ate real jobs. Ask, and default to keeping everything. */
  const lost=onlyHere(D,remote.data);
  if(lost.length){
   if(_conflictOpen)return;
   _conflictOpen=true;
   snapshot("before cloud conflict");
   askConflict(lost,remote.data,rts);
   return;
  }
  adoptRemote(remote.data,rts);
 }catch(e){}
}

  const ids=new Set(((remote&&remote[k])||[]).map(x=>x.id));

   .forEach(x=>out.push({k,label,id:x.id,name:k==="jobs"?jobName(x):(x.text||x.name||label)}));

    a snapshot was taken before this prompt, under Settings → Version history.</p>
   <button class="btn" style="margin:0 0 10px" onclick="resolveConflict('merge')">Keep both — merge them</button>
   <button class="btn sec" style="margin:0 0 10px" onclick="resolveConflict('mine')">Keep only what's on this device</button>
   <button class="btn sec" style="margin:0" onclick="resolveConflict('theirs')">Use the cloud copy instead</button>`);

 if(!em||!pw)return err.textContent="Email and password.";
 try{
  err.textContent="…";

   ?await authCall("token?grant_type=password",{email:em,password:pw})
