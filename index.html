/* Streams where the provider supports it, falls back to a single reply where
   it doesn't. onToken fires with each fragment as it arrives. */
async function streamAI(system,user,onToken){
 const c=AICFG();
 if(c.provider==="claude"){
  const r=await fetch("https://api.anthropic.com/v1/messages",
   {method:"POST",headers:{"content-type":"application/json",
     "x-api-key":c.key,"anthropic-version":"2023-06-01",
     "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:claudeModel(false),max_tokens:1600,stream:true,system,
     messages:[{role:"user",content:user}]})});
  if(!r.ok||!r.body){const d=await r.json().catch(()=>({}));
   throw new Error((d.error&&d.error.message)||("HTTP "+r.status));}
  await readSSE(r,line=>{
   try{const j=JSON.parse(line);
    if(j.type==="content_block_delta"&&j.delta&&j.delta.text)onToken(j.delta.text);
    if(j.type==="error"&&j.error)throw new Error(j.error.message);
   }catch(e){}
  });
  return;
 }
 if(c.provider==="gemini"){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel()}:streamGenerateContent?alt=sse&key=${encodeURIComponent(c.key)}`;
  const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},
   body:JSON.stringify({system_instruction:{parts:[{text:system}]},
    contents:[{role:"user",parts:[{text:user}]}]})});
  if(!r.ok||!r.body){const d=await r.json().catch(()=>({}));
   throw new Error((d.error&&d.error.message)||("HTTP "+r.status));}
  await readSSE(r,line=>{
   try{const j=JSON.parse(line);
    const t=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
    if(t)onToken(t);
   }catch(e){}
  });
  return;
 }
 /* no streaming on this provider — deliver it in one go */
 const t=await callAI(system,user);
 onToken(t);
}
async function readSSE(res,onLine){
 const rd=res.body.getReader(),dec=new TextDecoder();
 let buf="";
 for(;;){
  const {done,value}=await rd.read();
  if(done)break;
  buf+=dec.decode(value,{stream:true});
  const parts=buf.split("\n");
  buf=parts.pop();
  parts.forEach(p=>{
   const s=p.trim();
   if(!s.startsWith("data:"))return;
   const payload=s.slice(5).trim();
   if(!payload||payload==="[DONE]")return;
   onLine(payload);
  });
 }
}

let _mr=null,_mrChunks=[];
async function recToggle(targetId){
 const btn=$("#recBtn");
 if(_mr){_mr.stop();return;}
 if(!navigator.mediaDevices||!window.MediaRecorder)return toast("This browser can't record — try the mic button");
 if(!canReadDocs())return toast("Transcription needs Google Gemini — set it in Settings");
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  _mrChunks=[];
  _mr=new MediaRecorder(stream);
  _mr.ondataavailable=ev=>{if(ev.data.size)_mrChunks.push(ev.data)};
  _mr.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());
   const blob=new Blob(_mrChunks,{type:_mr.mimeType||"audio/webm"});
   _mr=null;if(btn)btn.textContent="● Record";
   const el=document.getElementById(targetId);if(!el)return;
   toast("Transcribing…");
   try{
    const dataUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
    const text=await transcribeAudio(dataUrl);
    el.value=(el.value?el.value+" ":"")+text.trim();
    toast("Transcribed");
   }catch(e){toast("Couldn't transcribe: "+(e.message||""));}
  };
  _mr.start();
  if(btn)btn.textContent="◼ Stop recording";
  toast("Recording — talk");
 }catch(e){toast(e.name==="NotAllowedError"?"Allow microphone access":"Couldn't start recording");}
}
async function transcribeAudio(dataUrl){
 const c=AICFG();
 const b64=dataUrl.split(",")[1];
 const mime=(dataUrl.match(/^data:([^;]+)/)||[])[1]||"audio/webm";
 const ask=async model=>{
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(c.key)}`,
   {method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({contents:[{role:"user",parts:[{inline_data:{mime_type:mime,data:b64}},
     {text:"Transcribe this voice note exactly as spoken. Fix obvious punctuation only. Reply with the transcript and nothing else."}]}],
     generationConfig:{temperature:0,maxOutputTokens:1000}})});
  return r.json();
 };
 let d=await ask(geminiModel());
 if(d.error&&/not found|no longer|not available|unsupported|deprecat|does not exist|invalid model|update your code/i.test(d.error.message||""))
  d=await ask(await detectGeminiModel());
 if(d.error)throw new Error(d.error.message||"Transcription failed");
 const t=d?.candidates?.[0]?.content?.parts?.map(p2=>p2.text).join("")||"";
 if(!t)throw new Error("Heard nothing usable");
 return t;
}

/* "API key not valid" was really a 17-character key in a 39-character slot —
   a password manager had filled the field. Catch the shape before the API does. */
function keyProblem(provider,k){
 if(!k)return "";
 if(/\s/.test(k))return "That key has a space in it — it may have been cut short when pasted.";
 if(provider==="gemini"){
  if(!/^AIza/.test(k))return "Google keys start with AIza. This one doesn't — check you copied the whole thing.";
  if(k.length<39)return "That key is "+k.length+" characters; Google keys are 39. It looks cut short.";
 }
 if(provider==="openai"&&!/^sk-/.test(k))return "OpenAI keys start with sk-.";
 if(provider==="claude"||provider==="anthropic"){
  if(!/^sk-ant-/.test(k))return "Anthropic keys start with sk-ant-. Check you copied the whole thing.";
  if(k.length<50)return "That key is "+k.length+" characters — an Anthropic key is much longer. It looks cut short.";
 }
 if(provider==="groq"&&!/^gsk_/.test(k))return "Groq keys start with gsk_.";
 if(k.length<20)return "That looks too short to be a full key.";
 return "";
}

   toast("That's a "+AIPROV[own].label+" key — switched you over");return;

function exportEstimates(){
 const rows=summaryRows();
 const head=["Date","For","Property owner","Address","Job type","Carrier","Claim","Estimate total","Fee","Status"];
 const csv=[head.join(",")].concat(rows.map(j=>{const f=fee(j);
  return [j.readyDate||j.created2||"",forContractor(j)?j.contractor||"":j.owner||"",j.owner||"",j.address||"",
   j.loss||"",j.insurer||"",j.claim||"",(+j.total||0).toFixed(2),
   (f.kind==="retainer"?f.wouldBe:f.gross).toFixed(2),j.status]
   .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",");})).join("\n");
 const b=new Blob([csv],{type:"text/csv"});const a2=document.createElement("a");
 a2.href=URL.createObjectURL(b);a2.download="chairman-estimates-"+today()+".csv";a2.click();
 toast("Exported "+plural(rows.length,"estimate"));
}
R.summary=()=>{
 const rows=summaryRows();
 const tot=rows.reduce((n,j)=>n+(+j.total||0),0);
 /* The header used to add the notional retainer percentage into "in fees",

 return `<div class="topbar"><div class="grow"><h1>Estimates</h1>
   <div class="sub2">${plural(rows.length,"estimate")} · ${money0(tot)} written · ${money0(fees)} in fees${held?` · ${money0(held)} covered by retainer`:""}</div></div>
  <button class="btn s" style="margin:0" onclick="exportEstimates()">⬇ Export CSV</button></div>

R.reports=()=>{

  for(let i=7;i>=0;i--){const x=new Date(d);x.setMonth(d.getMonth()-i);
   months.push({k:x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"),
    l:x.toLocaleDateString("en-US",{month:"short"}),v:0});}}
 paid.forEach(j=>{if(j.paidDate){const m=months.find(m=>j.paidDate.slice(0,7)===m.k);if(m)m.v+=fee(j).gross;}});
 const mx=Math.max(1,...months.map(m=>m.v));
 const byLoss={};D.jobs.forEach(j=>{const k=j.loss||"Other";byLoss[k]=byLoss[k]||{n:0,v:0};
  byLoss[k].n++;byLoss[k].v+=fee(j).gross;});
 const forC=D.jobs.filter(j=>forContractor(j)).length;
 const w2=weekStats();
 return `<div class="topbar"><div class="grow"><h1>Analytics</h1>
   <div class="sub2">${plural(D.jobs.length,"job")} all time · ${money0(sum(paid,j=>fee(j).gross))} collected</div></div></div>
 <div class="dashgrid"><div>
  <div class="chartcard" style="margin-top:0">
   <div class="row between"><h2 style="font:600 16px var(--sans);margin:0">Collected by month</h2></div>
   <div class="chart">${months.map(m=>`<div class="cb">
    <div class="cbar" style="height:${Math.max(2,Math.round(m.v/mx*100))}%;${m.v?"":"opacity:.25"}" title="${money0(m.v)}"></div>
    <span class="cl">${m.l}</span></div>`).join("")}</div></div>
  <div class="pan"><div class="lab" style="margin-bottom:6px">By job type</div>
   ${Object.entries(byLoss).sort((a,b)=>b[1].v-a[1].v).map(([k,o])=>`<div class="ins">
    <div class="grow"><b>${esc(k)}</b></div><span class="in3">${plural(o.n,"job")}</span>
    <span class="iv money">${money0(o.v)}</span></div>`).join("")}</div>
 </div><aside class="rail">
  <div class="pan" style="margin-top:0"><div class="lab" style="margin-bottom:6px">Mix</div>
   <div class="ins"><div class="grow"><b>Retainer work delivered</b></div>
    <span class="iv money v-est">${money0(sum(D.jobs.filter(j=>onRetainer(j)&&["Complete","Invoiced","Paid"].includes(j.status)),j=>fee(j).wouldBe))}</span></div>
   <div class="ins"><div class="grow"><b>Contractor work</b></div><span class="iv">${forC}</span></div>

   <div class="ins"><div class="grow"><b>Hours this week</b></div><span class="iv">${(w2.worked/60).toFixed(1)}</span></div>
   <div class="ins"><div class="grow"><b>Late starts</b></div><span class="iv ${w2.lateDays?"v-out":"v-paid"}">${w2.lateDays}</span></div></div>
 </aside></div>`;
};

/* Benny's stated Green Dynasty terms, installed once so they just work.
   Mitigation over $30k → 10% after subs. Remodel → 40% after subs. */
/* Repair days already written by the old single-pair clock: out <= in is the
   signature of a second clock-in overwriting the first. The out belonged to the
   FIRST segment; the in that overwrote it started a SECOND. Split them rather
   than deleting, so no worked time is invented or thrown away. */
function fixClockDays(){
 if(D.clockFixed2)return;
 try{
  const c=CK_();let n=0;
  Object.keys(c.days||{}).forEach(k=>{
   const rec=c.days[k];if(!rec||Array.isArray(rec.segs))return;
   if(!rec.in)return;
   if(rec.out&&mins(rec.out)<=mins(rec.in)){
    /* first segment ended at the recorded out; the later in opened a new one */
    rec.segs=[{in:rec.out,out:rec.out},{in:rec.in,out:null}];
    rec.segs[0].in=rec.out;rec.segs[0].out=rec.out;   /* zero-length: unknowable start */
    rec.in=rec.segs[0].in;delete rec.out;n++;
   }else{
    rec.segs=[{in:rec.in,out:rec.out||null}];
   }
  });
  D.clockFixed2=true;save();
  if(n)setTimeout(()=>toast(plural(n,"day")+" of impossible clock time repaired"),1200);
 }catch(e){}
}
function seedDeals(){

  if(gd&&!Array.isArray(gd.rules)){
   gd.rules=[
    {id:uid(),loss:["Mitigation","Water","Mold"],minTotal:30000,pct:10,mode:"aftersubs"},
    {id:uid(),loss:["Remodel","Rebuild"],minTotal:0,pct:40,mode:"aftersubs"}
   ];
  }
  /* apply to jobs that haven't been billed yet — never rewrite a sent invoice */
  let n=0;
  (D.jobs||[]).forEach(j=>{
   if(["Invoiced","Paid"].includes(j.status))return;
   if(applyAcctRule(j))n++;
  });
  D.dealsSeeded=true;save();
  if(n)setTimeout(()=>toast(plural(n,"job")+" set to the Green Dynasty rate"),900);
 }catch(e){}
 seedDealsV2();
}
/* v1 seeded the mit rule against the literal word "Mitigation", but his mit

function seedDealsV2(){
 try{
  if(D.dealsSeeded2)return;
  const gd=(typeof ACCOUNTS==="function"?ACCOUNTS():[])
   .find(a=>normAcct(a.name)===normAcct("Green Dynasty Group"));
  if(gd&&Array.isArray(gd.rules)){
   gd.rules.forEach(r=>{
    if(r.loss==="Mitigation")r.loss=["Mitigation","Water","Mold"];

   });
  }
  D.dealsSeeded2=true;save();
 }catch(e){}
}
/* ---- same-browser tabs -----------------------------------------------------
   localStorage is one shared board, but each open tab held its own copy in
   memory. A background tab saving — clock tick, AI ping, sync timer — wrote its
   STALE copy straight over whatever was just typed in the front tab. With four
   tabs open, a freshly entered estimate total lived for seconds. Every tab now
   adopts the newest copy the instant any other tab writes. */
function adoptStored(){
 try{
  if(document.getElementById("ov"))return;          /* never under an open form */
  const ae=document.activeElement;
  if(ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;  /* never mid-keystroke */
  const raw=localStorage.getItem(K);if(!raw)return;
  const inc=JSON.parse(raw);
  if((inc._ts||0)>(D._ts||0)){
   D=Object.assign({},JSON.parse(JSON.stringify(BLANK)),inc);
   applyTheme();render();
  }
 }catch(e){}
}
window.addEventListener("storage",e=>{if(e.key===K)adoptStored();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)adoptStored();});
