[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# never let the shell go stale
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /v2 is retired. Its code lives in _retired/ (unpublished) and in git history.
# Any bookmark lands on production instead of a second, diverging app.
[[redirects]]
  from = "/v2"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v2/*"
  to = "/"
  status = 301
  force = true
