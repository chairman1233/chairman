<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>Chairman Estimating</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
/* Phone-first. One-handed. Wet floor. Dark. Large tap targets. */
:root{
 --bg:#0B0C0E; --card:#15171A; --card2:#1D2024; --line:#282C31; --line2:#3A4046;
 --ink:#EEF1F4; --ink2:#9BA4AD; --ink3:#6B747D;
 --go:#4ADE80; --wait:#FBBF24; --cold:#60A5FA; --hot:#F87171; --acc:#4d6be0;
 --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 --mono:ui-monospace,Menlo,Consolas,monospace;
 --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{padding:0 0 calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:40;background:rgba(11,12,14,.94);
 backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
 padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.hd{display:flex;align-items:center;gap:12px}
/* HIS MARK IS BLACK ON WHITE. It is not redrawn, stretched or inverted —
   it sits on its own white plate so the original file reads correctly on a
   dark shell, exactly as it does on paper. */
.plate{width:38px;height:38px;flex:none;background:#fff;border-radius:9px;
 display:grid;place-items:center;padding:5px}
.plate img{width:100%;height:100%;object-fit:contain;display:block}
.hd h1{font:700 15px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:0}
.hd .sub{font:11px var(--mono);color:var(--ink3);margin-top:3px;letter-spacing:.04em}
.hd .grow{flex:1;min-width:0}
.chip{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;
 padding:5px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.on{border-color:var(--go);color:var(--go)}
.chip.warn{border-color:var(--wait);color:var(--wait)}

h2.sec{font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;
 color:var(--ink3);margin:26px 0 10px}

/* the six buckets */
.bk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
 background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:10px;min-height:var(--tap)}
.bk:active{background:var(--card2)}
.bk .n{font:700 26px/1 var(--mono);min-width:42px;text-align:center}
.bk .t{flex:1;min-width:0}
.bk .t b{display:block;font:600 16px var(--sans)}
.bk .t span{display:block;font:13px var(--sans);color:var(--ink3);margin-top:2px}
.bk .go{font:600 11px var(--mono);color:var(--ink3);letter-spacing:.06em}
.bk.z{opacity:.4}
.bk.z .n{color:var(--ink3)}
.bk[data-k=send] .n{color:var(--go)} .bk[data-k=bill] .n{color:var(--go)}
.bk[data-k=await] .n{color:var(--wait)} .bk[data-k=unpaid] .n{color:var(--hot)}
.bk[data-k=noesx] .n{color:var(--cold)} .bk[data-k=walks] .n{color:var(--cold)}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
 background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:14px;margin-bottom:8px;min-height:var(--tap)}
.row:active{background:var(--card2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font:600 15px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font:12.5px var(--sans);color:var(--ink3);margin-top:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font:700 15px var(--mono);white-space:nowrap}
.amt.unk{color:var(--wait);font-size:11.5px;font-weight:600;letter-spacing:.04em}

.btn{display:block;width:100%;min-height:var(--tap);border-radius:12px;
 background:var(--ink);color:var(--bg);font:700 16px var(--sans);
 margin:14px 0;padding:16px}
.btn:active{opacity:.85}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line2)}
.btn.warn{background:none;color:var(--hot);border:1px solid var(--hot)}
.btn:disabled{opacity:.35}

label{display:block;margin:0 0 14px}
label .t{display:block;font:600 11px var(--sans);letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.in{width:100%;min-height:var(--tap);background:var(--card);color:var(--ink);
 border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:16px}
.in:focus{outline:0;border-color:var(--acc)}
textarea.in{min-height:96px;resize:vertical}

.pan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.ln{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln k{font:12px var(--sans);color:var(--ink3)}
.ln v{font:600 14px var(--sans);text-align:right}
.state{display:inline-block;font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;
 padding:6px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.state.go{border-color:var(--go);color:var(--go)}
.state.warn{border-color:var(--wait);color:var(--wait)}
.state.hot{border-color:var(--hot);color:var(--hot)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
 background:rgba(11,12,14,.96);backdrop-filter:blur(12px);
 border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:11px 4px;font:600 10px var(--sans);letter-spacing:.06em;
 color:var(--ink3);text-transform:uppercase;min-height:var(--tap)}
nav button.on{color:var(--ink)}
nav button i{display:block;font-style:normal;font-size:19px;margin-bottom:3px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
 transform:translateX(-50%);background:var(--ink);color:var(--bg);
 padding:13px 20px;border-radius:999px;font:600 14px var(--sans);z-index:90;
 max-width:88vw;text-align:center}
.warnbox{border:1px solid var(--hot);color:var(--hot);border-radius:12px;
 padding:12px 14px;margin:12px 0;font:13px var(--sans)}
.note{font:13px/1.6 var(--sans);color:var(--ink2);background:var(--card);
 border-left:2px solid var(--line2);border-radius:0 10px 10px 0;padding:11px 13px;margin:8px 0}
.empty{text-align:center;color:var(--ink3);padding:44px 20px;font-size:14px}
/* real forms — prompt() is dead */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
 display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--card);border:1px solid var(--line2);width:100%;
 max-width:520px;border-radius:16px 16px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
 max-height:88vh;overflow:auto}
.sheetbox h3{font:700 17px var(--sans);margin:0 0 16px}
@media(min-width:1024px){.sheet{align-items:center}.sheetbox{border-radius:16px}}
#print{display:none}
#side{display:none}

/* ============ DESKTOP — a real desktop app, not a stretched phone ============
   Persistent left rail, wide working area, buckets as a grid you can see at a
   glance, and the bottom bar gone. Below 1024 the phone layout above stands. */
@media(min-width:1024px){
 body{padding:0;display:block}
 #shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
 #side{display:flex;flex-direction:column;gap:2px;padding:20px 14px;
  background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
 #side .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
 #side .brand b{font:700 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;line-height:1.25}
 #side .brand span{display:block;font:10.5px var(--mono);color:var(--ink3);letter-spacing:.04em;margin-top:3px}
 #side button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:11px 12px;border-radius:10px;color:var(--ink2);font:600 14px var(--sans);min-height:44px}
 #side button i{font-style:normal;font-size:16px;width:20px;text-align:center;color:var(--ink3)}
 #side button:hover{background:var(--card2);color:var(--ink)}
 #side button.on{background:var(--card2);color:var(--ink)}
 #side button.on i{color:var(--acc)}
 #side .sp{flex:1}
 #side .foot{padding:10px 12px;border-top:1px solid var(--line);margin-top:8px}
 nav{display:none}
 header{position:sticky;top:0;background:rgba(11,12,14,.9);padding:18px 0 14px}
 header .plate,header .hd h1{display:none}       /* the brand lives in the rail */
 .wrap{max-width:1180px;padding:0 32px}
 .hd .sub{font-size:12.5px;margin:0}
 main.wrap{padding-top:4px;padding-bottom:56px}
 h2.sec{margin:30px 0 12px;font-size:11.5px}
 /* the six buckets, three across — the whole morning in one look */
 .bkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
 .bk{margin:0;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;min-height:132px}
 .bk .n{font-size:38px;min-width:0;text-align:left}
 .bk .t b{font-size:15.5px}
 .bk .go{display:none}
 /* rows get room for the money and the company */
 .row{padding:15px 18px}
 .row .t b{font-size:15.5px}
 .row .amt{font-size:16px}
 /* the job screen reads as two columns on a wide monitor */
 .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
 .btn{max-width:340px}
 .btn.wide{max-width:none}
 .pan{padding:20px}
 .in,textarea.in{max-width:520px}
}
@media(min-width:1440px){ .wrap{max-width:1320px} }

@media print{
 body>*{display:none!important}
 #print{display:block!important;color:#000;background:#fff}
 @page{size:letter;margin:.5in}
}
</style></head>
<body>
<div id="shell">
 <aside id="side"></aside>
 <div>
  <header><div class="wrap hd">
   <span class="plate"><img id="mark" alt="Chairman Estimating Co" src="../logo-print.jpg"></span>
   <div class="grow"><h1>Chairman Estimating</h1><div class="sub" id="sub">loading</div></div>
   <button class="chip" id="syncChip" onclick="pull()">sync</button>
  </div></header>
  <main class="wrap" id="app"></main>
 </div>
</div>
<div id="print"></div>
<nav id="nav"></nav>

<script src="./core.js"></script>
<script src="./migrate.js"></script>
<script>
/* ---- HIS MARK, from his own file. Never a substitute I drew.
   The source is a 3D render: black mark, thin square frame, soft drop shadow,
   on white. Measured off the file, the mark itself sits at x 26.9–71.2%,
   y 23.6–75.3%. Crop to that, hard-cut everything lighter than the mark, and
   paint it — white for the dark UI, black for paper. ---- */
const MARK_BOX={x:0.269,y:0.236,w:0.443,h:0.517,pad:0.02};
let _markDark="";
function buildMark(src,rgb){
 return new Promise(res=>{
  const img=new Image();img.crossOrigin="anonymous";
  img.onload=()=>{
   try{
    const W=img.naturalWidth,H=img.naturalHeight,p=MARK_BOX.pad;
    const sx=W*(MARK_BOX.x-p), sy=H*(MARK_BOX.y-p);
    const sw=W*(MARK_BOX.w+p*2), sh=H*(MARK_BOX.h+p*2);
    const side=Math.max(sw,sh);
    const c=document.createElement("canvas");c.width=c.height=512;
    const x=c.getContext("2d");
    x.drawImage(img,sx-(side-sw)/2,sy-(side-sh)/2,side,side,0,0,512,512);
    const d=x.getImageData(0,0,512,512);
    for(let i=0;i<d.data.length;i+=4){
     const lum=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
     if(lum>135){d.data[i+3]=0;}                       /* frame + shadow gone */
     else{d.data[i]=rgb[0];d.data[i+1]=rgb[1];d.data[i+2]=rgb[2];d.data[i+3]=255;}
    }
    x.putImageData(d,0,0);res(c.toDataURL("image/png"));
   }catch(e){res("");}
  };
  img.onerror=()=>res("");
  img.src=src;
 });
}
/* The mark is NEVER recoloured for the screen — it is his file, black, on the
   white plate. The only processing is cropping away the render's frame and
   drop shadow, which are photographic artefacts, not the mark. */
async function loadMarks(){
 _markDark=await buildMark("../logo-print.jpg",[0,0,0]);
 const el=document.getElementById("mark");
 if(el&&_markDark)el.src=_markDark;
 const s=document.getElementById("sideMark");
 if(s&&_markDark)s.src=_markDark;
}

/* ===================== state ===================== */
const CLOUD={url:"https://sxfchjywhdvpzcnldrym.supabase.co",
             key:"sb_publishable_mH4-N3aJ21twFJqpuBhrnw_gfdMMnee"};
const BLANK={v:2,accounts:[],jobs:[],subCosts:[],scanDays:[],payments:[],notes:[],
             me:{},seq:{invNo:1010},log:[]};
let D=BLANK, V="today", ARG={}, SESS=null, busy=false;
try{SESS=JSON.parse(localStorage.getItem("chairman_sess")||"null")}catch(e){}
try{const raw=localStorage.getItem("chairman_est_v0");if(raw)D=Object.assign({},BLANK,JSON.parse(raw));}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>n==null?"—":"$"+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>n==null?"—":"$"+Math.round(+n).toLocaleString("en-US");
const fmt=d=>{if(!d)return "—";const x=new Date(String(d).slice(0,10)+"T12:00:00");
 return x.toLocaleDateString("en-US",{month:"short",day:"numeric"});};
const ago=d=>d?Math.max(0,Math.round((new Date(today())-new Date(String(d).slice(0,10)))/864e5)):null;
const acct=id=>D.accounts.find(a=>a.id===id)||{};
/* who is paying. A direct job has no GC account — the homeowner is the payer,
   which is the ONLY thing that changes. */
const payerOf=j=>j&&j.direct
 ? {name:j.ownerLabel||"Homeowner",contact:"",phone:j.ownerPhone||"",email:"",terms:"",direct:true}
 : acct(j&&j.accountId);
const payerName=j=>j&&j.direct?(j.ownerLabel||"Homeowner")+" — direct":(acct(j.accountId).name||"");
const job=id=>D.jobs.find(j=>j.id===id);
const shortAddr=a=>String(a||"").split(",")[0].trim();
const jobLabel=j=>shortAddr(j.address)||j.ownerLabel||"Untitled";
const feeFor=j=>Core.feeOf(j,D.accounts,D.subCosts);
const notesFor=id=>D.notes.filter(n=>n.jobId===id);

/* ===================== the outbox =====================
   A write is never dropped. It is written to this device first, marked dirty,
   and pushed. If a push is already running or the network is gone, it STAYS
   dirty and the retry loop keeps trying. The header always says which of those
   is true — queued, saving, synced, or failed. No silent losses. */
let dirty=false, lastPushErr="";
function save(){
 D._ts=Date.now(); dirty=true;
 try{localStorage.setItem("chairman_est_v0",JSON.stringify(D))}catch(e){}
 chip();
 clearTimeout(save._t);save._t=setTimeout(push,400);
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;
 document.body.appendChild(t);setTimeout(()=>t.remove(),2300);}
function go(v,a){V=v;ARG=a||{};window.scrollTo(0,0);render();}

/* ===================== cloud ===================== */
const url=p=>CLOUD.url+p;
const hdr=()=>({apikey:CLOUD.key,authorization:"Bearer "+(SESS&&SESS.access_token),"content-type":"application/json"});
let syncAt=0,syncErr="";
async function api(p,o){
 const r=await fetch(url(p),Object.assign({headers:hdr()},o||{}));
 if(r.status===401&&SESS&&SESS.refresh_token){
  const rr=await fetch(url("/auth/v1/token?grant_type=refresh_token"),{method:"POST",
   headers:{apikey:CLOUD.key,"content-type":"application/json"},
   body:JSON.stringify({refresh_token:SESS.refresh_token})});
  if(rr.ok){SESS=await rr.json();localStorage.setItem("chairman_sess",JSON.stringify(SESS));
   return fetch(url(p),Object.assign({headers:hdr()},o||{}));}
 }
 return r;
}
async function pull(){
 if(!SESS)return render();
 try{
  const r=await api("/rest/v1/boards_v2?select=data,updated_at&user_id=eq."+SESS.user.id);
  if(!r.ok){syncErr="sync failed";return render();}
  const rows=await r.json();syncAt=Date.now();syncErr="";
  if(!rows.length){await firstRun();push();return render();}
  const rem=rows[0],rts=new Date(rem.updated_at).getTime();
  if(!rem.data||!(rem.data.jobs||[]).length){await firstRun();return render();}
  const mine=(D.jobs||[]).length,theirs=(rem.data.jobs||[]).length;
  /* an empty device never overwrites a cloud with real work */
  if(!mine&&theirs){D=Object.assign({},BLANK,rem.data);dirty=false;
   localStorage.setItem("chairman_est_v0",JSON.stringify(D));return render();}
  /* NEVER discard a write that hasn't reached the cloud yet. If this device is
     dirty, its copy wins and gets pushed — otherwise tapping "paid" on the
     phone would vanish the moment the desktop's poll came back. */
  /* A device holding far less than the cloud is stale, not authoritative —
     that is how a test seed or a half-loaded tab looks. Take the cloud and
     say so, rather than pushing the thin copy over his real board. */
  if(theirs>mine+2){D=Object.assign({},BLANK,rem.data);dirty=false;
   localStorage.setItem("chairman_est_v0",JSON.stringify(D));
   toast("Restored "+theirs+" jobs from the cloud");return render();}
  if(dirty){push();return render();}
  if(rts>(D._ts||0)+1500){D=Object.assign({},BLANK,rem.data);
   localStorage.setItem("chairman_est_v0",JSON.stringify(D));}
  render();
 }catch(e){syncErr="offline";render();}
}
async function push(){
 if(!SESS||!dirty)return;
 if(busy){return;}                      /* still dirty — the retry loop gets it */
 if(!(D.jobs||[]).length&&!(D.accounts||[]).length){dirty=false;return;}
 busy=true;chip();
 const stamp=D._ts;
 try{
  const r=await api("/rest/v1/boards_v2?on_conflict=user_id",{method:"POST",
   headers:Object.assign(hdr(),{prefer:"resolution=merge-duplicates"}),
   body:JSON.stringify([{user_id:SESS.user.id,data:D,updated_at:new Date().toISOString()}])});
  if(r.ok){
   /* only clear the flag if nothing was written WHILE we were pushing */
   if(D._ts===stamp)dirty=false;
   syncAt=Date.now();syncErr="";lastPushErr="";
  }else{lastPushErr="HTTP "+r.status;syncErr="not saved to cloud";}
 }catch(e){lastPushErr=e.message||"offline";syncErr="offline — saved on this device";}
 busy=false;chip();
}
/* the retry loop. Anything still dirty gets pushed again, forever, until it
   lands. This is what makes the phone and the desktop the same job file. */
setInterval(()=>{if(dirty)push();},6000);
addEventListener("online",()=>{if(dirty)push();});
addEventListener("visibilitychange",()=>{if(!document.hidden){if(dirty)push();pull();}});
addEventListener("pagehide",()=>{if(dirty)push();});

function chip(){
 const state=!SESS?["sign in","warn"]
  :busy?["saving…",""]
  :dirty?[(syncErr?"queued · "+syncErr:"queued"),"warn"]
  :syncErr?[syncErr,"warn"]
  :syncAt?["synced "+new Date(syncAt).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),"on"]
  :["syncing…",""];
 const c=$("#syncChip");
 if(c){c.textContent=state[0];c.className="chip "+state[1];}
 const s=document.querySelector("#side .foot button");
 if(s){s.textContent=state[0];s.className="chip "+state[1];}
}

/* FIRST RUN — pull the v1 board and migrate it into the §7 model. Reads the
   old table, never writes to it: the v1 app keeps running untouched, and a
   rollback is just pointing back at it. */
async function firstRun(){
 if(D.jobs&&D.jobs.length)return;
 try{
  const r=await api("/rest/v1/boards?select=data&user_id=eq."+SESS.user.id);
  if(!r.ok)return;
  const rows=await r.json();
  if(!rows.length||!rows[0].data)return;
  const v1=rows[0].data;
  D=Object.assign({},BLANK,Migrate.migrate(v1,today()));
  D.me=Object.assign({name:"Benny Mancillas",phone:"(713) 806-1233",
    email:"benny@chairmanremodeling.com",zelle:"(713) 806-1233",
    zelleName:"Chairman Remodeling Group — Benny Mancillas"},v1.me||{});
  localStorage.setItem("chairman_est_v0",JSON.stringify(D));
  await push();
  toast("Migrated "+D.jobs.length+" jobs");
 }catch(e){console.warn("migration skipped",e);}
}

/* ===================== screens ===================== */
const R={};

/* §4: "Tapping a bucket lists its jobs." That list is Today in list mode, not
   a ninth screen — the spec allows eight and means it. */
R.today=()=>{
 const t=today(), B=Core.buckets(D.jobs,D.accounts,t);
 B.forEach(b=>{if(b.key==="unpaid"||b.key==="bill"||b.key==="send")
   b.money=b.jobs.reduce((n,j)=>{const f=feeFor(j);return n+(f.amount||0)},0);});
 if(ARG.k){
  const b=B.find(x=>x.key===ARG.k);
  if(!b)return `<div class="empty">Gone.</div>`;
  return `<h2 class="sec">${esc(b.title)}</h2>
   ${b.jobs.length?b.jobs.map(jobRow).join(""):`<div class="empty">Nothing in here.</div>`}
   <button class="btn sec" onclick="go('today')">Back</button>`;
 }

/* ===================== actions ===================== */
function advance(id){
 const j=job(id), act=Core.nextAction(j,D.accounts);
 if(!act)return;
 if(act.needs==="walkAt"&&!j.walkAt){ask(id,"walkAt","Walk date","date");return;}
 if(act.to==="Invoiced"){go("invoice",{id});return;}
 if(act.to==="Paid"){markPaid(id);return;}
 j.state=act.to;
 if(act.stamps)j[act.stamps]=today();
 if(act.to==="Released"){j.releasedAt=null;j.state="Paid";go("release",{id});return;}
 save();render();toast(act.label);
}
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);
 return d.toISOString().slice(0,10);};
function doRelease(id){
 const j=job(id);
 if(!Core.canServePdf(j,D.accounts))return toast("Not paid — the file stays locked");
 j.pdfKey=($("#rKey")&&$("#rKey").value.trim())||j.pdfKey||"";
 if(!j.releasedAt)j.releasedAt=today();
 j.state="Released";j.expiresAt=Core.expiryOf(j);
 const v=Core.violations(j,D.accounts,D.jobs);
 if(v.length){j.releasedAt=null;j.state="Paid";return toast(v[0]);}
 save();go("job",{id});toast("Released — link runs to "+fmt(j.expiresAt));
}
/* prompt() is suppressed in an installed PWA, which is why tapping Mark paid
   did nothing on the phone. Everything that used to prompt is a real form. */
function sheet(title,body,onOK,okLabel){
 const s=document.createElement("div");s.className="sheet";
 s.innerHTML=`<div class="sheetbox"><h3>${esc(title)}</h3>${body}
   <button class="btn" id="skOK">${esc(okLabel||"Save")}</button>
   <button class="btn sec" id="skNo">Cancel</button></div>`;
 document.body.appendChild(s);
 const close=()=>s.remove();
 s.querySelector("#skNo").onclick=close;
 s.onclick=e=>{if(e.target===s)close();};
 s.querySelector("#skOK").onclick=()=>{if(onOK(s)!==false)close();};
 setTimeout(()=>{const f=s.querySelector("input,select,textarea");if(f)f.focus();},60);
 return s;
}
function markPaid(id){
 const j=job(id), f=feeFor(j);
 sheet("Mark paid — cleared funds",`
  <label><span class="t">Amount received</span>
   <input class="in" id="pAmt" type="number" inputmode="decimal" step="0.01" value="${f.amount!=null?f.amount.toFixed(2):""}"></label>
  <label><span class="t">How</span>
   <select class="in" id="pSrc">
    <option>Zelle</option><option>Check</option><option>Cash</option><option>Other</option></select></label>
  <label><span class="t">Date it cleared</span>
   <input class="in" id="pDate" type="date" value="${today()}"></label>
  <p style="color:var(--ink3);font-size:13px;margin:0">Paid means cleared funds. "Sent it" is a note, not a payment.</p>`,
 s=>{
  const amt=+s.querySelector("#pAmt").value||0;
  if(!amt){toast("Enter the amount");return false;}
  j.paidAmount=amt;
  j.paidSource=s.querySelector("#pSrc").value;
  j.paidAt=s.querySelector("#pDate").value||today();
  j.state="Paid";
  D.payments.push({id:uid(),amount:amt,clearedAt:j.paidAt,source:j.paidSource,
   matchedInvNo:j.invNo||null,accountId:j.accountId});
  save();render();toast("Paid "+money(amt)+" — off hold");
 },"Mark paid");
}
function issue(id){
 const j=job(id), v=Core.violations(j,D.accounts,D.jobs);
 if(v.length)return toast(v[0]);
 j.invNo="INV-"+Core.nextInvNo(D.jobs);
 j.invDate=today();j.state="Invoiced";
 D.seq.invNo=Core.nextInvNo(D.jobs);
 save();render();toast(j.invNo+" issued");
}
function extend(id){const j=job(id);
 const d=new Date(today()+"T12:00:00");d.setDate(d.getDate()+Core.EXTEND_DAYS);
 j.extendedUntil=d.toISOString().slice(0,10);save();render();
 toast("Extended to "+fmt(j.extendedUntil)+" — bill $"+Core.EXTEND_FEE);}
function ask(id,field,label,type){
 const j=job(id),cur=j[field]||"";
 sheet(label,`<label><span class="t">${esc(label)}</span>
   <input class="in" id="askV" type="${type==="number"?"number":type==="date"?"date":"text"}"
    ${type==="number"?'inputmode="decimal" step="0.01"':""} value="${esc(cur)}"></label>`,
 s=>{const v=s.querySelector("#askV").value;
  if(type==="number"&&!(+v)){toast("Enter a number");return false;}
  j[field]=type==="number"?(+v||0):v;save();render();});
}
function addNote(id){
 sheet("Add a note",`<label><span class="t">Note</span>
   <textarea class="in" id="nText" rows="4"></textarea></label>`,
 s=>{const t=s.querySelector("#nText").value.trim();
  if(!t){toast("Type something");return false;}
  D.notes.unshift({id:uid(),jobId:id,kind:"Note",pin:false,created:new Date().toISOString(),text:t});
  save();render();});
}
function saveTerms(id){acct(id).terms=$("#aTerms").value.trim();save();toast("Terms saved");}
function flipFork(id){const a=acct(id);a.fork=a.fork==="delivery"?"approval":"delivery";save();render();
 toast(a.name+" → "+a.fork);}
function shareText(t){
 if(navigator.share)navigator.share({text:t}).catch(()=>{});
 else{navigator.clipboard&&navigator.clipboard.writeText(t);toast("Copied");}
}
function createJob(){
 const sel=$("#nAcct").value;
 let accountId=sel, direct=false, ownName="", ownPhone="";
 if(sel==="__owner"){
  ownName=$("#nOwnName").value.trim();
  if(!ownName)return toast("Homeowner's name");
  ownPhone=$("#nOwnPhone").value.trim();
  direct=true;accountId="";
 }
 if(sel==="__new"){
  const nm=$("#nCoName").value.trim();
  if(!nm)return toast("Company name");
  const a={id:uid(),name:nm,contact:"",phone:$("#nCoPhone").value.trim(),email:"",
   fork:"delivery",feePct:2,supPct:7.5,banned:false,terms:"",reimbursables:true,ledger:false,rules:[]};
  D.accounts.push(a);accountId=a.id;
 }
 if(!accountId&&!direct)return toast("Pick who called you");
 if(accountId){const a=acct(accountId);
  if(a.banned){toast("Call me — no job created");return;}}
 const addr=$("#nAddr").value.trim();
 if(!addr)return toast("Property address");
 const j={id:uid(),accountId,direct,ownerPhone:ownPhone,
  address:addr,access:$("#nAccess").value.trim(),
  claimNo:$("#nClaim").value.trim(),insurer:"",ownerLabel:ownName,state:"Intake",
  walkAt:null,walkConfirmed:false,scanSource:"matterport",scanDayId:null,
  mportStatus:"",mportLink:"",readyDate:null,loss:"",jobType:"fresh",baseline:null,
  total:0,feeOverride:null,feeOverrideReason:"",deliveredAt:null,approvedAt:null,
  invNo:null,invDate:null,paidAt:null,paidAmount:null,paidSource:"",
  releasedAt:null,expiresAt:null,extendedUntil:null,pdfKey:null,legal:false};
 D.jobs.unshift(j);save();go("job",{id:j.id});toast("Job created");
}
async function signIn(){
 const email=$("#sEmail").value.trim(),password=$("#sPass").value;
 try{
  const r=await fetch(url("/auth/v1/token?grant_type=password"),{method:"POST",
   headers:{apikey:CLOUD.key,"content-type":"application/json"},
   body:JSON.stringify({email,password})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error_description||d.msg||"Sign-in failed");
  SESS=d;localStorage.setItem("chairman_sess",JSON.stringify(d));
  toast("Signed in");await pull();go("today");
 }catch(e){toast(e.message);}
}
/* the invoice document */
async function printInvoice(id){
 const j=job(id),a=acct(j.accountId),f=feeFor(j),me=D.me||{};
 if(f.amount==null){toast("Can't price this yet — "+f.reason);return;}
 if(!_markDark)await loadMarks();          /* letterhead before paper */
 const fork=Core.forkOf(j,D.accounts);
 const S="font-family:Helvetica,Arial,sans-serif";
 $("#print").innerHTML=`
 <div style="${S};color:#000;max-width:7.5in">
  <table style="width:100%;border-collapse:collapse;border-bottom:2pt solid #000"><tr>
   ${_markDark?`<td style="width:46pt;padding-bottom:8pt;vertical-align:middle">
     <img src="${_markDark}" alt="" style="width:42pt;height:42pt;object-fit:contain"></td>`:""}
   <td style="padding-bottom:8pt${_markDark?";padding-left:11pt":""}">
    <div style="font:bold 15pt Helvetica;letter-spacing:2pt">CHAIRMAN ESTIMATING CO</div>
    <div style="font:9pt Helvetica;color:#444;margin-top:3pt">
     ${esc(me.name||"Benny Mancillas")} · ${esc(me.phone||"(713) 806-1233")} · ${esc(me.email||"benny@chairmanremodeling.com")}</div></td>
   <td style="text-align:right;padding-bottom:8pt">
    <div style="font:bold 22pt Helvetica">INVOICE</div>
    <div style="font:10pt Helvetica;color:#444">${esc(j.invNo||"")}</div></td>
  </tr></table>
  <table style="width:100%;margin-top:12pt;font:10pt/1.5 Helvetica"><tr>
   <td style="vertical-align:top;width:55%"><b>BILL TO</b><br>${esc(j.direct?(j.ownerLabel||"Homeowner"):a.name)}<br>
    ${esc(j.direct?(j.ownerPhone||""):(a.contact||""))}${!j.direct&&a.phone?"<br>"+esc(a.phone):""}</td>
   <td style="vertical-align:top"><b>PROPERTY</b><br>${esc(j.address)}
    ${j.claimNo?"<br>Claim "+esc(j.claimNo):""}<br>Date ${fmt(j.invDate||today())}</td>
  </tr></table>
  <table style="width:100%;border-collapse:collapse;margin-top:16pt;font:10.5pt Helvetica">
   <tr style="border-top:1.25pt solid #000;border-bottom:1.25pt solid #000">
    <th style="text-align:left;padding:7pt 0;letter-spacing:.6pt">DESCRIPTION</th>
    <th style="text-align:right;padding:7pt 0;letter-spacing:.6pt">AMOUNT</th></tr>
   <tr><td style="padding:10pt 0;border-bottom:.5pt solid #ccc">
     Xactimate estimate — ${esc(j.loss||"insurance")} loss<br>
     <span style="font-size:9pt;color:#444">${esc(f.reason)} · estimate ${money(j.total)}</span></td>
    <td style="text-align:right;padding:10pt 0;border-bottom:.5pt solid #ccc;font-weight:bold">${money(f.amount)}</td></tr>
   <tr><td style="text-align:right;padding:10pt 0;font-weight:bold">TOTAL DUE</td>
    <td style="text-align:right;padding:10pt 0;font:bold 14pt Helvetica;border-bottom:3pt double #000">${money(f.amount)}</td></tr>
  </table>
  <div style="margin-top:14pt;border:1.25pt solid #000;padding:9pt 11pt;font:10pt/1.6 Helvetica">
   <b>ZELLE</b> ${esc(me.zelle||me.phone||"(713) 806-1233")}<br>
   <b>REGISTERED TO</b> ${esc(me.zelleName||"Chairman Remodeling Group — Benny Mancillas")}</div>
  <div style="margin-top:9pt;padding:7pt 10pt;border:1.25pt solid #000;font:bold 10pt Helvetica;text-align:center">
   ${fork==="approval"
     ? "THE ESTIMATE HAS BEEN DELIVERED. PAYMENT IS DUE ON CARRIER APPROVAL."
     : "THE COMPLETED ESTIMATE IS RELEASED ONCE PAYMENT IS RECEIVED."}</div>
  ${a.terms?`<div style="margin-top:12pt;font:9pt/1.5 Helvetica;color:#222">${esc(a.terms)}</div>`:""}
 </div>`;
 /* The document used to be wiped on a 600ms timer. window.print() blocks on a
    desktop browser but NOT on a phone, so the page was cleared while the sheet
    was still rendering — blank or half-drawn pages. Clear on afterprint. */
 const was=document.title;
 document.title=[j.invNo||"INVOICE",a.name,shortAddr(j.address),today()].filter(Boolean).join(" — ");
 let done=false;
 const cleanup=()=>{if(done)return;done=true;
  document.title=was;document.getElementById("print").innerHTML="";
  removeEventListener("afterprint",cleanup);};
 addEventListener("afterprint",cleanup);
 setTimeout(()=>{try{window.print();}catch(e){toast("Print blocked by the browser");}
  setTimeout(cleanup,20000);},150);        /* long backstop only */
}

 const open=D.jobs.filter(j=>!j.legal&&!["Released","Paid","Lost"].includes(j.state)).length;
 return `<div class="brand"><span class="plate"><img id="sideMark" alt="" src="${_markDark||"../logo-print.jpg"}"></span>

  <div class="foot"><button class="chip" onclick="pull()" style="width:100%">${syncErr||(syncAt?"synced":"syncing")}</button></div>`;

function render(){
 if(!SESS){$("#app").innerHTML=R.signin();$("#nav").innerHTML="";$("#side").innerHTML="";
  $("#sub").textContent="not signed in";chip();return;}
 $("#app").innerHTML=(R[V]||R.today)();
 $("#nav").innerHTML=NAV.map(([k,i,l])=>`<button class="${V===k?"on":""}" onclick="go('${k}')">
   <i>${i}</i>${l}</button>`).join("");
 $("#side").innerHTML=sideHTML();
 const open=D.jobs.filter(j=>!j.legal&&!["Released","Paid","Lost"].includes(j.state)).length;
 $("#sub").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})
   +" · "+open+" open";
 chip();
}

setInterval(pull,25000);
loadMarks();render();pull();
